  <blockquote class="th-quote">«Es semejante el alma a cierta fuerza natural que mantiene un carro y su auriga, sostenidos por alas (…). El conductor guía una pareja de caballos; de los caballos, el uno es hermoso, bueno (…); el otro, está constituido de elementos contrarios y es él mismo contrario. En consecuencia, en nosotros resulta necesariamente dura y difícil la conducción».</blockquote>
  <div class="soul">
    <div class="soul-i s1">
      <span class="soul-tag">Alma racional · <i>logistikón</i></span>
      <b>El auriga</b>
      <span class="soul-sub">Contemplar · guiar · ordenar</span>
      <p>De naturaleza divina e inmortal, situada en la <b>cabeza</b>. Puro pensar; se ocupa de la contemplación suprasensible de la verdad y de conducir el carro.</p>
      <div class="soul-f"><span>Virtud: <b>prudencia</b></span><span>Clase: <b>gobernantes</b></span></div>
    </div>
    <div class="soul-i s2">
      <span class="soul-tag">Alma irascible · <i>thymoeides</i></span>
      <b>El caballo noble</b>
      <span class="soul-sub">Valor · honor · obediencia</span>
      <p>Fuente de pasiones nobles (valor, ira, esperanza, ambición), situada en el <b>pecho</b>, separable del cuerpo y, por tanto, mortal. El caballo obediente.</p>
      <div class="soul-f"><span>Virtud: <b>fortaleza</b></span><span>Clase: <b>guardianes</b></span></div>
    </div>
    <div class="soul-i s3">
      <span class="soul-tag">Alma concupiscible · <i>epithymetikón</i></span>
      <b>El caballo rebelde</b>
      <span class="soul-sub">Apetitos · deseos · instintos</span>
      <p>Fuente de pasiones innobles y de las funciones fisiológicas y los apetitos, situada en el <b>vientre</b>, separable del cuerpo y mortal.</p>
      <div class="soul-f"><span>Virtud: <b>moderación</b></span><span>Clase: <b>productores</b></span></div>
    </div>
  </div>
  <div class="th-key"><span class="th-key-l">Aunque tripartita, es dualista</span><p>Platón divide el alma en dos: <b>alma inmortal</b> (racional) y <b>alma mortal</b> (irascible y concupiscible). Esta división anticipa su política: el principio de <b>correlación estructural</b> entre alma y Estado, junto al de <b>especialización funcional</b>.</p></div>

  <h3 class="th-h3">Inmortalidad y transmigración del alma</h3>
  <p class="th-p">Ambas teorías son herencia de la tradición <b>órfica y pitagórica</b>. Argumentos para demostrar la inmortalidad:</p>
  <div class="args">
    <div class="arg g1"><span class="arg-t">Anamnesis</span><p>El alma recuerda las Ideas que conoció: pasa de una preexistencia a una existencia unida al cuerpo, y lo natural es que vuelva después a la contemplación de las Ideas.</p><span class="arg-r">Fedón, 72</span></div>
    <div class="arg g2"><span class="arg-t">Simplicidad</span><p>Solo se corrompe lo compuesto. El alma conoce las Ideas, que son simples, luego también es simple. Lo simple no puede corromperse ni morir.</p><span class="arg-r">República, 608</span></div>
    <div class="arg g3"><span class="arg-t">Automovimiento</span><p>Alma es vida, principio de movimiento que no viene de fuera sino de su propia naturaleza. Siempre estará en movimiento: siempre tendrá vida.</p><span class="arg-r">Las Leyes, 895</span></div>
  </div>
  <p class="th-p">Las almas salen del Demiurgo iguales y eternas y se encarnan en un cuerpo. Tras la muerte peregrinan <b>unos mil años</b>, encarnándose en varios cuerpos y <b>eligiendo su destino</b>: en esa elección reside un enorme peligro.</p>
  <div class="ladder" aria-label="Jerarquía de reencarnaciones">
    <span class="ladder-cap">Jerarquía de vidas según el grado de virtud</span>
    <ol>
      <li><span><b>Filósofo</b> o amante de la belleza</span></li>
      <li><span><b>Rey</b> respetuoso de la ley, guerrero u hombre de Estado</span></li>
      <li><span>Político, administrador o <b>comerciante</b></span></li>
      <li><span><b>Atleta</b> o médico</span></li>
      <li><span>Adivino o <b>sacerdote</b></span></li>
      <li><span><b>Poeta</b> o imitador</span></li>
      <li><span><b>Artesano</b> o labrador</span></li>
      <li><span><b>Sofista</b> o demagogo</span></li>
      <li><span><b>Tirano</b></span></li>
    </ol>
  </div>
  <div class="th-grid2">
    <div class="th-key"><span class="th-key-l">Sentido del mito</span><p><b>Libertad y responsabilidad</b>: los modelos de vida elegidos expresan la esencia y el carácter de cada ser humano.</p></div>
    <div class="th-key warn"><span class="th-key-l">Crítica</span><p>Esta escala refleja un cierto <b>clasismo antropológico</b>: preferencia por la aristocracia, nostalgia política y desprecio por los trabajadores.</p></div>
  </div>
  <p class="th-p">Con Platón queda consolidado el <b>abismo entre espíritu y materia</b>, rompiendo la concepción unitaria del ser humano.</p>
</section>

<!-- 3.3 -->
<section class="card th" id="pl-onto">
  ${secHead("3.3","Ontología","Presidida por la más importante de sus teorías, la <b>teoría de las Ideas o de las Formas</b>, que impregna todo su pensamiento. Aparece por primera vez en el <i>Fedón</i> y en la <i>República</i>.")}
  ${vInline(a,2)}
  <div class="dialog">
    <p><span>—</span>¿Admitimos que existe lo Justo en sí, o lo negamos?</p>
    <p class="r"><span>—</span>Lo afirmamos, sin duda, ¡por Zeus!</p>
    <p><span>—</span>¿E igualmente lo Bello y lo Bueno?</p>
    <p class="r"><span>—</span>¡Cómo no!</p>
    <p><span>—</span>¿Pero los has visto alguna vez con tus ojos?</p>
    <p class="r"><span>—</span>Nunca.</p>
  </div>
  <p class="th-p">Además de las cosas buenas, justas o bellas existen el Bien, la Justicia y la Belleza en sí. Las Ideas <b>no son conceptos mentales</b>: son realidades independientes de las cosas. Más aún, <b>son la realidad misma</b>.</p>
  <div class="attr"><span>Únicas</span><span>Eternas</span><span>Inmutables</span><span>Inalterables</span><span>Solo captables por la inteligencia</span><span>Causa de las cosas</span><span>Fundamento de nuestros juicios</span></div>
  <p class="tiny muted" style="margin-top:6px">Poseen los atributos del Ser de Parménides.</p>

  <h3 class="th-h3">Dualismo ontológico: dos mundos</h3>
  <div class="worlds">
    <div class="world sens">
      <span class="world-t">Mundo sensible</span>
      <ul><li>Cosas <b>múltiples</b></li><li>En <b>devenir</b> constante (Heráclito)</li><li>Menos reales, <b>aparentes</b></li><li>Captables por los <b>sentidos</b></li><li>No propiamente inteligibles</li></ul>
    </div>
    <div class="world-arrow"><span>participa de</span><span>imita a</span></div>
    <div class="world int">
      <span class="world-t">Mundo inteligible</span>
      <ul><li>Ideas <b>únicas</b></li><li><b>Eternas</b> e inmutables (Parménides)</li><li><b>Plenamente reales</b></li><li>Captables por la <b>inteligencia</b></li><li>Modelo o paradigma de lo sensible</li></ul>
    </div>
  </div>
  <div class="th-grid2">
    <div class="th-key"><span class="th-key-l">Participación e imitación</span><p>Las cosas <b>participan</b> de las Ideas y las <b>imitan</b>. Una cosa es bella gracias a la Idea de Belleza, y por eso podemos decir que lo es. El mundo sensible es real en cuanto participa de las Ideas.</p></div>
    <div class="th-key"><span class="th-key-l">Las Ideas hacen posible la ciencia</span><p>Igual que la botánica no estudia este pino o aquel ciprés, sino que asciende a «conífera», «árbol», «vegetal», «ser vivo», la filosofía estudia las Ideas, es decir, los <b>fundamentos</b>.</p></div>
  </div>
  <p class="th-p">Si al ver un árbol percibo su apariencia, ¿dónde está su esencia? En la Idea, el ser del árbol, el <i>ontos on</i>. La tarea del filósofo es sacar a los hombres de las apariencias y llevarlos al Mundo que Es. Las Ideas tienen entidad <b>ontológica y epistemológica</b>: se funden el ser y el pensar.</p>

  <h3 class="th-h3">Jerarquía de las Ideas</h3>
  <div class="pyr-wrap">
    <svg class="pyr" viewBox="0 0 360 240" role="img" aria-label="Pirámide de las Ideas con el Bien en la cúspide">
      <polygon points="180,10 230,78 130,78" fill="var(--orange)"/>
      <polygon points="130,84 230,84 268,136 92,136" fill="var(--ochre)"/>
      <polygon points="92,142 268,142 306,194 54,194" fill="var(--petrol)" opacity=".75"/>
      <polygon points="54,200 306,200 340,236 20,236" fill="var(--petrol)" opacity=".4"/>
      <text x="180" y="62" text-anchor="middle" font-family="Sora,sans-serif" font-size="13" font-weight="800" fill="#fff">BIEN</text>
      <text x="180" y="115" text-anchor="middle" font-family="Sora,sans-serif" font-size="12" font-weight="800" fill="#fff">Belleza · Justicia</text>
      <text x="180" y="173" text-anchor="middle" font-family="Manrope,sans-serif" font-size="12" font-weight="800" fill="#fff">Ideas superiores</text>
      <text x="180" y="223" text-anchor="middle" font-family="Manrope,sans-serif" font-size="12" font-weight="800" fill="var(--ink)">Ideas subordinadas</text>
    </svg>
    <div class="th-stack">
      <div class="pyr-i"><b class="o">Idea de Bien</b><span>La «Idea de las Ideas», causa última de la verdad y del ser. Como el <b>Sol</b> nos hace ver los objetos sensibles, el Bien nos hace comprender las Ideas.</span></div>
      <div class="pyr-i"><b class="y">Idea de Belleza</b><span>Baña en luz y claridad el mundo físico, al que vuelve bello.</span></div>
      <div class="pyr-i"><b class="y">Idea de Justicia</b><span>Regula las tres partes del alma, las tres clases sociales y las tres virtudes.</span></div>
      <p class="small muted">En la posesión de estas tres Ideas reside la <b>sabiduría</b>.</p>
    </div>
  </div>
</section>

<!-- 3.4 -->
<section class="card th" id="pl-episte">
  ${secHead("3.4","Epistemología","Gracias a las Ideas, la ciencia tiene un objeto estable y palabras como «justicia» o «belleza» dejan de ser convencionales, como decían los sofistas. Pero surge un problema: <b>¿cómo conocer las Ideas si pertenecen a otro mundo?</b> Platón responde con dos doctrinas: la reminiscencia y la dialéctica.")}
  ${vInline(a,3)}
  <div class="banner"><span>Ciencia</span><i>=</i><span>Conocimiento</span><i>=</i><span>Bien</span></div>
  <p class="small muted" style="text-align:center;margin-top:-4px">El auténtico conocimiento, el de las Ideas, conduce al Bien: el camino epistemológico termina en el Bien.</p>

  <h3 class="th-h3">La reminiscencia (<i>anámnesis</i>)</h3>
  <div class="th-grid2">
    <div>
      <p class="th-p">La Idea no está «contenida» en las cosas: es una realidad separada. Por eso los sentidos solo dan <b>opinión (<i>doxa</i>)</b> sobre lo que está en devenir. El alma racional e inmortal contempló las Ideas, pero las olvidó al unirse al cuerpo. Como las cosas participan de las Ideas, al verlas el alma puede <b>recordarlas</b>.</p>
      <p class="th-p">El conocimiento sensible no es verdadero, pero tampoco carece de valor: es <b>ocasión para el recuerdo</b>.</p>
    </div>
    <div class="bigword"><span>Conocer es</span><b>recordar</b></div>
  </div>

  <h3 class="th-h3">La dialéctica y el símil de la línea</h3>
  <p class="th-p">En la <i>República</i> Platón clasifica los grados del conocimiento según los grados del ser: si hay dos ámbitos de lo real, habrá dos tipos de conocimiento.</p>
  <div class="line-wrap">
    <div class="line-top"><div><b>Mundo sensible</b><span>Realidad cambiante y múltiple</span></div><div><b>Mundo inteligible</b><span>Realidad verdadera y permanente</span></div></div>
    <div class="line">
      <div class="seg1"><span class="ln">1</span><b>Imaginación</b><i>eikasía</i><p>Imágenes, sombras, apariencias</p><small>Conocimiento más bajo y confuso</small></div>
      <div class="seg2"><span class="ln">2</span><b>Creencia</b><i>pístis</i><p>Cosas sensibles, objetos físicos</p><small>Opinión más firme que la imaginación</small></div>
      <div class="seg3"><span class="ln">3</span><b>Razón discursiva</b><i>diánoia</i><p>Entes matemáticos, relaciones, principios</p><small>Razona y deduce</small></div>
      <div class="seg4"><span class="ln">4</span><b>Inteligencia</b><i>nóesis</i><p>Ideas, en especial la Idea de Bien</p><small>Conocimiento intuitivo, directo y absoluto</small></div>
    </div>
    <div class="line-bot"><div>Conocimiento opinativo · <b>doxa</b></div><div>Conocimiento científico · <b>episteme</b></div></div>
  </div>
  <p class="th-p">El conocimiento es un <b>proceso ascendente</b> cuyo método es la dialéctica. En el <i>Banquete</i>, Diótima enseña a Sócrates a subir de los <b>cuerpos bellos</b> a lo bello en las normas morales y la ciencia, hasta reconocer <b>lo Bello en sí</b>.</p>
  <div class="tblwrap"><table class="tbl dual">
    <thead><tr><th></th><th class="c1">Dialéctica ascendente<small>De lo particular a lo universal</small></th><th class="c2">Dialéctica descendente<small>De lo universal a lo particular</small></th></tr></thead>
    <tbody>
      <tr><th>Punto de partida</th><td>Las cosas sensibles</td><td>La Idea de Bien</td></tr>
      <tr><th>Recorrido</th><td>Asciende desde los objetos particulares hasta las Ideas</td><td>Desciende desde el Bien hasta las demás Ideas y, finalmente, las cosas sensibles</td></tr>
      <tr><th>Culmina en</th><td>El conocimiento de la Idea de Bien</td><td>La comprensión de la jerarquía y dependencia de todas las Ideas</td></tr>
      <tr><th>Objetivo</th><td>Alcanzar el principio supremo de la realidad</td><td>Explicar la estructura del mundo inteligible y su relación con el sensible</td></tr>
    </tbody>
  </table></div>
</section>

<!-- 3.5 -->
<section class="card th" id="pl-etica">
  ${secHead("3.5","Ética y política","El platonismo es, ante todo, un sistema <b>ético-político</b>: el objetivo de su filosofía es la justicia en la polis.")}
  ${vInline(a,4)}
  <h3 class="th-h3">La ética platónica</h3>
  <div class="th-steps">
    <div><b>Frente a los sofistas</b><span>Con Sócrates, los conceptos morales pueden fijarse racionalmente con definiciones rigurosas. Platón les da el estatuto de <b>Ideas</b>, objetivas e independientes de las opiniones.</span></div>
    <div><b>Analizar bien la naturaleza humana</b><span>Los sofistas tomaban como modelo a animales y niños (placer, dominio del más fuerte) y olvidaban lo más propio del ser humano: <b>la razón</b>.</span></div>
    <div><b>Justicia = armonía</b><span>Ordenamiento adecuado de las tres partes del alma: cada una cumple su función y posee su virtud.</span></div>
  </div>
  <div class="virt">
    <div><span class="v-part">Alma racional</span><span class="v-arrow">→</span><b>Prudencia</b></div>
    <div><span class="v-part">Alma irascible</span><span class="v-arrow">→</span><b>Fortaleza</b></div>
    <div><span class="v-part">Alma concupiscible</span><span class="v-arrow">→</span><b>Moderación</b></div>
  </div>

  <h3 class="th-h3">La política platónica</h3>
  <p class="th-p">Su obra más conocida, <i>La República</i>, diseña un sistema político ideal sobre dos principios:</p>
  <div class="th-grid2">
    <div class="principle"><span class="pr-t">Principio de correlación estructural</span><p>El Estado tiene la misma estructura tripartita que el alma.</p></div>
    <div class="principle"><span class="pr-t">Principio de especialización funcional</span><p>Cada individuo y grupo se dedica a la tarea que le es propia por naturaleza, por <b>eficiencia</b> y por su <b>predisposición natural</b>, sin interferir en las de los demás.</p></div>
  </div>
  <div class="tblwrap"><table class="tbl">
    <thead><tr><th>Parte del alma</th><th>Clase social</th><th>Función</th><th>Virtud</th></tr></thead>
    <tbody>
      <tr><td>Racional</td><td><b>Gobernantes</b></td><td>Gobierno</td><td><span class="pill p1">Prudencia</span></td></tr>
      <tr><td>Irascible</td><td><b>Guardianes</b></td><td>Defensa y orden, tareas militares y policiales</td><td><span class="pill p2">Fortaleza</span></td></tr>
      <tr><td>Concupiscible</td><td><b>Productores</b></td><td>Producción de bienes y comercio</td><td><span class="pill p3">Moderación</span></td></tr>
    </tbody>
  </table></div>
  <div class="th-key"><span class="th-key-l">La justicia</span><p>Es la misma para el Estado y para el alma: se realiza cuando cada parte cumple su función con su virtud. En la persona, las partes concupiscible e irascible se dejan guiar por la razón. El resultado es la <b>armonía</b>.</p></div>

  <h3 class="th-h3">El gobierno de los sabios</h3>
  <blockquote class="th-quote">«No cesará en sus males el género humano hasta que los verdaderos filósofos ocupen el gobierno, o bien los que ejercen el poder se conviertan, por algún especial favor divino, en auténticos filósofos». <cite>Carta VII</cite></blockquote>
  <p class="th-p">Estado ideal y utópico; Platón es claramente <b>antidemócrata</b>. Se basa en una discutible identificación del saber teórico y práctico, heredada del <b>intelectualismo moral</b> socrático: quien conoce el Bien sabe a la vez el orden de lo real y las normas morales y políticas. Bajo su gobierno no harían falta leyes.</p>
  <h3 class="th-h3">Formas de gobierno, de mejor a peor</h3>
  <div class="gov">
    <div class="gov-i g1"><span class="gov-n">1</span><div><b>Aristocracia</b><span class="gov-w">Los mejores (uno o varios)</span><p>Gobiernan los más sabios y virtuosos, que conocen el Bien y actúan por toda la ciudad.</p></div><span class="gov-v">La mejor</span></div>
    <div class="gov-i g2"><span class="gov-n">2</span><div><b>Timocracia</b><span class="gov-w">Quienes tienen renta y honor</span><p>Gobiernan los más ambiciosos, movidos por el prestigio. Imperfecta, pero mejor que las siguientes.</p></div><span class="gov-v">Imperfecta</span></div>
    <div class="gov-i g3"><span class="gov-n">3</span><div><b>Oligarquía</b><span class="gov-w">Los ricos, los explotadores</span><p>Mandan quienes buscan su propio interés, puestos y riquezas. Se gobierna para unos pocos.</p></div><span class="gov-v">Injusta</span></div>
    <div class="gov-i g4"><span class="gov-n">4</span><div><b>Democracia</b><span class="gov-w">El pueblo, todos iguales</span><p>Predomina la libertad, sobre todo de hablar, sin autoridad que domine. Perversión del orden, antesala de la tiranía.</p></div><span class="gov-v">Perversión</span></div>
    <div class="gov-i g5"><span class="gov-n">5</span><div><b>Tiranía</b><span class="gov-w">Un solo individuo</span><p>Degradación de la política: no saber usar la libertad obliga a que alguien tome el poder y domine.</p></div><span class="gov-v">La peor</span></div>
  </div>

  <h3 class="th-h3">La educación (<i>paideia</i>)</h3>
  <p class="th-p">El fin del Estado es <b>moral</b>: promover la virtud y la justicia, condición de la felicidad. Por eso la educación es fundamental y <b>competencia exclusiva del Estado</b>.</p>
  <div class="th-grid2">
    <div class="edu e1"><span class="edu-t">Nivel primario</span><span class="edu-s">Común a toda la ciudadanía</span><div class="edu-c"><span>Gimnasia</span><i>+</i><span>Música</span></div><p>La gimnasia cuida el cuerpo (incluye la medicina) y la música educa el carácter: hábitos y opiniones correctas.</p></div>
    <div class="edu e2"><span class="edu-t">Segundo nivel</span><span class="edu-s">Futuros gobernantes · de los 20 a los 35 años</span><div class="edu-c"><span>Matemáticas</span><i>→</i><span>Dialéctica</span></div><p>Primero aritmética, geometría, estereometría, astronomía y armonía musical. Al final, la <b>dialéctica</b>: el uso adecuado de la razón para descubrir la Idea de Bien.</p></div>
  </div>
  <h3 class="th-h3">Otras medidas de la utopía</h3>
  <div class="attr">
    <span>Igualdad absoluta entre hombres y mujeres</span>
    <span>Supresión de la familia (guardianes y gobernantes)</span>
    <span>Abolición de la propiedad privada (guardianes y gobernantes)</span>
  </div>
  <p class="th-p" style="margin-top:10px">Las dos últimas no tienen función económica, como en el marxismo, sino <b>moral</b>: evitar el egoísmo y la corrupción y fomentar el sentimiento de comunidad. Los productores sí conservan familia y propiedad.</p>
  <div class="evo">
    <div><span class="chip a">La República</span><b>Gobierno de los sabios</b></div>
    <span class="evo-a">→</span>
    <div><span class="chip b">Las Leyes</span><b>Gobierno de las leyes</b></div>
  </div>
  <p class="th-p">Al ver que no es fácil encontrar sabios gobernantes, Platón suaviza su postura: los gobernantes deben someterse al ordenamiento jurídico, antecedente del <b>Estado de Derecho</b>. Pero mantiene que a la razón le corresponde gobernar, que el Estado debe hacer mejores a los ciudadanos y que la justicia es condición de la felicidad.</p>
</section>

<!-- 3.6 -->
<section class="card th" id="pl-cosmo">
  ${secHead("3.6","Cosmología","Platón rechaza el atomismo de Demócrito: el orden no puede surgir del desorden sin más. Retoma de Anaxágoras la idea de una inteligencia ordenadora (<i>Nous</i>), el <b>Demiurgo</b>. Frente al mecanicismo, una concepción <b>teleológica</b>.")}
  <div class="args">
    <div class="arg g1"><span class="arg-t">Las Ideas</span><p>Únicas realidades auténticas: inmateriales, absolutas, inmutables y universales. Son el modelo.</p></div>
    <div class="arg g2"><span class="arg-t">El Demiurgo</span><p>Construye el universo mirando a las Ideas como modelos, dando forma al mundo sensible a su imitación.</p></div>
    <div class="arg g3"><span class="arg-t">La materia</span><p>Magma eterno y caótico sobre el que actúa el Demiurgo.</p></div>
  </div>
  <h3 class="th-h3">Movimiento y reposo: Parménides y Heráclito</h3>
  <div class="vs">
    <div class="vs-side"><span class="chip a">Parménides</span><b>Solo el ser es</b><p>Necesario, eterno e idéntico a sí mismo. Platón lo sitúa en el <b>mundo de las Ideas</b>.</p></div>
    <div class="vs-mid">+</div>
    <div class="vs-side"><span class="chip b">Heráclito</span><b>Todo fluye</b><p>Todo es cambiante. Platón acepta su devenir para el <b>mundo sensible</b>.</p></div>
  </div>
  <div class="th-key"><span class="th-key-l">Solución</span><p>El <b>dualismo ontológico</b>, la teoría de los dos mundos, resuelve el problema del movimiento y el reposo, junto con la distinción entre conocimiento intelectual y opinión.</p></div>
</section>

<section class="card th" id="pl-pau">
  ${secHead("PAU","Para el comentario","Fragmentos que entran y cómo enfocar cada cuestión.")}
  <div class="works">${a.works.map(w=>'<div class="work"><span class="wi">'+ICONS.book+'</span><div><b>'+w.t+'</b><span>'+w.d+'</span></div></div>').join("")}</div>
</section>
<p class="tiny muted" style="text-align:right">Apuntes: José Manuel Jiménez y Manuel Higueras</p>
`;},
descartes(a){
  return `
<nav class="th-index" aria-label="Apartados de la teoría">
  <button data-jump="ds-intro">Contexto</button>
  <button data-jump="ds-racio">Racionalismo</button>
  <button data-jump="ds-metodo">Método</button>
  <button data-jump="ds-duda">Duda y cogito</button>
  <button data-jump="ds-sust">Tres sustancias</button>
</nav>

<section class="card th" id="ds-intro">
  ${secHead("6.1","Origen de la modernidad: Renacimiento y Revolución científica","El pensamiento moderno nace en abierto enfrentamiento con la cultura medieval. Primero lo contesta el <b>humanismo renacentista</b>; después, de forma más decisiva, la <b>ciencia moderna</b>, con una imagen heliocéntrica y mecanicista del universo.")}
  ${vInline(a,1)}
  <h3 class="th-h3">El Renacimiento</h3>
  <p class="th-p">Con él se inicia la época moderna, aunque filosóficamente es un <b>periodo de transición</b> entre la filosofía medieval y la moderna. Supone la vuelta a los orígenes clásicos, iniciada en Italia y difundida por toda Europa. Suele fecharse en la <b>caída de Constantinopla (1453)</b>, que provocó la fuga de intelectuales hacia Italia.</p>
  <div class="th-grid2">
    <div class="th-key"><span class="th-key-l">En una sola característica</span><p>La vuelta a los grandes sistemas clásicos y una <b>progresiva laicización</b>, en busca de una nueva concepción del ser humano y de la naturaleza.</p></div>
    <div class="th-key"><span class="th-key-l">Ruptura definitiva</span><p>Entre <b>filosofía y teología</b>: la libertad de pensamiento defiende la autonomía de la razón frente a la fe. Empieza la secularización que culminará en la Ilustración.</p></div>
  </div>
  <p class="th-p">El humanismo lee a los griegos, pero ya no al servicio de la fe: los platónicos renacentistas no lo son como Agustín de Hipona, ni los aristotélicos como Tomás de Aquino.</p>

  <h3 class="th-h3">La Reforma protestante</h3>
  <p class="th-p">Con <b>Lutero</b> y <b>Erasmo de Rotterdam</b>, el cristianismo occidental se fragmenta tras un largo periodo de guerras de religión que consolidan los Estados modernos.</p>
  <div class="tlv">
    <div class="tlv-i"><span class="tlv-y">Antes</span><p>León X inicia la <b>venta de indulgencias</b> para construir la Basílica de San Pedro, algo que Lutero considera contrario a la Biblia.</p></div>
    <div class="tlv-i"><span class="tlv-y">1517</span><p>Lutero clava sus <b>95 tesis</b> en la puerta de la iglesia de Wittenberg: comienzo de la Reforma.</p></div>
    <div class="tlv-i"><span class="tlv-y">1520</span><p>El Papa le exige retractarse con una bula, y Lutero la <b>quema</b> públicamente.</p></div>
    <div class="tlv-i"><span class="tlv-y">1521</span><p>Lutero es <b>excomulgado</b> y declarado hereje.</p></div>
  </div>
  <div class="th-key"><span class="th-key-l">Consecuencia política</span><p>El <b>sacerdocio universal</b> niega la jerarquía eclesiástica. Ese vacío de poder lo aprovechan los príncipes: la Iglesia queda subordinada al Estado y se pasa de la dualidad medieval de poderes a un <b>monopolio del poder político</b>. Es uno de los desencadenantes del <b>absolutismo</b>.</p></div>

  <h3 class="th-h3">La Revolución científica</h3>
  <div class="vs">
    <div class="vs-side"><span class="chip b">Antigüedad y Edad Media</span><b>Geocentrismo</b><p>Paradigma aristotélico-ptolemaico: la Tierra es el centro de un <b>cosmos finito y cerrado</b>, esférico.</p></div>
    <div class="vs-mid">→</div>
    <div class="vs-side"><span class="chip a">Modernidad</span><b>Heliocentrismo</b><p>Introducido por <b>Copérnico</b> en la primera mitad del s. XVI: un <b>universo infinito y abierto</b>, mecanicista.</p></div>
  </div>
  <div class="th-steps">
    <div><b>Copérnico</b><span>Primero: introduce el heliocentrismo.</span></div>
    <div><b>Galileo y Kepler</b><span>Después: consolidan la nueva ciencia.</span></div>
    <div><b>Newton</b><span>Por último: culmina la nueva imagen del universo.</span></div>
  </div>
  <div class="th-key"><span class="th-key-l">Nueva metodología</span><p>Basada en las <b>matemáticas</b> y la <b>experimentación</b>, acaba relegando las ideas científicas que habían imperado durante siglos.</p></div>
</section>

<section class="card th" id="ds-racio">
  ${secHead("6.2","El racionalismo","Descartes inaugura la <b>filosofía moderna</b>, cuya fecha de inicio se sitúa en <b>1637</b>, año del <i>Discurso del método</i>.")}
  ${vInline(a,2)}
  <div class="th-grid2">
    <div>
      <h3 class="th-h3">Vida</h3>
      <div class="tlv">
        <div class="tlv-i"><span class="tlv-y">1596</span><p>Nace en una familia <b>noble y acomodada</b>.</p></div>
        <div class="tlv-i"><span class="tlv-y">1604-1612</span><p>Estudia en el colegio jesuita de <b>La Flèche</b>, donde es educado según la Escolástica.</p></div>
        <div class="tlv-i"><span class="tlv-y">1628-1649</span><p>Vive en <b>Holanda</b>, el país más tolerante de la época, refugio frente a la Inquisición.</p></div>
        <div class="tlv-i"><span class="tlv-y">1637</span><p>Publica el <i>Discurso del método</i>: inicio de la filosofía moderna.</p></div>
        <div class="tlv-i"><span class="tlv-y">1649-1650</span><p>Se traslada a <b>Estocolmo</b> como profesor de la reina Cristina de Suecia, donde muere.</p></div>
      </div>
    </div>
    <div class="th-stack">
      <h3 class="th-h3">Rasgos de la filosofía moderna</h3>
      <div class="infl">
        <div class="infl-i"><b>Autonomía absoluta de la razón</b><span><i>Negativamente</i>: nada exterior (tradición, autoridad, fe) la coarta. <i>Positivamente</i>: la razón es el <b>tribunal supremo</b> que juzga lo verdadero y lo justo, en lo teórico, lo moral y lo político.</span></div>
        <div class="infl-i"><b>Conexión con la ciencia moderna</b><span>El método de Descartes tiene resonancias matemáticas; él mismo aportó la <b>geometría analítica</b> y trabajos de física y biología.</span></div>
      </div>
      <div class="th-key"><span class="th-key-l">Ojo</span><p>Ambos rasgos son de <b>toda la filosofía moderna</b>, no exclusivos del racionalismo.</p></div>
    </div>
  </div>

  <h3 class="th-h3">Racionalismo frente a empirismo</h3>
  <p class="th-p">El racionalismo es la corriente del <b>siglo XVII</b> a la que pertenecen también <b>Leibniz, Spinoza y Malebranche</b>. Se opone al <b>empirismo inglés del siglo XVIII</b>. La diferencia clave está en el <b>origen del conocimiento</b>:</p>
  <div class="vs">
    <div class="vs-side"><span class="chip a">Racionalismo</span><b>La razón</b><p>Nuestros conocimientos válidos acerca de la realidad proceden de la <b>razón misma</b>.</p></div>
    <div class="vs-mid">VS</div>
    <div class="vs-side"><span class="chip b">Empirismo</span><b>La experiencia</b><p>Todos nuestros conocimientos proceden, en último término, de los <b>sentidos</b>.</p></div>
  </div>

  <h3 class="th-h3">Características del racionalismo</h3>
  <div class="ds-feat">
    <div><span>1</span><b>La razón, fuente de conocimiento</b><p>Es la <b>única fuente válida</b> de conocimiento.</p></div>
    <div><span>2</span><b>Crítica del conocimiento sensible</b><p>Se infravalora: los sentidos son <b>engañosos</b>.</p></div>
    <div><span>3</span><b>Conocimiento deductivo</b><p>Se construye deductivamente a partir de unos primeros principios: las ideas innatas.</p></div>
    <div><span>4</span><b>Ideas innatas</b><p>Verdades que se hallan potencialmente en el entendimiento.</p></div>
    <div><span>5</span><b>Ciencia universal y método matemático</b><p>Aspiración a una ciencia universal y necesaria basada en la unidad de la razón.</p></div>
    <div><span>6</span><b>La deducción como método</b><p>El método más adecuado del pensamiento.</p></div>
    <div><span>7</span><b>Racionalidad del mundo</b><p>Todo lo que sucede tiene una justificación que la razón puede conocer: <b>todo lo real es racional</b>.</p></div>
    <div><span>8</span><b>Confianza en la razón</b><p>Confianza absoluta en su capacidad: <b>no hay límites</b> al conocimiento humano.</p></div>
  </div>
</section>

<section class="card th" id="ds-metodo">
  ${secHead("6.3","El método cartesiano","Toda la modernidad está casi obsesionada con el <b>método</b>. Para Descartes es a la vez el <b>punto de partida y la meta</b> de su filosofía.")}
  ${vInline(a,3)}
  <h3 class="th-h3">¿Por qué un nuevo método?</h3>
  <p class="th-p">La <b>Escolástica</b>, fundada en la autoridad de Aristóteles y Tomás de Aquino y aceptada sin análisis crítico, se derrumba. Igual que antes se aceptaba en bloque, ahora se rechaza en bloque. No bastan descubrimientos ocasionales: hace falta un <b>nuevo criterio de verdad</b> que sustituya a la autoridad de la Escolástica, de Aristóteles y de la Biblia. La razón alcanza su «<b>mayoría de edad</b>», como dirá Kant en <i>¿Qué es Ilustración?</i></p>
  <div class="duo">
    <div class="duo-i dim"><span class="duo-t">Método experimental</span><p class="small">Configura el <b>empirismo</b>.</p></div>
    <div class="duo-i lit"><span class="duo-t">Método matemático</span><p class="small">El que elige Descartes: inaugura el <b>racionalismo</b>.</p></div>
  </div>

  <h3 class="th-h3">La unidad del saber</h3>
  <blockquote class="th-quote">«Todas las diversas ciencias no son otra cosa que la sabiduría humana, la cual permanece una e idéntica, aun cuando se aplique a objetos diversos, y no recibe de ellos más distinción que la que recibe la luz del sol de los diversos objetos que ilumina». <cite>Reglas para la dirección del espíritu</cite></blockquote>
  <p class="th-p">La sabiduría es <b>única porque la razón es única</b>: la misma razón distingue lo verdadero de lo falso y ordena la conducta. Las ciencias forman una unidad orgánica:</p>
  <div class="ds-tree" aria-label="Árbol del saber">
    <div class="ds-tree-r"><span class="ds-tree-l">Ramas</span><b>Medicina · Mecánica · Moral</b></div>
    <div class="ds-tree-r"><span class="ds-tree-l">Tronco</span><b>Física</b></div>
    <div class="ds-tree-r"><span class="ds-tree-l">Raíces</span><b>Metafísica</b></div>
  </div>
  <blockquote class="th-quote">«Toda la filosofía es como un árbol, cuyas raíces son la metafísica, el tronco es la física, y las ramas que salen de este tronco son todas las demás ciencias, que se pueden reducir a tres principales: la medicina, la mecánica y la moral». <cite>Principios de la Filosofía</cite></blockquote>

  <h3 class="th-h3">Intuición y deducción</h3>
  <p class="th-p">Como la razón es única, hay que conocer su funcionamiento. Según Descartes, hay <b>dos modos de conocimiento</b>:</p>
  <div class="duo">
    <div class="duo-i lit"><span class="duo-t">Intuición</span><p class="small">Una «<b>luz o instinto natural</b>» que capta las <b>naturalezas simples</b> de forma inmediata y sin posibilidad de error.</p></div>
    <div class="duo-i dim"><span class="duo-t">Deducción</span><p class="small">Recorre las conexiones entre naturalezas simples. Por larga que sea, es una <b>sucesión de intuiciones</b> y de sus conexiones.</p></div>
  </div>
  <blockquote class="th-quote">«Un concepto de la mente pura y atenta, tan fácil y distinto que no quepa duda alguna sobre lo que pensamos (…) que nace de la sola luz de la razón y es más cierto que la deducción misma». <cite>Reglas para la dirección del espíritu, III</cite></blockquote>
  <div class="th-steps">
    <div><b>1 · Análisis</b><span>Descomponer lo complejo hasta llegar a los elementos o naturalezas simples.</span></div>
    <div><b>2 · Síntesis</b><span>Reconstruir deductivamente lo complejo a partir de lo simple.</span></div>
  </div>

  <h3 class="th-h3">Las cuatro reglas del método</h3>
  <blockquote class="th-quote">«Por método entiendo lo siguiente: unas reglas ciertas y fáciles, gracias a las cuales todos los que las observen exactamente no tomarán nunca por verdadero lo que es falso, y alcanzarán (…) el conocimiento verdadero de todo aquello de que sean capaces». <cite>Reglas para la dirección del espíritu, IV</cite></blockquote>
  <p class="th-p">Las expone en la <b>segunda parte del <i>Discurso del método</i></b>:</p>
  <div class="ds-rules">
    <div class="r1"><span class="ds-rn">1</span><b>Evidencia</b><p>«No admitir jamás como verdadera cosa alguna sin conocer con evidencia que lo era (…), evitar cuidadosamente la <b>precipitación y la prevención</b>, y no comprender en mis juicios más que lo que se presente a mi espíritu tan <b>clara y distintamente</b> que no tuviese motivo alguno para ponerlo en duda».</p></div>
    <div class="r2"><span class="ds-rn">2</span><b>Análisis</b><p>«Dividir cada una de las dificultades que examinase en <b>tantas partes</b> como fuese posible y en cuantas requiriese su mejor solución».</p></div>
    <div class="r3"><span class="ds-rn">3</span><b>Síntesis</b><p>«Conducir ordenadamente mis pensamientos comenzando por los objetos <b>más simples</b> y más fáciles de conocer, para ir ascendiendo poco a poco (…) hasta el conocimiento de los <b>más complejos</b>».</p></div>
    <div class="r4"><span class="ds-rn">4</span><b>Comprobaciones</b><p>«Hacer en todo <b>enumeraciones</b> tan completas y <b>revisiones</b> tan generales que llegase a estar seguro de no omitir nada».</p></div>
  </div>
  <div class="th-key"><span class="th-key-l">Un único método para todo</span><p>Es el único que responde a la dinámica de una razón única. Hasta entonces solo se había usado en las <b>matemáticas</b>, con resultados admirables; al ser única la razón, puede aplicarse a <b>todos los ámbitos del saber</b>. El proyecto cartesiano es la <b>unificación de la ciencia</b>, y exige un punto de partida absolutamente cierto.</p></div>
</section>

<section class="card th" id="ds-duda">
  ${secHead("Duda","La duda metódica y el cogito","Para encontrar unos cimientos firmes, Descartes elige el camino de la <b>duda metódica</b>.")}
  ${vInline(a,4)}
  <div class="th-grid2">
    <div class="th-key warn"><span class="th-key-l">No es escepticismo</span><p>Descartes no duda por dudar: no es una duda gratuita, sino un instrumento para <b>buscar la verdad</b>.</p></div>
    <div class="th-key"><span class="th-key-l">¿Por qué «metódica»?</span><p>Es una exigencia del método en su momento <b>analítico</b> (2.ª regla): una labor de <b>desescombro</b> que elimina todo lo que admita la menor duda.</p></div>
  </div>
  <h3 class="th-h3">Niveles de duda</h3>
  <p class="th-p">Tres niveles, de <b>menor a mayor radicalidad</b>:</p>
  <div class="ds-doubt">
    <div class="d1"><span class="ds-dn">1</span><div><b>Falacia de los sentidos</b><p>Si los sentidos a veces nos engañan, ¿qué garantía hay de que no lo hagan siempre? Es improbable, pero la <b>improbabilidad no equivale a certeza</b>.</p></div></div>
    <div class="d2"><span class="ds-dn">2</span><div><b>Argumento del sueño</b><p>A veces los sueños son tan vivos como la vigilia y no hay un criterio seguro para distinguirlos. Así dudamos de que existan las cosas que percibimos, e incluso de que el mundo sea real.</p></div></div>
    <div class="d3"><span class="ds-dn">3</span><div><b>Argumento del genio maligno</b><p>Quizá un genio «extremadamente poderoso e inteligente» emplea su industria en engañarme. Así se duda incluso de las <b>verdades matemáticas</b>, que valen dormidos o despiertos: tal vez el entendimiento está hecho para equivocarse siempre.</p></div></div>
  </div>

  <h3 class="th-h3">La primera verdad: cogito, ergo sum</h3>
  <p class="th-p">Llevada a este extremo, la duda es <b>universal</b> y parece abocar al escepticismo. Pero hay una verdad inmune a toda duda: la <b>existencia del propio sujeto que piensa y duda</b>. Si pienso que el mundo existe, quizá me equivoque sobre el mundo, pero no sobre que lo pienso. Puedo dudar de todo menos de que dudo.</p>
  <div class="ds-cogito"><b>«Cogito, ergo sum»</b><span>Pienso, luego existo</span></div>
  <p class="th-p">Mi existencia como sujeto que piensa (duda, afirma, cree, se equivoca, ama…) está exenta de todo error y de toda duda posible.</p>

  <h3 class="th-h3">El criterio de verdad</h3>
  <p class="th-p">El cogito no es solo la primera verdad: es el <b>prototipo de toda verdad</b>. Es indudable porque se percibe con <b>claridad y distinción</b>. De ahí Descartes deduce su criterio: todo lo que perciba con igual claridad y distinción será verdadero.</p>
  <blockquote class="th-quote">«En este primer conocimiento no existe sino una percepción clara y distinta de lo que afirmo (…). Por tanto, me parece que puedo establecer como regla general que todo lo que percibo clara y distintamente es verdadero». <cite>Meditaciones, III</cite></blockquote>
</section>

<section class="card th" id="ds-sust">
  ${secHead("6.4","La teoría de las tres sustancias","Ya tenemos una verdad cierta: el yo pensante. Pero ¿cómo saber que existe algo fuera de mi pensamiento? El ideal deductivo obliga a <b>deducir la realidad a partir del pensamiento</b>.")}
  ${vInline(a,5)}
  <h3 class="th-h3">El pensamiento siempre piensa ideas</h3>
  <p class="th-p">En «yo pienso que el mundo existe» hay tres factores: el <b>yo</b> que piensa (indudable), el <b>mundo</b> exterior (dudoso) y las <b>ideas</b> de «mundo» y «existencia» (que sin duda poseo).</p>
  <div class="vs">
    <div class="vs-side"><span class="chip b">Hasta Descartes</span><b>Realismo</b><p>El pensamiento recae directamente sobre las <b>cosas</b>. La idea es una <b>lente transparente</b> a través de la cual se ven las cosas sin verla a ella.</p></div>
    <div class="vs-mid">→</div>
    <div class="vs-side"><span class="chip a">A partir de Descartes</span><b>Idealismo</b><p>El pensamiento recae sobre las <b>ideas</b>, no sobre las cosas. La idea es una <b>representación o fotografía</b> que contemplamos.</p></div>
  </div>
  <div class="th-key"><span class="th-key-l">Diferencia con Platón</span><p>Para Platón las Ideas existían en y por sí, con independencia de las cosas. En Descartes, las ideas son <b>contenidos del pensamiento</b>.</p></div>
  <div class="duo">
    <div class="duo-i dim"><span class="duo-t">Como actos mentales</span><p class="small">«Modos del pensamiento»: todas las ideas tienen <b>la misma realidad</b>.</p></div>
    <div class="duo-i lit"><span class="duo-t">Por su contenido objetivo</span><p class="small">Su realidad es <b>diversa</b>: las que representan sustancias tienen más realidad objetiva que las que representan modos o accidentes.</p></div>
  </div>

  <h3 class="th-h3">Tres tipos de ideas</h3>
  <div class="args">
    <div class="arg g2"><span class="arg-t">Adventicias</span><p>Parecen provenir de la <b>experiencia externa</b> (ser humano, caballo, alas). «Parecen», porque aún no consta que exista el mundo exterior. No sirven de punto de partida: sería un <b>círculo vicioso</b>.</p></div>
    <div class="arg g3"><span class="arg-t">Facticias</span><p>Las <b>construye la mente</b> a partir de otras ideas (caballo alado, centauro, ratoncito Pérez). Tampoco sirven: se construyen a partir de las adventicias.</p></div>
    <div class="arg g1"><span class="arg-t">Innatas</span><p>El pensamiento las posee <b>en sí mismo</b>: pocas, pero las más importantes, como «pensamiento» y «existencia». Es la tesis fundamental del racionalismo.</p></div>
  </div>
  <div class="th-key"><span class="th-key-l">La idea de infinito</span><p>Entre las innatas está la idea de <b>infinito</b>, que Descartes identifica con <b>Dios</b>. No es adventicia (no tenemos experiencia de Dios) ni facticia: la noción de finitud <b>presupone</b> la de infinitud, y no al revés.</p></div>

  <h3 class="th-h3">Tres argumentos de la existencia de Dios</h3>
  <div class="args">
    <div class="arg g1"><span class="arg-t">Causalidad: idea de infinito</span><p>Tengo la idea de un ser infinito. La causa ha de tener tanta <b>realidad formal</b> como <b>realidad objetiva</b> tenga la idea: la ha causado en mí un ser infinito, Dios.</p></div>
    <div class="arg g2"><span class="arg-t">Causalidad: mi propio ser</span><p>No soy mi propia causa: si lo fuera, me habría hecho perfecto. Soy imperfecto y tengo la idea de perfección, así que me ha hecho un ser con esas perfecciones: Dios.</p></div>
    <div class="arg g3"><span class="arg-t">Argumento ontológico</span><p>Es básicamente el de <b>Anselmo de Canterbury</b>: la idea de ser perfecto contiene su existencia. Igual que no hay triángulo sin tres lados, no se concibe un ser perfecto al que le falte la existencia.</p></div>
  </div>

  <h3 class="th-h3">La existencia del mundo</h3>
  <p class="th-p">Dios es infinitamente <b>bueno y veraz</b>: no puede permitir que me engañe al creer que el mundo existe, luego el mundo existe. Dios es la <b>garantía</b> de que a mis ideas corresponde una realidad extramental, algo paradójico en un sistema racionalista.</p>
  <div class="duo">
    <div class="duo-i lit"><span class="duo-t">Cualidades primarias</span><p class="small"><b>Extensión y movimiento</b> (forma, tamaño, movimiento). Dios garantiza que existen, y de ellas se deducen la física y las leyes del movimiento.</p></div>
    <div class="duo-i dim"><span class="duo-t">Cualidades secundarias</span><p class="small">Colores, olores, sabores, sonidos. Tenemos sus ideas, pero Descartes, como Galileo y la ciencia moderna, <b>niega que existan</b>.</p></div>
  </div>

  <h3 class="th-h3">Las tres sustancias</h3>
  <div class="tblwrap"><table class="tbl">
    <thead><tr><th>Realidad</th><th>Sustancia</th><th>Atributo</th><th>Modos</th></tr></thead>
    <tbody>
      <tr><td><b>Dios</b></td><td>Sustancia infinita <i>(res infinita)</i></td><td><span class="pill p1">Infinitud</span></td><td>No tiene: es perfecta y siempre idéntica</td></tr>
      <tr><td><b>El yo</b></td><td>Sustancia pensante <i>(res cogitans)</i></td><td><span class="pill p2">Pensamiento</span></td><td>Creer, dudar, imaginar, sentir, amar, odiar…</td></tr>
      <tr><td><b>Los cuerpos</b></td><td>Sustancia extensa <i>(res extensa)</i></td><td><span class="pill p3">Extensión</span></td><td>Profundidad, volumen, anchura, formas, movimientos…</td></tr>
    </tbody>
  </table></div>
  <p class="th-p">El <b>atributo</b> es la esencia de cada sustancia; los <b>modos</b>, sus modificaciones.</p>
  <div class="th-key"><span class="th-key-l">Concepto de sustancia</span><p>«Toda cosa que existe de tal modo que <b>no necesita de ninguna otra cosa para existir</b>». En sentido estricto solo Dios lo es; Descartes lo mantiene para las otras dos por su <b>independencia mutua</b>.</p></div>

  <h3 class="th-h3">Dualismo antropológico</h3>
  <p class="th-p">Alma y cuerpo, pensamiento y extensión, son <b>sustancias distintas</b>: un dualismo <b>más radical que el de Platón</b>. El objetivo es salvaguardar la <b>autonomía del alma</b> respecto de la materia.</p>
  <div class="th-steps">
    <div><b>Materia</b><span>La ciencia moderna impone un mundo <b>mecanicista y determinista</b>: el cuerpo funciona como una máquina.</span></div>
    <div><b>Libertad</b><span>Si el alma fuera materia, estaría sometida a esas leyes. Separarla del cuerpo permite <b>defender la libertad</b>.</span></div>
  </div>
  <blockquote class="th-quote">«Puesto que, por una parte, poseo una idea clara y distinta de mí mismo en tanto que soy una cosa que piensa e inextensa, y, de otra parte, poseo una idea distinta del cuerpo en tanto que es solo una cosa extensa y que no piensa, es evidente que yo soy distinto de mi cuerpo y que puedo existir sin él». <cite>Meditaciones, VI</cite></blockquote>

  <h3 class="th-h3">Conclusión: un éxito a medias</h3>
  <div class="ds-flow">
    <div><span class="ds-fl">Intuición</span><b>Yo</b><small>Lo más simple</small></div>
    <i aria-hidden="true">→</i>
    <div class="god"><span class="ds-fl">Garantía</span><b>Dios</b><small>Intermediario</small></div>
    <i aria-hidden="true">→</i>
    <div><span class="ds-fl">Deducción</span><b>Mundo</b><small>Lo más complejo</small></div>
  </div>
  <p class="th-p">Lo consigue en parte: a partir del yo justifica la realidad del mundo. Pero necesita una <b>garantía externa</b>, Dios. Aunque Dios sea la <b>segunda verdad en el orden del conocimiento</b>, se convierte en la <b>primera en el orden ontológico</b>: al final, todo acaba siendo gracias a Dios.</p>
</section>

function tabResponder(a){

}

const API_URL = "/.netlify/functions/corregir";

function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9ñ\s]/g," ").replace(/\s+/g," ").trim();
}
function normProblem(s){
  return norm(s).replace(/^(el|la|los|las)\s+/,"").replace(/^problema(s)?\s+(de\s+la|del|de\s+los|de\s+las|de)\s+/,"").replace(/^problema(s)?\s+/,"").replace(/^(el|la|los|las)\s+/,"");
}
function checkProblem(ans,item){
  const a=" "+norm(ans); if(!norm(ans)) return {ok:false,empty:true,found:[],missing:item.problema.cats.map(c=>c[0])};
  const found=[],missing=[];
  item.problema.cats.forEach(c=>{ (c.slice(1).some(v=>a.includes(" "+norm(v)))?found:missing).push(c[0]) });
  return {ok:missing.length===0,found,missing};
}
function normConcept(s){
  return norm(s).split(" ").filter((w,k)=>!(k===0&&["el","la","lo","los","las","un","una"].includes(w))).map(w=>w.length>3?w.replace(/s$/,"").replace(/e$/,""):w).join(" ");
}
function checkGroups(ans,groups){
  const a=" "+norm(ans)+" ";
  const res=groups.map(g=>g.some(alt=>a.includes(" "+norm(alt))));
  return {ok:res.every(Boolean)&&norm(ans).length>0,hit:res.filter(Boolean).length,total:groups.length,empty:!norm(ans)};
}
function checkConcepts(ans,list){
  const parts=String(ans||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
  const found=[],extra=[];
  parts.forEach(p=>{
    const np=" "+normConcept(p)+" ";
    const idx=list.findIndex(c=>{const v=normConcept(c);return np.includes(" "+v+" ")||(v.includes(" ")===false&&np.trim()===v)});
    if(idx>=0){ if(!found.includes(idx)) found.push(idx); } else extra.push(p);
  });
  return {found,extra,missing:list.map((c,i)=>i).filter(i=>!found.includes(i)),total:list.length};
}

function sectionFor(x){const n=norm(x);
  if(n.includes("antropolog"))return "pl-antro";
  if(n.includes("etica")||n.includes("politica"))return "pl-etica";
  if(n.includes("epistemolog")||n.includes("reminiscencia")||n.includes("conocimiento"))return "pl-episte";
  if(n.includes("ontolog")||n.includes("ideas"))return "pl-onto";
  return null;}
function cmField(k,label,kind,ph,val){
  const v=esc(val||"");
  const ctrl = kind==="input" ? '<input class="cm-in" id="cm-'+k+'" data-k="'+k+'" placeholder="'+ph+'" value="'+v+'">'
    : '<textarea id="cm-'+k+'" data-k="'+k+'" placeholder="'+ph+'" style="min-height:'+(kind==="long"?"220px":"84px")+'">'+v+'</textarea>';
  return '<div class="field cm-field" id="f-'+k+'"><label for="cm-'+k+'">'+label+(k==="explicacion"?' <span class="chip a" style="margin-left:6px">IA</span>':'')+'</label>'+ctrl+
    (k==="explicacion"?'<div class="counter"><span id="cmw">'+words(val||"")+' palabras</span></div>':'')+'<div class="cm-res" id="r-'+k+'"></div></div>';
}
function resBox(ok,title,body){
  return '<div class="cm-r '+(ok===true?"ok":ok===false?"bad":"mid")+'"><b>'+title+'</b>'+(body||"")+'</div>';
}
function bindPracticarComentario(a,rerender){
  const list=COMMENTS[a.id];
  const st=store.get("cm-"+a.id,{i:0,ans:{}});
  const it=list[st.i]||list[0];
  st.ans[st.i]=st.ans[st.i]||{};
  const save=()=>{store.set("cm-"+a.id,st);const m=document.getElementById("cmSaved");if(m){m.textContent="Guardado";clearTimeout(m._t);m._t=setTimeout(()=>m.textContent="",1200)}};
  store.set("cm-"+a.id,st);
  document.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{
    st.ans[st.i][el.dataset.k]=el.value; if(el.dataset.k==="explicacion")document.getElementById("cmw").textContent=words(el.value)+" palabras"; save();
  }));
  document.querySelectorAll("[data-theory]").forEach(b=>b.onclick=()=>{const go=document.querySelector('.seg button[data-tab="teoria"]');go.click();setTimeout(()=>{const el=document.getElementById(b.dataset.theory);if(el){if(el._open)el._open();el.scrollIntoView({behavior:"smooth",block:"start"})}},60)});
  const nx=document.getElementById("cmNext");
  if(nx) nx.onclick=()=>{let n;do{n=Math.floor(Math.random()*list.length)}while(n===st.i&&list.length>1);st.i=n;store.set("cm-"+a.id,st);rerender()};
  document.getElementById("cmClear").onclick=()=>{const b=document.getElementById("cmClear");if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Pulsa otra vez para borrar";setTimeout(()=>{b.dataset.c="";b.textContent="Borrar respuestas"},2500);return}st.ans[st.i]={};store.set("cm-"+a.id,st);rerender()};
  document.getElementById("cmCheck").onclick=async()=>{
    const v=k=>(document.getElementById("cm-"+k).value||"");
    let points=0;
    // Problema
    const p=checkProblem(v("problema"),it);
    if(p.ok)points++;
    document.getElementById("r-problema").innerHTML=p.empty?resBox(false,"Sin responder","<span>Respuesta: "+it.problema.nombre+".</span>"):
      resBox(p.ok?true:(p.found.length?null:false),p.ok?"Correcto":p.found.length?"Incompleto":"No es el problema del texto",
      '<div class="cm-tags">'+p.found.map(x=>'<span class="t ok">'+x+'</span>').join("")+p.missing.map(x=>'<span class="t miss">'+x+'</span>').join("")+'</div>'+(p.ok?'':'<span>Respuesta: '+it.problema.nombre+'.</span>'));
    // Conceptos
    const c=checkConcepts(v("conceptos"),it.conceptos);
    const cOk=c.found.length>=Math.ceil(c.total*0.6); if(cOk)points++;
    document.getElementById("r-conceptos").innerHTML=resBox(cOk?true:(c.found.length?null:false),c.found.length+" de "+c.total+" conceptos clave",
      '<div class="cm-tags">'+c.found.map(i=>'<span class="t ok">'+it.conceptos[i]+'</span>').join("")+c.missing.map(i=>'<span class="t miss">'+it.conceptos[i]+'</span>').join("")+c.extra.map(x=>'<span class="t extra">'+esc(x)+'</span>').join("")+'</div>'+
      '<span class="tiny muted">Verde: acertado · Gris: te faltó · Tachado: no es concepto clave de este texto</span>');
    const summary=(pts,pending)=>{document.getElementById("cmSummary").innerHTML='<div class="cm-sum"><b>'+pts+' / 4</b><span>'+(pending?'problema y conceptos corregidos; esperando a la IA para las ideas…':'apartados correctos: problema, idea principal, ideas secundarias y conceptos')+'</span></div>'};
    const propuesta=k=>'<span>Propuesta: '+it[k].modelo+'</span>';
    const keywordIdeas=()=>{let extra=0;[["principal"],["secundaria"]].forEach(([k])=>{
      const r=checkGroups(v(k),it[k].grupos); if(r.ok)extra++;
      document.getElementById("r-"+k).innerHTML=r.empty?resBox(false,"Sin responder",propuesta(k)):
        resBox(r.ok?true:(r.hit?null:false),(r.ok?"Correcto":r.hit?"Incompleta":"No recoge la idea")+' <span class="cm-auto">corrección por palabras clave</span>',propuesta(k));
    });return extra};
    const ideasBox=(k,d)=>{
      if(!v(k).trim()) return resBox(false,"Sin responder",propuesta(k));
      const val=(d&&d.valoracion)||"";
      const ok=val==="correcta"?true:val==="parcial"?null:false;
      return resBox(ok,(val==="correcta"?"Correcta":val==="parcial"?"Parcialmente correcta":"No recoge la idea")+' <span class="cm-auto">IA</span>','<span>'+esc((d&&d.comentario)||"")+'</span>'+(ok===true?'':propuesta(k)));
    };
    // IA: ideas + explicación
    const ex=v("explicacion").trim(); const box=document.getElementById("r-explicacion");
    const nothing=!v("principal").trim()&&!v("secundaria").trim()&&!ex;
    if(nothing||words(ex)<25){const extra=keywordIdeas();box.innerHTML=resBox(false,ex?"Explicación demasiado corta":"Sin responder","<span>Escribe al menos 25 palabras de explicación para que la IA corrija la cuestión completa. Mientras, las ideas se han corregido por palabras clave.</span>");summary(points+extra,false);return}
    const loading='<div class="cm-r mid"><b>Corrigiendo con IA…</b><span class="cm-dots"><i></i><i></i><i></i></span></div>';
    ["principal","secundaria"].forEach(k=>document.getElementById("r-"+k).innerHTML=loading);
    box.innerHTML=loading; summary(points,true);
    try{
      stat("correccion-ia");store.set("iaUsada",true);const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        autor:a.name,referencia:it.ref,texto:it.texto,
        ref_principal:it.principal.modelo,ref_secundaria:it.secundaria.modelo,conexion:it.conexion,
        principal:v("principal"),secundaria:v("secundaria"),explicacion:ex,codigo:store.get("codigo","")})});
      if(r.status===401){["principal","secundaria"].forEach(k=>document.getElementById("r-"+k).innerHTML="");box.innerHTML=codeBox();bindCode(()=>document.getElementById("cmCheck").click());return}
      if(!r.ok) throw new Error(r.status===503?"saturada":"http "+r.status);
      const d=await r.json();
      const P=d.puntuacion_apartados||{}, F=d.feedback_por_apartado||{}, S=d.solucion_modelo_sugerida||{};
      const fmt=x=>Number(x||0).toFixed(2).replace(".",",");
      const ideaRes=(k,score,max,fb)=>{
        if(!v(k).trim()) return resBox(false,"Sin responder · 0 / "+fmt(max),propuesta(k));
        const r=score/max, ok=r>=0.8?true:r>=0.4?null:false;

      };

      document.getElementById("cmSummary").innerHTML='<div class="cm-sum"><div><b>'+fmt(d.nota_total)+' / 2,50</b><span>Cuestión 1.ª según el baremo PAU (idea principal, secundarias y explicación)</span></div><div class="cm-sum2"><b>'+(points)+' / 2</b><span>problema y conceptos clave</span></div></div>';

  {"id":"PLAREP01","ref":"República, libro VI","yt":"3tafnAnrdbo","html":"—Pero ¿acaso —preguntó Adimanto— <u>no son la <mark class=\"hl-c\">justicia</mark> y lo demás que hemos descrito <mark class=\"hl-c\">lo supremo</mark></u>, <mark class=\"hl-g\">sino que hay algo todavía mayor?</mark> —Mayor, ciertamente —respondí—. Y de esas cosas mismas <u>no debemos contemplar, como hasta ahora, un bosquejo, sino no pararnos hasta tener un cuadro acabado</u>. ¿No sería ridículo acaso que pusiésemos todos nuestros esfuerzos en otras cosas de escaso valor, de modo de alcanzar en ellas la mayor precisión y pureza posibles, y <mark class=\"hl-b\">que no consideráramos dignas de la máxima precisión justamente a las cosas supremas</mark>? — Efectivamente; pero en cuanto a lo que llamas ‘el <mark class=\"hl-c\">estudio supremo</mark>’ y en cuanto a lo que trata, <mark class=\"hl-g\">¿te parece que podemos dejar pasar sin preguntarte qué es?</mark>"},
  {"id":"PLAREP02","ref":"República, libro VI","yt":"qiznsZysc9w","html":"—Por cierto que no, pero también tú puedes preguntar. Por lo demás, me has oído hablar de eso no pocas veces; y ahora, o bien no recuerdas, o bien te propones plantear cuestiones para perturbarme. Es esto más bien lo que creo, porque con frecuencia me has escuchado decir que <mark class=\"hl-b\">la <mark class=\"hl-c\">Idea del Bien</mark> es el objeto del <mark class=\"hl-c\">estudio supremo</mark></mark>, <mark class=\"hl-g\">a partir de la cual las cosas justas y todas las demás se vuelven útiles y valiosas</mark>. Y bien sabes que estoy por hablar de ello y, además, <u>que no lo conocemos suficientemente</u>. Pero también sabes que, <mark class=\"hl-g\">si no lo conocemos, por más que conociéramos todas las demás cosas, sin aquello nada nos sería de valor</mark>, así como si poseemos algo sin el Bien. ¿O crees que da ventaja poseer cualquier cosa si no es buena, y comprender todas las demás cosas sin el Bien y sin comprender nada bello y bueno? —¡Por Zeus que me parece que no! —En todo caso sabes que <u>a la mayoría le parece que el Bien es el <mark class=\"hl-c\">placer</mark>, mientras a los más exquisitos la <mark class=\"hl-c\">inteligencia</mark></u>. —Sin duda. —Y además, querido mío, los que piensan esto último no pueden mostrar qué clase de inteligencia, y <mark class=\"hl-g\">se ven forzados a terminar por decir que es la inteligencia del bien</mark>. —Cierto, y resulta ridículo."},
  {"id":"PLAREP03","ref":"República, libro VI","yt":"udgv8_9BVOU","html":"—Claro, sobre todo si nos reprochan que no conocemos el <mark class=\"hl-c\">bien</mark> y hablan como si a su vez lo supiesen; pues dicen que es la inteligencia del bien, <u>como si comprendiéramos qué quieren decir cuando pronuncian la palabra ‘bien’</u>. —Es muy verdad. —¿Y los que definen el bien como el <mark class=\"hl-c\">placer</mark>? ¿Acaso incurren menos en error que los otros? <mark class=\"hl-g\">¿No se ven forzados a reconocer que hay placeres malos?</mark> —Es forzoso. —Pero en ese caso, pienso, les sucede que <mark class=\"hl-g\">deben reconocer que las mismas cosas son buenas y malas</mark>. ¿No es así? —Sí. —También es manifiesto que hay muchas y grandes disputas en torno a esto. —Sin duda. —Ahora bien, es patente que, <u>respecto de las cosas justas y bellas, muchos se atienen a las <mark class=\"hl-c\">apariencias</mark></u> y, aunque no sean justas ni bellas, actúan y las adquieren como si lo fueran; <mark class=\"hl-b\">respecto de las cosas buenas, en cambio, nadie se conforma con poseer apariencias, sino que buscan cosas reales</mark> y rechazan las que sólo parecen buenas. —Así es."},
  {"id":"PLAREP04","ref":"República, libro VI","yt":"v4yr_uswDHc","html":"—Veamos. <mark class=\"hl-b\"><mark class=\"hl-c\">Lo que toda alma persigue</mark> y por lo cual hace todo</mark>, <u>adivinando que existe, pero sumida en dificultades frente a eso y sin poder captar suficientemente qué es</u>, ni recurrir a una sólida creencia como sucede respecto de otras cosas, que es lo que hace perder lo que puede haber en ellas de ventajoso; algo de esta índole y magnitud, <mark class=\"hl-g\">¿diremos que debe permanecer en tinieblas para aquellos que son <mark class=\"hl-c\">los mejores en el Estado</mark></mark> y con los cuales hemos de llevar a cabo nuestros intentos? —Ni en lo más mínimo. —Pienso, en todo caso, que, <u>si se desconoce en qué sentido las cosas justas y bellas del Estado son buenas, no sirve de mucho tener un <mark class=\"hl-c\">guardián</mark> que ignore esto en ellas</u>; y presiento que <mark class=\"hl-g\">nadie conocerá adecuadamente las cosas justas y bellas antes de conocer en qué sentido son buenas</mark>. —Presientes bien. —Pues entonces <mark class=\"hl-g\">nuestro Estado estará perfectamente organizado, si el guardián que lo vigila es alguien que posee el conocimiento de estas cosas</mark>. —Forzosamente. Pero tú, Sócrates, ¿qué dices que es <mark class=\"hl-c\">el bien</mark>? ¿Ciencia, placer o alguna otra cosa? —¡Hombre! Ya veo bien claro que no te contentarás con lo que opinen otros acerca de eso."},
  {"id":"PLAREP05","ref":"República, libro VI","yt":"mjVEv9JNe0c","html":"—Es que no me parece correcto, Sócrates, que haya que atenerse a las opiniones de otros y no a las de uno, tras haberse ocupado tanto tiempo de esas cosas. —Pero ¿es que acaso te parece correcto decir acerca de ellas, como si se supiese, algo que no se sabe? —Como si se supiera, de ningún modo, pero sí como quien está dispuesto a exponer, como su pensamiento, aquello que piensa. — Pues bien —dije—. ¿No percibes que <mark class=\"hl-b\">las <mark class=\"hl-c\">opiniones</mark> sin <mark class=\"hl-c\">ciencia</mark> son todas lamentables</mark>? <u>En el mejor de los casos, ciegas</u>. ¿O te parece que <mark class=\"hl-g\">los ciegos que hacen correctamente su camino se diferencian en algo de los que tienen opiniones verdaderas sin inteligencia</mark>? —En nada. —¿Quieres acaso contemplar cosas lamentables, ciegas y tortuosas, en lugar de oírlas de otros claras y bellas? —¡Por Zeus! —exclamó Glaucón—. No te retires, Sócrates, como si ya estuvieras al final. Pues nosotros estaremos satisfechos si, <u>del modo en que discurriste acerca de la justicia, la moderación y lo demás, así discurres acerca del <mark class=\"hl-c\">bien</mark></u>."},
  {"id":"PLAREP06","ref":"República, libro VI","yt":"Gm3eAIyWfew","html":"—Por mi parte, yo también estaré más que satisfecho. Pero me temo que no sea capaz y que, por entusiasmarme, me desacredite y haga el ridículo. Pero <mark class=\"hl-g\">dejemos por ahora, dichosos amigos, lo que es en sí mismo el <mark class=\"hl-c\">Bien</mark></mark>; <u>pues me parece demasiado como para que el presente impulso permita en este momento alcanzar lo que juzgo de él</u>. <mark class=\"hl-b\">En cuanto a lo que parece un vástago del Bien y lo que más se le asemeja, en cambio, estoy dispuesto a hablar</mark>, si os place a vosotros; si no, dejamos la cuestión. —Habla, entonces, y nos debes para otra oportunidad el relato acerca del padre. —Ojalá que yo pueda pagarlo y vosotros recibirlo; y no sólo los intereses, como ahora; <u>por ahora recibid esta criatura y <mark class=\"hl-c\">vástago del Bien</mark> en sí</u>. Cuidaos que no os engañe involuntariamente de algún modo, rindiéndoos cuenta fraudulenta del interés. —Nos cuidaremos cuanto podamos; pero tú limítate a hablar. —Para eso debo estar de acuerdo con vosotros y recordaros lo que he dicho antes y a menudo hemos hablado en otras oportunidades. —¿Sobre qué? —<mark class=\"hl-g\">Que hay muchas <mark class=\"hl-c\">cosas bellas</mark>, muchas buenas, y así, con cada <mark class=\"hl-c\">multiplicidad</mark>, decimos que existe</mark> y la distinguimos con el lenguaje. —Lo decimos, en efecto."},
  {"id":"PLAREP07","ref":"República, libro VI","yt":"dmyAQZE8zk4","html":"—<mark class=\"hl-g\">También afirmamos que hay algo <mark class=\"hl-c\">Bello en sí</mark> y <mark class=\"hl-c\">Bueno en sí</mark></mark> y, análogamente, respecto de todas aquellas cosas que postulábamos como múltiples; a la inversa, <u>a su vez postulamos cada <mark class=\"hl-c\">multiplicidad</mark> como siendo una unidad, de acuerdo con una <mark class=\"hl-c\">Idea única</mark></u>, y denominamos a cada una ‘lo que es’. —Así es. —<mark class=\"hl-b\">Y de aquellas cosas decimos que son vistas pero no pensadas, mientras que, por su parte, las Ideas son pensadas, mas no vistas</mark>. —Indudablemente. —Ahora bien, ¿por medio de qué vemos las cosas visibles? —Por medio de la vista. —En efecto, y por medio del oído las audibles, y por medio de las demás percepciones todas las cosas perceptibles. ¿No es así? —Sí. —Pues bien, ¿has advertido que <u>el <mark class=\"hl-c\">artesano</mark> de las percepciones modeló mucho más perfectamente la facultad de ver y de ser visto</u>? —En realidad, no. —Examina lo siguiente: ¿hay algo de otro género que el oído necesita para oír y la voz para ser oída, de modo que, si este tercer género no se hace presente, uno no oirá y la otra no se oirá? —No, nada. —Tampoco necesitan de algo de esa índole muchos otros poderes, pienso, por no decir ninguno. ¿O puedes decir alguno? — No, por cierto. —<mark class=\"hl-g\">Pero, al poder de ver y de ser visto, ¿no piensas que le falta algo?</mark>"},
  {"id":"PLAREP08","ref":"República, libro VI","yt":"JScGlR4Ja8U","html":"—¿Qué cosa? —<mark class=\"hl-g\">Si la vista está presente en los ojos y lista para que se use de ella, y el color está presente en los objetos, pero no se añade un tercer género</mark> que hay por naturaleza específicamente para ello, <u>bien sabes que la vista no verá nada y los colores serán invisibles</u>. —¿A qué te refieres? — A lo que tú llamas ‘<mark class=\"hl-c\">luz</mark>’. —Dices la verdad. —Por consiguiente, <mark class=\"hl-b\">el sentido de la vista y el poder de ser visto se hallan ligados por un vínculo de una especie nada pequeña</mark>, de mayor estima que las demás ligazones de los sentidos, salvo que la luz no sea estimable. —Está muy lejos de no ser estimable. —Pues bien, <u>¿a cuál de los dioses que hay en el cielo atribuyes la autoría de aquello por lo cual la luz hace que la vista vea</u> y que las más hermosas cosas visibles sean vistas? —Al mismo que tú y que cualquiera de los demás, <mark class=\"hl-g\">ya que es evidente que preguntas por el sol</mark>. —Y la vista, ¿no es por naturaleza en relación a este dios lo siguiente? —¿Cómo? —<u>Ni la vista misma, ni aquello en lo cual se produce —lo que llamamos ‘ojo’—, son el <mark class=\"hl-c\">sol</mark></u>. —Claro que no."},
  {"id":"PLAREP09","ref":"República, libro VI","yt":"8Szt59zrNHQ","html":"—Pero es el más afín al sol, pienso, de los órganos que conciernen a los sentidos. —Con mucho. —Y la facultad que posee, ¿no es algo así como un fluido que le es dispensado por el <mark class=\"hl-c\">sol</mark>? — Ciertamente. —<u>En tal caso, el sol no es la vista pero, al ser su causa, es visto por ella misma</u>. —Así es. —Entonces ya podéis decir qué entendía yo por el <mark class=\"hl-c\">vástago del Bien</mark>, <mark class=\"hl-g\">al que el <mark class=\"hl-c\">Bien</mark> ha engendrado análogo a sí mismo</mark>. De este modo, <mark class=\"hl-b\">lo que en el ámbito inteligible es el Bien respecto de la inteligencia y de lo que se intelige, esto es el sol en el <mark class=\"hl-c\">ámbito visible</mark> respecto de la vista y de lo que se ve</mark>. —¿Cómo? Explícate. —Bien sabes que <u>los ojos, cuando se los vuelve sobre objetos cuyos colores no están ya iluminados por la luz del día sino por el resplandor de la luna, ven débilmente</u>, como si no tuvieran claridad en la vista. —Efectivamente. —<mark class=\"hl-g\">Pero cuando el sol brilla sobre ellos, ven nítidamente</mark>, y parece como si estos mismos ojos tuvieran la claridad. —Sin duda."},
  {"id":"PLAREP10","ref":"República, libro VI","yt":"hj-zTLf8P7s","html":"—Del mismo modo piensa así lo que corresponde al <mark class=\"hl-c\">alma</mark>: <mark class=\"hl-g\">cuando fija su mirada en objetos sobre los cuales brilla la verdad y lo que es, <mark class=\"hl-c\">intelige</mark>, conoce y parece tener inteligencia</mark>; pero <mark class=\"hl-g\">cuando se vuelve hacia lo sumergido en la oscuridad, que nace y perece, entonces <mark class=\"hl-c\">opina</mark></mark> y percibe débilmente con opiniones que la hacen ir de aquí para allá, y da la impresión de no tener inteligencia. —Eso parece, en efecto. —Entonces, <mark class=\"hl-b\">lo que aporta la verdad a las <mark class=\"hl-c\">cosas cognoscibles</mark> y otorga al que conoce el poder de conocer, puedes decir que es la <mark class=\"hl-c\">Idea del Bien</mark></mark>. Y <u>por ser causa de la <mark class=\"hl-c\">ciencia</mark> y de la <mark class=\"hl-c\">verdad</mark>, concíbela como cognoscible</u>; y aun siendo bellos tanto el conocimiento como la verdad, si estimamos correctamente el asunto, <u>tendremos a la idea del Bien por algo distinto y más bello por ellas</u>. Y así como dijimos que era correcto tomar a la luz y a la vista por afines al sol pero que sería erróneo creer que son el sol, análogamente ahora <mark class=\"hl-g\">es correcto pensar que ambas cosas, la verdad y la ciencia, son afines al Bien, pero sería equivocado creer que una u otra fueran el Bien</mark>, ya que la condición del Bien es mucho más digna de estima."},
  {"id":"PLAREP11","ref":"República, libro VI","yt":"cuDZNkbyKQQ","html":"—Hablas de una belleza extraordinaria, puesto que <u>produce la <mark class=\"hl-c\">ciencia</mark> y la <mark class=\"hl-c\">verdad</mark>, y además está por encima de ellas en cuanto a hermosura</u>. Sin duda, no te refieres al placer. —¡Dios nos libre! Más bien prosigue examinando nuestra comparación. —¿De qué modo? —Pienso que puedes decir que <mark class=\"hl-g\">el sol no sólo aporta a lo que se ve la propiedad de ser visto, sino también la génesis, el crecimiento y la nutrición</mark>, sin ser él mismo génesis. —Claro que no. —Y así dirás que <mark class=\"hl-g\">a las cosas cognoscibles les viene del Bien no sólo el ser conocidas, sino también de él les llega el existir y la esencia</mark>, <mark class=\"hl-b\">aunque el <mark class=\"hl-c\">Bien</mark> no sea esencia, sino algo que se eleva más allá de la esencia en cuanto a dignidad y a potencia</mark>. Y Glaucón se echó a reír: —¡Por Apolo!, exclamó. ¡Qué elevación demoníaca! —Tú eres culpable —repliqué—, pues me has forzado a decir lo que pensaba sobre ello. —Está bien; de ningún modo te detengas, sino prosigue explicando la similitud respecto del sol, si es que te queda algo por decir. —Bueno, es mucho lo que queda. —Entonces no dejes de lado ni lo más mínimo. — Me temo que voy a dejar mucho de lado; no obstante, no omitiré lo que en este momento me sea posible. —No, por favor."},
  {"id":"PLAREP12","ref":"República, libro VI","yt":"ocBtcdGPB5Y","html":"—Piensa entonces, como decíamos, <u>cuáles son los dos que reinan</u>: <mark class=\"hl-g\">uno, el del género y <mark class=\"hl-c\">ámbito inteligibles</mark>; otro, el del <mark class=\"hl-c\">visible</mark></mark>, y no digo ‘el del cielo’ para que no creas que hago juego de palabras. ¿Captas estas dos especies, la visible y la inteligible? —Las capto. —<mark class=\"hl-b\">Toma ahora una línea dividida en dos partes desiguales; divide nuevamente cada sección según la misma proporción</mark>, la del género de lo que se ve y otra la del que se intelige, y <u>tendrás distinta oscuridad y claridad relativas</u>; así tenemos primeramente, en el género de lo que se ve, una sección de imágenes. <mark class=\"hl-g\">Llamo ‘<mark class=\"hl-c\">imágenes</mark>’ en primer lugar a las sombras, luego a los reflejos en el agua</mark> y en todas las cosas que, por su constitución, son densas, lisas y brillantes, y a todo lo de esa índole. ¿Te das cuenta? —Me doy cuenta. —<u>Pon ahora la otra sección de la que ésta ofrece imágenes</u>, <mark class=\"hl-g\">a la que corresponden los animales que viven en nuestro derredor, así como todo lo que crece, y también el género íntegro de cosas fabricadas por el hombre</mark>. —Pongámoslo."},
  {"id":"PLAREP13","ref":"República, libro VI","yt":"s3PSu6lxcl4","html":"—¿Estás dispuesto a declarar que la línea ha quedado dividida, en cuanto a su verdad y no verdad, de modo tal que <mark class=\"hl-b\">lo opinable es a lo cognoscible como la <mark class=\"hl-c\">copia</mark> es a aquello de <mark class=\"hl-c\">lo que es copiado</mark></mark>? —Estoy muy dispuesto. —Ahora examina si no hay que dividir también la sección de <mark class=\"hl-c\">lo inteligible</mark>. —¿De qué modo? —De éste. Por un lado, <mark class=\"hl-g\">en la primera parte de ella, el alma, sirviéndose de las cosas antes imitadas como si fueran imágenes, se ve forzada a indagar a partir de supuestos</mark>, <u>marchando no hasta un principio sino hacia una conclusión</u>. Por otro lado, <mark class=\"hl-g\">en la segunda parte, avanza hasta un <mark class=\"hl-c\">principio</mark> no supuesto, partiendo de un <mark class=\"hl-c\">supuesto</mark> y sin recurrir a imágenes</mark> —a diferencia del otro caso—, <u>efectuando el camino con Ideas mismas y por medio de Ideas</u>. —No he aprehendido suficientemente esto que dices."},
  {"id":"PLAREP14","ref":"República, libro VI","yt":"GnVSoIDinic","html":"—Pues veamos nuevamente; será más fácil que entiendas si te digo esto antes. Creo que sabes que <u>los que se ocupan de <mark class=\"hl-c\">geometría</mark> y de cálculo suponen lo impar y lo par, las figuras y tres clases de ángulos</u> y cosas afines, según lo que investigan en cada caso. <mark class=\"hl-g\">Como si las conocieran, las adoptan como <mark class=\"hl-c\">supuestos</mark>, y de ahí en adelante no estiman que deban dar cuenta de ellas</mark> ni a sí mismos ni a otros, como si fueran evidentes a cualquiera; antes bien, <u>partiendo de ellas atraviesan el resto de modo consecuente, para concluir en aquello que proponían al examen</u>. —Sí, esto lo sé. —Sabes, por consiguiente, que <mark class=\"hl-g\">se sirven de figuras visibles y hacen discursos acerca de ellas, aunque no pensando en éstas sino en aquellas cosas a las cuales éstas se parecen</mark>, <mark class=\"hl-b\">discurriendo en vista al Cuadrado en sí y a la Diagonal en sí, y no en vista de la que dibujan</mark>, y así con lo demás. De las cosas mismas que configuran y dibujan hay <mark class=\"hl-c\">sombras</mark> e <mark class=\"hl-c\">imágenes</mark> en el agua, y <u>de estas cosas que dibujan se sirven como imágenes, buscando divisar aquellas cosas en sí que no podrían divisar de otro modo que con el <mark class=\"hl-c\">pensamiento</mark></u>. —Dices verdad."},
  {"id":"PLAREP15","ref":"República, libro VI","yt":"JIVVuC04Zwc","html":"—A esto me refería como la especie <mark class=\"hl-c\">inteligible</mark>. Pero <mark class=\"hl-g\">en esta su primera sección, el alma se ve forzada a servirse de <mark class=\"hl-c\">supuestos</mark> en su búsqueda, sin avanzar hacia un <mark class=\"hl-c\">principio</mark></mark>, por no poder remontarse más allá de los supuestos. Y <u>para eso usa como <mark class=\"hl-c\">imágenes</mark> a los objetos que abajo eran imitados</u>, y que habían sido conjeturados y estimados como claros respecto de los que eran sus imitaciones. —Comprendo que te refieres a la <mark class=\"hl-c\">geometría</mark> y a las artes afines. —Comprende entonces la otra sección de lo inteligible, cuando afirmo que <mark class=\"hl-g\">en ella la razón misma aprehende, por medio de la facultad <mark class=\"hl-c\">dialéctica</mark></mark>, y <u>hace de los supuestos no principios sino realmente supuestos, que son como peldaños y trampolines hasta el principio del todo, que es no supuesto</u>, y, tras aferrarse a él, ateniéndose a las cosas que de él dependen, desciende hasta una conclusión, <mark class=\"hl-b\">sin servirse para nada de <mark class=\"hl-c\">lo sensible</mark>, sino de Ideas, a través de Ideas y en dirección a Ideas, hasta concluir en Ideas</mark>."},
  {"id":"PLAREP16","ref":"República, libro VI","yt":"wwCNNstps-s","html":"—Comprendo, aunque no suficientemente, ya que creo que tienes en mente una tarea enorme: <u>quieres distinguir lo que de lo real e <mark class=\"hl-c\">inteligible</mark> es estudiado por la ciencia <mark class=\"hl-c\">dialéctica</mark></u>, <mark class=\"hl-g\">estableciendo que es más claro que lo estudiado por las llamadas ‘artes’</mark>, <u>para las cuales los supuestos son principios</u>. Y los que los estudian <mark class=\"hl-g\">se ven forzados a estudiarlos por medio del pensamiento discursivo, aunque no por los sentidos</mark>. Pero a raíz de <u>no hacer el examen avanzando hacia un principio sino a partir de supuestos</u>, te parece que no poseen inteligencia acerca de ellos, aunque sean inteligibles junto a un principio. Y creo que llamas ‘<mark class=\"hl-c\">pensamiento discursivo</mark>’ <u>al estado mental de los geómetras y similares</u>, pero no ‘<mark class=\"hl-c\">inteligencia</mark>’; <mark class=\"hl-g\">como si el ‘pensamiento discursivo’ fuera algo intermedio entre la <mark class=\"hl-c\">opinión</mark> y la inteligencia</mark>. —Entendiste perfectamente. Y ahora <u>aplica a las cuatro secciones estas cuatro afecciones que se generan en el alma</u>; <mark class=\"hl-g\">inteligencia, a la suprema; pensamiento discursivo, a la segunda; a la tercera asigna la <mark class=\"hl-c\">creencia</mark> y a la cuarta la <mark class=\"hl-c\">conjetura</mark></mark>; y ordénalas proporcionadamente, <mark class=\"hl-b\">considerando que cuanto más participen de la verdad tanto más participan de la claridad</mark>. —Entiendo, y estoy de acuerdo en ordenarlas como dices."}
 ]

   '<span class="tx-cov-art" aria-hidden="true">'+stick(a.id,44)+'<b>'+label+'</b></span>'+(id?'<span class="vplay-b sm" aria-hidden="true">▶</span>':'')+'</span>';

function txCard(a,t,i){

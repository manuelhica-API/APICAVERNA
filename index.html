 descartes:[
  ["¿Con qué obra y en qué año se suele situar el inicio de la filosofía moderna?",["Con las Meditaciones metafísicas, en 1641","Con el Discurso del método, en 1637","Con los Principios de la Filosofía, en 1644","Con las Reglas para la dirección del espíritu, en 1628"],1,"La filosofía moderna se inicia con Descartes en 1637, año de publicación del Discurso del método.","Racionalismo"],
  ["¿Dónde estudió Descartes y según qué principios fue educado?",["En la Universidad de París, según el humanismo","En el colegio jesuita de La Flèche, según la Escolástica","En Bolonia, según el método experimental de Galileo","En Estocolmo, según la filosofía griega clásica"],1,"Estudió de 1604 a 1612 en el colegio jesuita de La Flèche, educado según los principios de la Escolástica.","Racionalismo"],
  ["¿Por qué vivió Descartes en Holanda entre 1628 y 1649?",["Porque allí estaba la corte de la reina Cristina","Porque era el país más tolerante de la época","Porque allí se encontraba el colegio de La Flèche","Porque fue desterrado de Francia acusado de herejía"],1,"Holanda era el país más tolerante de la época y servía de refugio a científicos y filósofos.","Racionalismo"],
  ["¿Qué caracteriza, ante todo, a la filosofía moderna según los apuntes?",["La subordinación de la razón a la fe","La autonomía absoluta de la razón","El rechazo de la ciencia","La vuelta a la autoridad de Aristóteles"],1,"La filosofía moderna se caracteriza por la autonomía absoluta de la razón y por su conexión con la ciencia moderna.","Racionalismo"],
  ["En sentido negativo, la autonomía de la razón significa que…",["Que la razón no puede conocer nada con certeza","Que no la coarta la tradición, la autoridad ni la fe","Que la razón debe someterse siempre a la experiencia","Que la razón depende de Dios para poder funcionar"],1,"Negativamente, nada ajeno a la razón (tradición, autoridad, fe religiosa) puede regularla.","Racionalismo"],
  ["En sentido positivo, la autonomía de la razón implica que la razón es…",["Un instrumento al servicio de la teología","El tribunal supremo de lo verdadero y lo justo","Una facultad inferior a los sentidos","Una herencia de la tradición escolástica"],1,"Positivamente, la razón es el tribunal supremo, tanto en lo teórico como en lo moral y lo político.","Racionalismo"],
  ["¿Qué aportación hizo Descartes a las matemáticas?",["El cálculo infinitesimal","La geometría analítica","La teoría de probabilidades","Los números negativos"],1,"Descartes legó a las matemáticas la geometría analítica, además de trabajos de física y biología.","Racionalismo"],
  ["La autonomía de la razón y la conexión con la ciencia moderna son rasgos…",["Exclusivos del racionalismo","De toda la filosofía moderna","Exclusivos del empirismo","De la filosofía medieval"],1,"Ambos rasgos no son exclusivos del racionalismo, sino de toda la filosofía moderna.","Racionalismo"],
  ["¿Cuál de estos filósofos NO pertenece al racionalismo?",["Leibniz","Spinoza","Malebranche","Locke"],3,"Locke es empirista. Leibniz, Spinoza y Malebranche son racionalistas, como Descartes.","Racionalismo"],
  ["¿En qué siglo se sitúa el racionalismo y a qué corriente se opone?",["Siglo XVII; se opone al empirismo inglés","Siglo XVIII; se opone a la Escolástica medieval","Siglo XVI; se opone al humanismo renacentista","Siglo XIX; se opone al idealismo alemán"],0,"El racionalismo es la corriente del siglo XVII que se opone al empirismo inglés del siglo XVIII.","Racionalismo"],
  ["¿Cuál es la mejor forma de entender la oposición entre racionalismo y empirismo?",["Comparar sus teorías políticas","Comparar su idea del origen del conocimiento","Comparar su relación con la religión y con la Iglesia","Comparar sus teorías éticas"],1,"La diferencia clave está en el origen del conocimiento: la razón o la experiencia sensible.","Racionalismo"],
  ["Según el empirismo, nuestros conocimientos proceden…",["De ideas innatas presentes al nacer","En último término, de la experiencia","De la revelación divina","De la intuición intelectual pura"],1,"Para el empirismo, todo conocimiento procede en último término de la experiencia sensible.","Racionalismo"],
  ["Según el racionalismo, nuestros conocimientos válidos acerca de la realidad proceden…",["De los sentidos","De la razón misma","De la tradición","De la autoridad de la Iglesia"],1,"El racionalismo sostiene que el conocimiento válido procede de la razón misma.","Racionalismo"],
  ["¿Qué papel da el racionalismo al conocimiento sensible?",["Es la única fuente fiable de conocimiento","Lo infravalora porque los sentidos engañan","Lo considera la base de toda deducción","Lo identifica con la intuición intelectual"],1,"Una de las características del racionalismo es la crítica del conocimiento sensible, que se considera engañoso.","Racionalismo"],
  ["¿Qué son las ideas innatas para el racionalismo?",["Ideas que proceden de la experiencia externa","Verdades presentes en potencia en el entendimiento","Ideas construidas libremente por la imaginación","Opiniones heredadas de la tradición y la escuela"],1,"Las ideas innatas son verdades que se hallan potencialmente en el entendimiento.","Racionalismo"],
  ["¿Qué significa la «racionalidad del mundo» como rasgo del racionalismo?",["Que el mundo es una ilusión creada por la mente","Que todo lo que sucede tiene una razón cognoscible","Que solo existe la razón y nada más es real","Que el mundo es caótico e incomprensible para nosotros"],1,"Todo lo que compone la realidad tiene una justificación que la razón puede llegar a conocer: todo lo real es racional.","Racionalismo"],
  ["La confianza absoluta del racionalismo en la razón supone que…",["No hay límites al conocimiento humano","Solo podemos conocer lo que percibimos","La razón necesita el apoyo de la fe","El conocimiento es siempre solo probable"],0,"El racionalismo confía en la capacidad cognoscitiva de la razón: no hay límites al conocimiento humano.","Racionalismo"],
  ["¿Cómo se construye el conocimiento según el racionalismo?",["Inductivamente, a partir de muchas observaciones","Deductivamente, desde las ideas innatas","Por acumulación de opiniones de los sabios","Por revelación divina a través de la fe"],1,"El conocimiento puede construirse deductivamente a partir de primeros principios, las ideas innatas.","Racionalismo"],
  ["¿Qué aspira a construir el racionalismo?",["Una ciencia universal basada en el método matemático","Una ciencia probable basada en la experiencia sensible","Un saber religioso fundado en la revelación divina","Una colección de saberes independientes entre sí"],0,"El racionalismo aspira a una ciencia universal y necesaria, con el método matemático como modelo.","Racionalismo"],
  ["Para el racionalismo, el método más adecuado del pensamiento es…",["La inducción","La deducción","La observación","La experimentación"],1,"La deducción se considera el método más adecuado del pensamiento.","Racionalismo"],
  ["¿Qué lugar ocupa el método en la filosofía de Descartes?",["Es un asunto secundario en su obra","Es su punto de partida y su meta","Solo le interesa para las matemáticas","Lo toma directamente de Aristóteles"],1,"Descartes dedicó gran parte de sus esfuerzos al método, punto de partida y meta de su filosofía.","Método"],
  ["¿Qué situación provoca la búsqueda de un nuevo método en la Edad Moderna?",["El triunfo definitivo de la Escolástica","El derrumbe del sistema de creencias medieval","La aparición del empirismo inglés","La invención de la imprenta y su difusión"],1,"La búsqueda nace del derrumbamiento de la Escolástica, aceptada durante siglos sin análisis crítico.","Método"],
  ["¿Sobre qué dos autoridades principales se fundaba la Escolástica?",["Platón y Agustín de Hipona","Aristóteles y Tomás de Aquino","Copérnico y Galileo Galilei","Lutero y Erasmo de Rotterdam"],1,"La Escolástica se fundaba en la autoridad de Aristóteles y Tomás de Aquino.","Método"],
  ["¿Qué necesitaba la filosofía tras la crisis de la Escolástica?",["Algunos descubrimientos ocasionales","Un criterio de verdad que sustituyera a la autoridad","Volver a la Biblia como única fuente de verdad","Abandonar la razón y confiar únicamente en la fe revelada"],1,"No bastaban descubrimientos ocasionales: hacía falta un nuevo criterio de verdad que sustituyera a la autoridad de la Escolástica, de Aristóteles y de la Biblia.","Método"],
  ["¿Qué expresión de Kant recogen los apuntes para describir el nuevo papel de la razón?",["La revolución copernicana","La mayoría de edad de la razón","La cosa en sí incognoscible","El imperativo categórico"],1,"La razón alcanza su «mayoría de edad», como dirá Kant en ¿Qué es Ilustración?","Método"],
  ["¿Cuáles son los dos métodos predominantes en la filosofía moderna?",["Inductivo y dialéctico","Experimental y matemático","Escolástico y humanista","Socrático y platónico"],1,"Los métodos experimental y matemático configuran el empirismo y el racionalismo.","Método"],
  ["¿Qué método elige Descartes?",["El experimental","El matemático","El dialéctico","El histórico"],1,"Descartes opta por el método matemático, inaugurando así el racionalismo.","Método"],
  ["¿Qué coincidencia temática hay entre empiristas y racionalistas?",["Ninguna: no comparten ningún tema","Todos ponen el método en el centro","Todos aceptan la existencia de ideas innatas","Todos rechazan la ciencia de su tiempo"],1,"Aunque lo entiendan de forma distinta, todos ponen el tema del método en el centro.","Método"],
  ["Según Descartes, las diversas ciencias son…",["Saberes completamente independientes","Manifestaciones de una única sabiduría","Opiniones sin un fundamento sólido","Partes subordinadas a la teología"],1,"Las ciencias no son otra cosa que la sabiduría humana, que permanece una e idéntica aunque se aplique a objetos diversos.","Método"],
  ["¿Con qué imagen ilustra Descartes la unidad de la sabiduría en las Reglas?",["Con la luz del sol, que es la misma ilumine lo que ilumine","Con una escalera por la que se sube peldaño a peldaño","Con una ciudad construida por un solo arquitecto","Con un río que se divide en muchos brazos distintos"],0,"La sabiduría no recibe de los objetos más distinción que la luz del sol de los objetos que ilumina.","Método"],
  ["¿De dónde procede, en último término, la concepción unitaria del saber?",["De una concepción unitaria de la razón","De la unidad de la Iglesia católica","De la experiencia sensible acumulada","De la tradición aristotélica medieval"],0,"La sabiduría es única porque la razón es única.","Método"],
  ["En el árbol de la filosofía de Descartes, las raíces son…",["La física","La metafísica","La moral","La mecánica y la medicina"],1,"«Toda la filosofía es como un árbol, cuyas raíces son la metafísica, el tronco es la física…»","Método"],
  ["En el árbol de la filosofía, ¿qué representa el tronco?",["La metafísica","La física","La mecánica","La lógica"],1,"El tronco es la física, de la que salen las ramas de las demás ciencias.","Método"],
  ["¿A qué tres ciencias principales se reducen las ramas del árbol del saber?",["Lógica, ética y política","Medicina, mecánica y moral","Astronomía, geometría y música","Física, química y biología"],1,"Las ramas se reducen a tres principales: la medicina, la mecánica y la moral.","Método"],
  ["¿En qué obra aparece la imagen del árbol de la filosofía?",["Discurso del método","Principios de la Filosofía","Meditaciones metafísicas","Reglas para la dirección del espíritu"],1,"La cita del árbol procede de los Principios de la Filosofía.","Método"],
  ["¿Cuáles son los dos modos de conocimiento según Descartes?",["Sensación y memoria","Intuición y deducción","Opinión y ciencia","Inducción y abstracción"],1,"Según Descartes hay dos modos de conocimiento: la intuición y la deducción.","Método"],
  ["¿Cómo describe Descartes la intuición?",["Como una opinión solo probable","Como una «luz o instinto natural»","Como una sensación del cuerpo","Como un razonamiento muy largo"],1,"La intuición es una especie de luz o instinto natural de la razón.","Método"],
  ["¿Cuál es el objeto de la intuición?",["Las cualidades secundarias","Las naturalezas simples","Las opiniones de la tradición","Las cosas sensibles"],1,"La intuición capta las naturalezas simples de manera inmediata y sin posibilidad de error.","Método"],
  ["Según las Reglas III, la intuición es más cierta que…",["La fe","La deducción misma","Las matemáticas","Los sentidos solo a veces"],1,"Es un concepto de la mente pura y atenta que nace de la sola luz de la razón y es más cierto que la deducción misma.","Método"],
  ["¿Qué es la deducción para Descartes?",["Un conocimiento de las cosas sensibles","Una sucesión encadenada de intuiciones","Una generalización a partir de casos","Una creencia aceptada sin fundamento"],1,"Por larga que sea, la deducción es en último término una sucesión de intuiciones y de sus conexiones.","Método"],
  ["¿Qué dos pasos exige el dinamismo de la intuición y la deducción?",["Observación y experimentación","Análisis y síntesis","Duda y fe","Tesis y antítesis"],1,"Primero un análisis hasta las naturalezas simples; después una síntesis o reconstrucción deductiva de lo complejo.","Método"],
  ["¿En qué consiste el proceso de síntesis?",["En descomponer lo complejo en sus partes","En reconstruir lo complejo desde lo simple","En revisar que no falte ningún elemento","En dudar de todo lo que no es evidente"],1,"La síntesis es la reconstrucción deductiva de lo complejo a partir de lo simple.","Método"],
  ["Según la definición de las Reglas IV, el método consiste en…",["Unas reglas ciertas y fáciles para no tomar lo falso por verdadero","Una colección ordenada de experimentos y observaciones de la naturaleza","Una serie de dogmas de fe aceptados por la razón","Un conjunto de opiniones probables de los sabios"],0,"Por método entiende unas reglas ciertas y fáciles con las que no se tomará nunca por verdadero lo que es falso.","Método"],
  ["¿En qué obra expone Descartes las cuatro reglas del método?",["En la segunda parte del Discurso del método","En la sexta de las Meditaciones metafísicas","En la primera parte de los Principios de la Filosofía","En el tratado de Las pasiones del alma"],0,"Las reglas del método aparecen en la segunda parte del Discurso del método.","Método"],
  ["¿Cuáles son las cuatro reglas del método?",["Duda, cogito, Dios y mundo","Evidencia, análisis, síntesis y comprobación","Observación, hipótesis, experimento y ley","Intuición, deducción, inducción y abstracción"],1,"Las cuatro reglas son evidencia, análisis, síntesis y comprobaciones (enumeración y revisión).","Método"],
  ["¿Qué exige la regla de la evidencia?",["Dividir cada dificultad en tantas partes como sea posible","No admitir nada que no se presente clara y distintamente","Empezar por lo más simple para subir poco a poco a lo complejo","Hacer revisiones generales para estar seguro de no omitir nada"],1,"No admitir jamás como verdadera cosa alguna sin conocer con evidencia que lo era.","Método"],
  ["¿Qué dos errores manda evitar la primera regla del método?",["La duda y la fe","La precipitación y la prevención","La deducción y la intuición intelectual","El análisis y la síntesis"],1,"La regla de la evidencia pide evitar cuidadosamente la precipitación y la prevención.","Método"],
  ["«Dividir cada una de las dificultades que examinase en tantas partes como fuese posible» corresponde a la regla de…",["Evidencia","Análisis","Síntesis","Comprobación"],1,"Es la segunda regla, la del análisis.","Método"],
  ["«Conducir ordenadamente mis pensamientos comenzando por los objetos más simples» corresponde a la regla de…",["Síntesis","Evidencia","Análisis","Comprobación"],0,"Es la tercera regla: ascender poco a poco de lo más simple a lo más complejo.","Método"],
  ["¿Qué pide la cuarta regla del método?",["Dudar de todo lo que nos dicen los sentidos","Hacer enumeraciones y revisiones para no omitir nada","Aceptar solo lo que se presenta como evidente","Partir siempre de lo más complejo hacia lo simple"],1,"La regla de comprobación pide enumeraciones tan completas y revisiones tan generales que no se omita nada.","Método"],
  ["¿A qué procesos se refieren la segunda y la tercera reglas del método?",["A la duda y al cogito","Al análisis y a la síntesis","A la intuición y la fe","A la evidencia y la comprobación"],1,"La segunda regla es el análisis y la tercera la síntesis.","Método"],
  ["Según Descartes, ¿en qué ámbito se había usado ya la razón conforme a su método?",["En la teología","En las matemáticas","En la política","En la medicina y la anatomía"],1,"Hasta entonces la razón se había usado así solo en las matemáticas, con resultados admirables.","Método"],
  ["¿Por qué puede aplicarse el método a todos los ámbitos del saber?",["Porque todas las ciencias son experimentales","Porque la razón es única","Porque Dios lo garantiza","Porque lo dice Aristóteles"],1,"Al ser única la razón, nada impide utilizar el mismo método en todos los ámbitos del saber.","Método"],
  ["¿En qué consistía el proyecto cartesiano?",["En la unificación de la ciencia","En defender la Escolástica","En demostrar el empirismo","En reformar la Iglesia católica"],0,"El proyecto cartesiano consistía en la unificación de la ciencia, construida con un único método.","Método"],
  ["¿Qué exige la construcción del edificio del saber?",["Un punto de partida absolutamente cierto","Una gran cantidad de observaciones","La aceptación de la tradición heredada","Un acuerdo entre todos los sabios"],0,"Exige un punto de partida absolutamente cierto, sobre el que no sea posible dudar.","Método"],
  ["¿Qué camino elige Descartes para hallar un punto de partida absolutamente cierto?",["La experiencia","La duda metódica","La revelación","La autoridad de la tradición"],1,"El camino elegido por Descartes es el de la duda metódica.","Duda y cogito"],
  ["¿Es escéptica la duda cartesiana?",["Sí: Descartes duda por el simple gusto de dudar","No: usa la duda solo como camino hacia la verdad","Sí: concluye que no podemos llegar a saber nada","No: porque en realidad no duda de nada en absoluto"],1,"No es una actitud escéptica ni una duda gratuita: es un instrumento para buscar la verdad.","Duda y cogito"],
  ["¿Por qué la duda cartesiana se llama «metódica»?",["Porque se aplica solo a las matemáticas","Porque la exige el método en su fase analítica","Porque la impone la Iglesia a los filósofos","Porque es una duda definitiva e irreversible"],1,"La duda es metódica porque es una exigencia del método en su momento analítico.","Duda y cogito"],
  ["¿Cuál es la función principal de la duda metódica?",["Destruir toda posibilidad de conocimiento","Hacer un desescombro de nuestro conocimiento","Demostrar directamente la existencia del mundo","Sustituir a la razón como guía del saber"],1,"Su función principal es ejercer una labor de desescombro, eliminando todo aquello de que sea posible dudar.","Duda y cogito"],
  ["¿Con qué regla del método se corresponde la duda metódica?",["Con la primera, la evidencia","Con la segunda, el análisis","Con la tercera, la síntesis","Con la cuarta, la comprobación"],1,"La duda permite llevar a cabo la labor de análisis (2.ª regla) hasta llegar a una verdad simple e indubitable.","Duda y cogito"],
  ["¿Qué hay que eliminar según la duda metódica?",["Solo las opiniones que ya sabemos falsas","Todo aquello de lo que sea posible dudar","Solo las creencias religiosas tradicionales","Solo las verdades de las matemáticas"],1,"Hay que eliminar todos los conocimientos, ideas y creencias que no tengan una certeza absoluta.","Duda y cogito"],
  ["¿Cómo se ordenan los tres niveles de duda?",["De mayor a menor radicalidad","De menor a mayor radicalidad","Sin un orden concreto","Según su importancia religiosa"],1,"Descartes introduce tres niveles de duda que van de menor a mayor radicalidad escéptica.","Duda y cogito"],
  ["¿Cuál es el primer nivel de duda?",["El genio maligno","La falacia de los sentidos","El argumento del sueño","La duda sobre la existencia de Dios"],1,"El primer nivel es la falacia de los sentidos.","Duda y cogito"],
  ["¿Qué argumenta la falacia de los sentidos?",["Que los sentidos nunca nos engañan","Que si nos engañan a veces, pueden engañarnos siempre","Que solo nos engaña la vista, no los demás sentidos","Que los sentidos son la base de todo conocimiento"],1,"Si a veces nos engañan, ¿qué garantía hay de que no lo hagan siempre?","Duda y cogito"],
  ["¿Por qué no basta con que sea improbable que los sentidos nos engañen siempre?",["Porque lo improbable no equivale a lo cierto","Porque los sentidos son en realidad infalibles","Porque Dios controla lo que perciben los sentidos","Porque lo prohíbe la tercera regla del método"],0,"Aunque sea improbable, la improbabilidad no equivale a la certeza que exige el método.","Duda y cogito"],
  ["¿Qué permite dudar el argumento del sueño?",["Solo de las verdades de las matemáticas","De que el mundo que percibimos sea real","De que yo estoy pensando en este momento","De la existencia de un Dios bueno y veraz"],1,"Como no podemos distinguir con seguridad la vigilia del sueño, dudamos de la existencia de lo que percibimos.","Duda y cogito"],
  ["¿En qué se basa el argumento del sueño?",["En que los sueños son siempre falsos","En que no hay un criterio seguro para distinguir vigilia y sueño","En que el sueño es una enfermedad del cuerpo que confunde a la mente","En que en los sueños se nos aparece Dios"],1,"A veces los sueños son tan vivos como la vigilia y no hay criterios para distinguirlos.","Duda y cogito"],
  ["¿Qué verdades resisten el argumento del sueño, pero no el del genio maligno?",["Las verdades matemáticas","Las percepciones sensibles","La existencia del mundo","La existencia de mi cuerpo"],0,"Dormidos o despiertos, los tres ángulos de un triángulo suman 180°; solo el genio maligno permite dudar de ello.","Duda y cogito"],
  ["¿Cuál es el nivel más radical de la duda?",["La falacia de los sentidos","El argumento del sueño","El argumento del genio maligno","La duda sobre la tradición y la autoridad"],2,"El genio maligno es el tercer y más radical motivo de duda.","Duda y cogito"],
  ["¿Qué supone la hipótesis del genio maligno?",["Que Dios es bueno y veraz y no nos engaña","Que quizá el entendimiento se equivoca siempre","Que los sentidos son fiables si se usan bien","Que el mundo exterior existe con certeza"],1,"Supone que tal vez el entendimiento humano se equivoca siempre, incluso al pensar con verdad aparente.","Duda y cogito"],
  ["¿Cómo describe Descartes al genio maligno en las Meditaciones?",["Como un ser débil e ignorante que se equivoca","Como un ser muy poderoso que se empeña en engañarme","Como el propio Dios, que pone a prueba nuestra fe","Como un simple sueño del que podemos despertar"],1,"Es un genio extremadamente poderoso e inteligente que pone todo su empeño en inducirme a error.","Duda y cogito"],
  ["¿A qué parece abocar la duda llevada a su extremo?",["Al dogmatismo","Al escepticismo","Al empirismo","Al materialismo"],1,"Llegado a una duda universal, parece abocar irremisiblemente al escepticismo.","Duda y cogito"],
  ["¿Cuál es la primera verdad que encuentra Descartes?",["Dios existe","El mundo existe","Pienso, luego existo","Los cuerpos son extensos"],2,"La existencia del propio sujeto que piensa y duda: «Cogito, ergo sum».","Duda y cogito"],
  ["¿Por qué el cogito resiste a toda duda?",["Porque lo garantizan los sentidos","Porque para dudar tengo que existir","Porque lo enseña la Escolástica","Porque es una verdad matemática"],1,"Si pienso que el mundo existe, puedo equivocarme sobre el mundo, pero no sobre que lo pienso.","Duda y cogito"],
  ["¿Qué significa «Cogito, ergo sum»?",["Dudo, luego no sé nada","Pienso, luego existo","Siento, luego existo","Creo, luego entiendo"],1,"Es la célebre frase con la que Descartes expresa la primera verdad: pienso, luego existo.","Duda y cogito"],
  ["Para Descartes, «pensar» incluye…",["Solo razonar matemáticamente","Dudar, afirmar, creer, amar…","Solo percibir con los sentidos","Solo imaginar figuras y formas"],1,"Mi existencia como sujeto que piensa (duda, afirma, cree, se equivoca, ama, etc.) está exenta de toda duda.","Duda y cogito"],
  ["Además de ser la primera verdad, el cogito es…",["Una hipótesis provisional","El prototipo de toda certeza","Una verdad revelada por Dios","Una opinión solo probable"],1,"La existencia del sujeto pensante es la primera verdad y el prototipo de toda verdad.","Duda y cogito"],
  ["¿Cuál es el criterio de verdad que Descartes deduce del cogito?",["La utilidad","La claridad y la distinción","La coherencia con la tradición","El acuerdo de la mayoría"],1,"Todo lo que perciba con igual claridad y distinción será verdadero.","Duda y cogito"],
  ["¿Por qué es absolutamente indubitable la existencia del sujeto pensante?",["Porque la vemos con los ojos","Porque se percibe clara y distintamente","Porque Dios la demuestra en las Escrituras","Porque la acepta todo el mundo"],1,"Es indudable porque se percibe con total claridad y distinción, y de ahí sale el criterio de verdad.","Duda y cogito"],
  ["«Todo lo que percibo clara y distintamente es verdadero» aparece en…",["Meditaciones, III","Discurso del método, II","Principios de la Filosofía","Reglas, IV"],0,"La regla general del criterio de verdad se formula en la Meditación III.","Duda y cogito"],
  ["Tras el cogito, ¿cuál es el gran problema que se plantea Descartes?",["Demostrar que realmente está pensando","Tener certeza de que existe algo fuera del pensamiento","Encontrar un método común y seguro para todas las ciencias","Refutar la teoría de las Ideas de Platón"],1,"La existencia del yo no implica otra realidad: ¿cómo saber que existe algo exterior al pensamiento?","Ideas y Dios"],
  ["¿Por qué Descartes tiene que deducir la realidad a partir del pensamiento?",["Porque así lo exige el ideal deductivo","Porque los sentidos son fiables","Porque así lo establece la Biblia","Porque lo prefiere por comodidad"],0,"El ideal deductivo exige extraer todos los conocimientos a partir de la primera verdad, el cogito.","Ideas y Dios"],
  ["En «yo pienso que el mundo existe», ¿qué factor es dudoso?",["El yo que piensa","El mundo exterior","La idea de mundo","La idea de existir"],1,"El yo es indudable y las ideas también; lo dudoso es la realidad exterior del mundo.","Ideas y Dios"],
  ["¿Con qué dos elementos cuenta Descartes para llevar a cabo la deducción?",["Los sentidos y la memoria","El pensamiento y las ideas que piensa","Dios y el mundo exterior que ha creado","La fe y la razón natural"],1,"El inventario solo muestra dos elementos: el pensamiento como actividad (yo pienso) y las ideas que pienso.","Ideas y Dios"],
  ["¿Qué concluye Descartes de su análisis del pensamiento?",["Que el pensamiento piensa directamente cosas","Que el pensamiento siempre piensa ideas","Que el pensamiento es algo material","Que en realidad no podemos pensar"],1,"De su análisis concluye que el pensamiento siempre piensa ideas.","Ideas y Dios"],
  ["Para la filosofía anterior a Descartes, ¿qué es la idea?",["Una fotografía o representación que contemplamos","Un medio transparente, como una lente, para ver las cosas","Una sustancia que existe por sí misma fuera de la mente humana","Una sensación producida por los objetos"],1,"Antes, el pensamiento recaía directamente sobre las cosas: la idea era como una lente transparente.","Ideas y Dios"],
  ["Para Descartes, ¿qué es la idea?",["Una lente transparente a través de la que vemos las cosas","Una representación o fotografía que contemplamos","Una realidad que existe en sí misma fuera de la mente","Un objeto material que se imprime en los sentidos"],1,"El pensamiento no recae sobre las cosas sino sobre las ideas, que son representaciones.","Ideas y Dios"],
  ["Según los apuntes, ¿qué cambia en la filosofía a partir de Descartes?",["Pasa de idealista a realista","Pasa de realista a idealista","Pasa de racionalista a empirista","No cambia nada"],1,"La filosofía es realista hasta Descartes e idealista a partir de él.","Ideas y Dios"],
  ["¿En qué se diferencia la idea cartesiana de la Idea platónica?",["En nada: ambas son modelos eternos de las cosas","Para Platón existían por sí; para Descartes son contenidos mentales","Para Descartes las ideas son materiales y para Platón espirituales","Para Platón eran sensaciones y para Descartes conceptos"],1,"Para Platón las Ideas existían independientemente de las cosas; en Descartes son lo que el pensamiento piensa.","Ideas y Dios"],
  ["Como actos mentales o «modos del pensamiento», las ideas…",["Tienen todas la misma realidad","Tienen realidades muy distintas","No tienen realidad","Son sustancias"],0,"Como actos mentales, todas las ideas poseen la misma realidad.","Ideas y Dios"],
  ["En cuanto a su contenido objetivo, ¿qué ideas tienen más realidad?",["Las que representan modos o accidentes","Las que representan sustancias","Las facticias","Todas tienen la misma"],1,"Las ideas que representan sustancias poseen más realidad objetiva que las que representan modos o accidentes.","Ideas y Dios"],
  ["¿Qué son las ideas adventicias?",["Las que construye la propia mente","Las que parecen venir de fuera","Las que el pensamiento posee en sí","Las que Dios nos revela"],1,"Son las que parecen provenir de nuestra experiencia externa: ser humano, caballo, alas…","Ideas y Dios"],
  ["¿Por qué se dice que las ideas adventicias «parecen» provenir del exterior?",["Porque aún no consta que exista un mundo exterior","Porque son falsas y no representan nada real","Porque las inventa la imaginación a partir de otras","Porque vienen directamente de Dios"],0,"Decimos «parecen» porque todavía no está demostrada la existencia del mundo exterior.","Ideas y Dios"],
  ["¿Cuál de estas es una idea facticia?",["La idea de pensamiento","La idea de centauro","La idea de existencia","La idea de infinito"],1,"Las facticias las construye la mente a partir de otras ideas: caballo alado, centauro, ratoncito Pérez…","Ideas y Dios"],
  ["¿Por qué las ideas adventicias no sirven para demostrar la existencia del mundo?",["Porque presuponen esa misma existencia: sería un círculo","Porque son innatas y no dicen nada del exterior","Porque son demasiado claras y distintas para ser reales","Porque las crea Dios y podrían ser un engaño suyo"],0,"Su validez depende de la problemática existencia de la realidad extramental, así que sería un círculo vicioso.","Ideas y Dios"],
  ["¿Qué son las ideas innatas?",["Las que el pensamiento posee en sí mismo","Las que proceden de los sentidos","Las que construye la imaginación combinando otras ideas","Las que se aprenden en la escuela"],0,"Son ideas que no son adventicias ni facticias: el pensamiento las posee en sí mismo.","Ideas y Dios"],
  ["¿Cuál de estas es un ejemplo de idea innata en los apuntes?",["La idea de caballo","La idea de existencia","La idea de ratoncito Pérez","La idea de color"],1,"Las ideas de «pensamiento» y «existencia» son innatas: las encuentro en el propio «pienso, luego existo».","Ideas y Dios"],
  ["¿Cuál es la afirmación fundamental del racionalismo sobre las ideas primitivas del conocimiento?",["Que proceden de la experiencia","Que son innatas","Que son facticias","Que no existen"],1,"Las ideas primitivas a partir de las cuales se construye el edificio del conocimiento son innatas.","Ideas y Dios"],
  ["¿Con qué identifica Descartes la idea de infinito?",["Con el mundo","Con Dios","Con el yo","Con la extensión"],1,"Entre las ideas innatas descubre la de infinito, que identifica con la idea de Dios.","Ideas y Dios"],
  ["¿Por qué la idea de Dios no es adventicia?",["Porque no tenemos experiencia directa de Dios","Porque la construye la mente juntando otras ideas","Porque es una idea confusa y oscura","Porque procede de los sentidos externos"],0,"Evidentemente no es adventicia, pues no poseemos experiencia directa de Dios.","Ideas y Dios"],
  ["¿Cómo argumenta Descartes que la idea de infinito no es facticia?",["La idea de finitud presupone la de infinitud","La idea de infinito procede de la experiencia","La idea de infinito la inventó la Iglesia","La idea de infinito es oscura y confusa"],0,"Contra la opinión tradicional, la noción de finitud presupone la de infinitud, y no al revés.","Ideas y Dios"],
  ["¿Cuántos argumentos da Descartes para demostrar la existencia de Dios?",["Uno","Dos","Tres","Cinco"],2,"Dos argumentos de causalidad (aplicado a la idea de infinito y a mi propio ser) y el argumento ontológico.","Ideas y Dios"],
  ["En el argumento de causalidad aplicado a la idea de infinito, la causa de una idea debe tener…",["Tanta realidad formal como objetiva tenga la idea","Menos realidad que la que representa la idea","Solo realidad material, nunca espiritual","Ninguna realidad, porque las ideas no tienen causa"],0,"La causa ha de tener tanta realidad formal cuanta realidad objetiva tenga su idea: la idea de infinito la causa un ser infinito.","Ideas y Dios"],
  ["¿Qué afirma el argumento de causalidad aplicado a mi propio ser?",["Que soy causa de mí mismo y me mantengo","Que si me hubiera creado yo, me habría hecho perfecto","Que el mundo material es el que me ha creado y me conserva","Que en realidad no existo y solo lo pienso"],1,"Soy imperfecto y tengo la idea de perfección: la causa de mi ser ha de ser Dios.","Ideas y Dios"],
  ["¿De quién toma Descartes, básicamente, el argumento ontológico?",["De Tomás de Aquino","De Anselmo de Canterbury","De Platón","De Agustín de Hipona, en sus Confesiones"],1,"Es básicamente el mismo argumento de Anselmo de Canterbury.","Ideas y Dios"],
  ["¿Qué ejemplo usa Descartes en el argumento ontológico?",["Un trozo de cera que cambia con el calor","Un triángulo, que no se concibe sin tres lados","Una ciudad construida por un solo arquitecto","Un árbol cuyas raíces son la metafísica"],1,"Igual que no podemos concebir un triángulo sin tres lados, no podemos concebir un ser perfecto al que le falte la existencia.","Ideas y Dios"],
  ["¿Qué sostiene el argumento ontológico?",["Que la idea de ser perfecto implica su existencia","Que el mundo necesita una causa primera","Que soy imperfecto y por eso necesito a Dios","Que los sentidos prueban la existencia de Dios"],0,"La idea de un ser perfecto contiene en sí misma su existencia.","Ideas y Dios"],
  ["¿Cómo demuestra Descartes la existencia del mundo?",["Por el testimonio fiable de los sentidos","A partir de Dios, que es veraz y no puede engañarme","Por el argumento del sueño y la vigilia","Por la autoridad de Aristóteles y de la filosofía escolástica"],1,"Dios es infinitamente bueno y veraz: no puede permitir que me engañe al creer que el mundo existe.","Ideas y Dios"],
  ["¿Qué papel cumple Dios respecto del mundo en la filosofía cartesiana?",["Es una hipótesis innecesaria para su filosofía","Garantiza que a mis ideas les corresponde una realidad","Es el genio maligno que me engaña sobre todas las cosas","Es una idea facticia construida por mí"],1,"Dios aparece como garantía de que a mis ideas corresponde un mundo, algo paradójico en un sistema racionalista.","Ideas y Dios"],
  ["¿Garantiza Dios que a todas mis ideas les corresponda una realidad?",["Sí, a todas sin excepción, incluidas las facticias","No: solo garantiza un mundo de extensión y movimiento","Sí, pero solo a las ideas facticias","No garantiza nada: el mundo exterior sigue siendo dudoso"],1,"Dios no garantiza las cualidades secundarias; solo un mundo de extensión y movimiento.","Ideas y Dios"],
  ["¿Cuáles son las cualidades primarias?",["Color, olor y sabor","Extensión y movimiento","Frío, calor y humedad","Belleza y bondad"],1,"Las cualidades primarias son la extensión y el movimiento, de las que puede deducirse la física.","Ideas y Dios"],
  ["¿Qué dice Descartes de las cualidades secundarias como colores, sabores o sonidos?",["Que son lo más real del mundo","Que no existen fuera, aunque tengamos sus ideas","Que son ideas innatas","Que las garantiza Dios igual que la extensión y el movimiento"],1,"Como Galileo y la ciencia moderna, Descartes niega que existan las cualidades secundarias.","Ideas y Dios"],
  ["¿Qué puede deducirse de la extensión y el movimiento?",["La moral y las normas de conducta","La física y las leyes del movimiento","La existencia de Dios como causa de todo","Las cualidades secundarias"],1,"A partir de la extensión y el movimiento puede deducirse la física.","Ideas y Dios"],
  ["¿Cuáles son las tres sustancias de Descartes?",["Agua, aire y fuego","Sustancia infinita, pensante y extensa","Alma racional, irascible y concupiscible","Materia, forma y acto"],1,"Dios (res infinita), el yo (res cogitans) y los cuerpos (res extensa).","Sustancias"],
  ["¿Qué nombre latino recibe la sustancia pensante?",["Res extensa","Res cogitans","Res infinita","Res publica"],1,"El yo o sustancia pensante es la res cogitans.","Sustancias"],
  ["¿Qué nombre latino recibe la sustancia de los cuerpos?",["Res cogitans","Res infinita","Res extensa","Res materialis"],2,"Los cuerpos son sustancia extensa: res extensa.","Sustancias"],
  ["¿Qué es el atributo de una sustancia?",["Una modificación pasajera","Su esencia","Su causa","Una cualidad secundaria"],1,"Cada sustancia tiene una esencia que Descartes denomina atributo.","Sustancias"],
  ["¿Cuál es el atributo de la sustancia pensante?",["La extensión","El pensamiento","La infinitud","El movimiento"],1,"El atributo de la res cogitans es el pensamiento.","Sustancias"],
  ["¿Cuál es el atributo de la sustancia extensa?",["El pensamiento","La infinitud","La extensión","El color"],2,"El atributo de la res extensa es la extensión.","Sustancias"],
  ["¿Cuál es el atributo de Dios?",["La infinitud","La extensión","El pensamiento","El movimiento"],0,"El atributo de la sustancia infinita es la infinitud.","Sustancias"],
  ["¿Qué son los modos de una sustancia?",["Su esencia o naturaleza","Las modificaciones de la sustancia","Las pruebas que demuestran su existencia","Sus causas"],1,"Los modos son las modificaciones de la sustancia.","Sustancias"],
  ["¿Cuáles son modos de la sustancia pensante?",["Profundidad, volumen y anchura","Creer, dudar, imaginar, amar","Color, olor y sabor","Infinitud y perfección"],1,"Los modos de la res cogitans son creer, dudar, imaginar, sentir, amar, odiar, etc.","Sustancias"],
  ["¿Cuáles son modos de la sustancia extensa?",["Dudar, creer e imaginar","Profundidad, volumen y figura","Amar, odiar y desear con la voluntad","Ninguno, porque no tiene"],1,"Los modos de la res extensa son la profundidad, el volumen, la anchura, etc.","Sustancias"],
  ["¿Por qué la sustancia infinita no tiene modos?",["Porque no existe realmente","Porque, al ser perfecta, es siempre idéntica","Porque es material y está sometida al cambio continuo","Porque es una idea facticia"],1,"Dada su perfección, la sustancia infinita no tendría modos: es siempre idéntica.","Sustancias"],
  ["¿Cómo define Descartes la sustancia?",["Lo que existe en otra cosa y depende de ella","Lo que existe sin necesitar de otra cosa","Lo que se percibe con los sentidos","La unión de materia y forma"],1,"Sustancia es toda cosa que no necesita de ninguna otra cosa para existir.","Sustancias"],
  ["Tomada al pie de la letra, ¿a qué se aplicaría la definición de sustancia?",["A los cuerpos","Solo a Dios","Solo al yo","A las ideas"],1,"En sentido absoluto, solo Dios no necesita de nada para existir.","Sustancias"],
  ["¿Por qué mantiene Descartes el nombre de sustancia para el yo y los cuerpos?",["Porque no necesitan la una de la otra para existir","Porque ambos son infinitos y perfectos como Dios","Porque cada uno se crea a sí mismo","Porque son idénticos y forman una sola realidad"],0,"La sustancia pensante y la extensa no necesitan la una de la otra para existir.","Sustancias"],
  ["¿Qué tipo de dualismo antropológico defiende Descartes?",["Uno más moderado que el de Platón","Uno más radical que el de Platón","Ninguno","Uno igual al de Aristóteles"],1,"Se deduce un dualismo antropológico mucho más radical que el del propio Platón.","Sustancias"],
  ["¿Cuál es el objetivo último de separar alma y cuerpo como sustancias distintas?",["Explicar el origen de las enfermedades","Salvaguardar la autonomía del alma","Demostrar la existencia del mundo","Negar la libertad del ser humano"],1,"El objetivo es salvaguardar la autonomía del alma con respecto a la materia.","Sustancias"],
  ["¿Qué concepción del mundo material imponía la ciencia moderna?",["Teleológica y libre","Mecanicista y determinista","Mágica y simbólica","Animista, vitalista y orgánica"],1,"La ciencia moderna imponía una concepción mecanicista y determinista del mundo material.","Sustancias"],
  ["¿Por qué el alma tiene que ser independiente del cuerpo, según Descartes?",["Para salvar la libertad frente al mecanicismo","Para explicar cómo funciona la digestión del cuerpo","Para justificar el geocentrismo","Para negar la existencia de Dios"],0,"Si el alma fuera materia estaría sometida a las leyes mecánicas: solo separándola se salva la libertad.","Sustancias"],
  ["¿En qué se justifica la autonomía del alma respecto de la materia?",["En la experiencia sensible","En la claridad y distinción con que la percibe","En la tradición escolástica y en la autoridad de la Iglesia","En la autoridad de Platón"],1,"Poseo una idea clara y distinta de mí como cosa pensante e inextensa, y del cuerpo como cosa extensa que no piensa.","Sustancias"],
  ["Según la Meditación VI, el yo es…",["Idéntico a su cuerpo","Distinto de su cuerpo y capaz de existir sin él","Una parte más del cuerpo, alojada en el cerebro y los nervios","Una cualidad secundaria"],1,"«Es evidente que yo soy distinto de mi cuerpo y que puedo existir sin él».","Sustancias"],
  ["¿Por qué consigue Descartes su propósito «solo a medias»?",["Porque no encuentra ninguna verdad","Porque necesita a Dios como garantía externa","Porque renuncia a su propio método en las Meditaciones","Porque acaba negando el cogito"],1,"Justifica el mundo a partir del yo, pero necesita un intermediario, Dios, que lo garantice todo.","Sustancias"],
  ["En el orden del descubrimiento, Dios es la segunda verdad. ¿Qué lugar ocupa en el orden ontológico?",["El último","El primero","El segundo también","Ninguno"],1,"Aunque sea la segunda verdad epistemológica, pasa a ser la primera desde el punto de vista ontológico.","Sustancias"],
  ["En la reconstrucción cartesiana, el yo se conoce por intuición. ¿Cómo se conoce el mundo?",["Por intuición también","Por deducción","Por los sentidos","Por revelación"],1,"Del yo, lo más simple y conocido por intuición, se llega al mundo, lo más complejo y conocido por deducción.","Sustancias"]
 ],
 locke:[
  ["¿Cómo describe Locke el estado de naturaleza?",["Como una guerra de todos contra todos por la supervivencia","Como un estado de libertad e igualdad regido por la ley natural","Como una sociedad ya organizada bajo la autoridad de un monarca","Como un paraíso terrenal en el que no existen conflictos de ningún tipo"],1,"La libertad no es libertinaje: la ley natural, que es la razón, obliga a todos."],
  ["¿Qué prescribe la ley natural según Locke?",["Obedecer siempre al rey, que gobierna por voluntad divina","Que nadie dañe a otro en su vida, salud, libertad o posesiones","Que todo es de todos y nadie puede apropiarse de nada","Que el más fuerte manda y los demás deben someterse a él"],1,"Todos son iguales e independientes, criaturas del mismo Hacedor."],
  ["¿En qué se diferencia el estado de guerra del estado de naturaleza?",["No se diferencian: ambos son la misma situación de conflicto","Surge cuando alguien usa la fuerza sin derecho contra otro","El estado de guerra es la vida en sociedad bajo un gobierno","El estado de naturaleza es peor, porque en él no hay ninguna ley"],1,"Frente a Hobbes, Locke separa ambos estados: la naturaleza no es guerra."],
  ["¿Por qué nadie puede venderse como esclavo según el capítulo 4?",["Porque resulta demasiado caro y nadie podría pagar su precio","Porque nadie tiene poder absoluto sobre su vida y no puede cederlo","Porque lo prohíbe expresamente una ley aprobada por el Parlamento","Porque los esclavos trabajan peor que los hombres libres asalariados"],1,"La libertad frente al poder absoluto está unida a la conservación de la vida."],
  ["¿Cuál es el origen de la propiedad según el capítulo 5?",["La herencia que se recibe de los antepasados","El trabajo que cada uno mezcla con lo que da la naturaleza","La concesión del rey a sus súbditos más leales y a la nobleza","La conquista por la fuerza de tierras ajenas"],1,"El trabajo es mío; al añadirlo a una cosa natural, la saco del estado común y la hago mía."],
  ["¿Qué límites tiene la propiedad en el estado de naturaleza?",["Ninguno: cada uno puede tomar todo lo que sea capaz","Dejar bastante para los demás y no dejar que se eche a perder","Solo lo que permita el gobierno mediante leyes positivas","Nadie puede poseer tierra, solo los frutos que recolecta"],1,"Nadie puede apropiarse de más de lo que puede aprovechar."],
  ["¿Qué permite la introducción del dinero?",["Acabar con la propiedad privada y repartir todo por igual","Acumular más allá del límite del deterioro, por consentimiento","Suprimir la necesidad de trabajar para conseguir bienes","Igualar a todos los hombres en riqueza y posesiones"],1,"El oro y la plata no se estropean; su uso se basa en un acuerdo tácito."],
  ["¿Cuál es el fin principal de la sociedad política (cap. 9)?",["La gloria y el poder del Estado frente a otros Estados","La preservación de la propiedad: vida, libertad y bienes","La salvación de las almas de todos los ciudadanos","La conquista de nuevos territorios y riquezas"],1,"Los hombres se unen en sociedad para proteger lo que ya les pertenece por naturaleza."],
  ["¿Qué falta en el estado de naturaleza según el capítulo 9?",["Una ley natural que indique a todos lo que es justo","Una ley conocida, un juez imparcial y un poder que ejecute","La libertad para que cada uno actúe según su voluntad","La propiedad, que solo nace con la sociedad política"],1,"Por esos tres defectos el disfrute de la propiedad es inseguro."],
  ["¿A qué corrientes se asocia a Locke?",["Racionalismo y absolutismo","Empirismo y liberalismo político","Idealismo alemán y comunismo utópico","Vitalismo y anarquismo"],1,"En teoría del conocimiento es empirista; en política, padre del liberalismo."]
 ],
 kant:[
  ["Según la Fundamentación, ¿qué es lo único bueno sin restricción?",["La felicidad","La inteligencia","Una buena voluntad","El valor o la valentía"],2,"Los talentos y dones pueden ser malos si los usa una mala voluntad."],
  ["¿Cuándo tiene valor moral una acción?",["Cuando produce buenos resultados","Cuando se hace por deber","Cuando es conforme al deber, por cualquier motivo","Cuando nos hace felices"],1,"Solo la acción hecha por deber, por respeto a la ley, tiene auténtico valor moral."],
  ["¿Qué muestra el ejemplo del tendero que no engaña a sus clientes por interés?",["Que su acción tiene pleno valor moral","Que actúa conforme al deber, pero no por deber","Que el comercio es una actividad inmoral","Que el interés es el fundamento de la moral"],1,"Hace lo correcto por conveniencia: su acción es legal, pero no moral."],
  ["¿Cómo define Kant el deber?",["Como la necesidad de una acción por respeto a la ley","Como aquello que ordenan las leyes del Estado","Como lo que nos proporciona placer y felicidad","Como una costumbre social heredada de la tradición"],0,"El respeto es el sentimiento que produce la conciencia de la ley moral."],
  ["¿Dónde reside el valor moral de una acción hecha por deber?",["En el fin que se consigue","En la máxima por la que se decide","En la opinión de los demás","En la intensidad del esfuerzo realizado"],1,"No depende de la realidad del objeto, sino del principio del querer."],
  ["¿Cuál es la formulación de la ley que aparece en la sección 1?",["Haz a los demás lo que quieras que te hagan a ti","Obra de modo que tu máxima pueda ser ley universal","Busca la mayor felicidad para el mayor número","Sigue en todo momento los dictados de la naturaleza"],1,"Es el núcleo del imperativo categórico."],
  ["¿En qué se distingue un imperativo categórico de uno hipotético?",["El categórico manda sin condiciones; el hipotético, para un fin","No se distinguen: ambos son mandatos de la razón práctica","El hipotético es el moral y el categórico es solo técnico","El categórico depende de la felicidad que se quiera alcanzar"],0,"«Si quieres aprobar, estudia» es hipotético; «no mientas» es categórico."],
  ["La ética kantiana es…",["Material y heterónoma","Formal y autónoma","Eudemonista","Utilitarista"],1,"No dice qué bienes perseguir, sino la forma que debe tener la voluntad, que se da a sí misma la ley."],
  ["¿Por qué la razón no está destinada a la felicidad según Kant?",["Porque la felicidad no existe y es una simple ilusión","Porque el instinto la lograría mejor: la razón forma la buena voluntad","Porque la razón es mala por naturaleza y nos aleja del bien","Porque Dios lo prohíbe y reserva la felicidad para la otra vida"],1,"Si la naturaleza buscara nuestra felicidad, habría confiado en el instinto, no en la razón."],
  ["¿Qué ocurre si universalizamos la máxima de hacer una falsa promesa?",["Todos serían más felices, porque podrían salir de apuros","La promesa misma se destruiría, porque nadie creería ninguna","Aumentaría la confianza entre las personas al prometer más","Nada: la máxima puede universalizarse sin contradicción alguna"],1,"La máxima no puede ser ley universal sin contradecirse."]
 ],
 nietzsche:[
  ["¿Qué anuncia el hombre loco en La gaya ciencia, § 125?",["La llegada del superhombre","La muerte de Dios","El fin de la ciencia","La inmortalidad del alma"],1,"Busca a Dios con una linterna en pleno día en la plaza del mercado."],
  ["Según el hombre loco, ¿quién ha matado a Dios?",["Los filósofos","Nosotros, los hombres","La ciencia","Nadie, se ha muerto solo"],1,"«Nosotros lo hemos matado, vosotros y yo», aunque aún no somos conscientes del acontecimiento."],
  ["¿Qué consecuencias describe el § 343?",["Que nada cambia: la moral europea sigue intacta","El derrumbe de la moral europea, pero un mar abierto para los espíritus libres","El regreso triunfal del cristianismo tras una breve crisis de fe","El triunfo definitivo de la razón y de la ciencia moderna sobre la religión y el arte"],1,"Para el filósofo, la noticia es como una nueva aurora: el mar vuelve a estar abierto."],
  ["Según «La razón en la filosofía», ¿qué rasgo comparten los filósofos?",["Su amor al devenir y a lo que cambia","Su odio al devenir: momifican los conceptos","Su confianza plena en el testimonio de los sentidos","Su ateísmo y su rechazo de toda religión"],1,"Nietzsche lo llama «egipticismo»: convierten todo en momias conceptuales."],
  ["Para Nietzsche, ¿quién falsea el testimonio de los sentidos?",["Los sentidos mismos","La razón","El cuerpo","El arte"],1,"Los sentidos muestran el devenir; la razón introduce unidad, sustancia y permanencia."],
  ["¿En qué consiste el error de «confundir lo último con lo primero»?",["Leer los libros de filosofía empezando por el final","Poner los conceptos más vacíos (ser, bien) como causa de todo","Confundir el pasado con el futuro al hacer historia","Creer que la ciencia explica el origen de todas las cosas"],1,"Lo último y más tenue de la realidad se convierte en lo más alto y en causa de sí."],
  ["¿Qué dice Nietzsche sobre el mundo «verdadero» y el «aparente»?",["El verdadero es el de las Ideas; el aparente, una copia imperfecta de él","El aparente es el único; el «verdadero» es una añadidura mentirosa","Ambos son igual de reales y se complementan entre sí","Solo existe Dios; todo lo demás es mera apariencia"],1,"Dividir el mundo en verdadero y aparente es síntoma de vida decadente."],
  ["¿Qué papel atribuye al lenguaje en la creencia en Dios?",["Ninguno: el lenguaje es neutral ante la religión","No nos libraremos de Dios mientras creamos en la gramática","El lenguaje demuestra racionalmente la existencia de Dios","El lenguaje es un don divino que revela la verdad"],1,"La gramática nos hace creer en sujetos, sustancias y causas."],
  ["¿Qué sostiene el § 110 sobre el origen del conocimiento?",["Nace de la contemplación pura y desinteresada de la verdad","Se forma a partir de errores útiles para conservar la vida","Es innato: la razón trae las ideas desde el nacimiento","Procede de Dios, que garantiza la verdad de lo que sabemos"],1,"Creer en cosas duraderas, cuerpos o libre voluntad fue útil, aunque no verdadero."],
  ["¿A qué corriente se asocia a Nietzsche?",["Racionalismo","Vitalismo","Empirismo","Positivismo"],1,"La vida es el valor supremo; es también uno de los «maestros de la sospecha»."]
 ],
 arendt:[
  ["¿De qué experiencia surge la reflexión de «El pensar y las reflexiones morales»?",["La Revolución francesa y el Terror","El juicio a Eichmann en Jerusalén","La guerra de Vietnam y sus protestas","La caída del Muro de Berlín en 1989"],1,"Allí Arendt acuñó la expresión «banalidad del mal»."],
  ["¿Qué significa «banalidad del mal»?",["Que el mal no tiene importancia porque todos lo cometemos","Que grandes crímenes pueden nacer de personas corrientes que no piensan","Que todos los seres humanos somos malos por naturaleza desde que nacemos","Que el mal es aburrido y poco interesante para la filosofía"],1,"Eichmann le pareció alguien superficial que usaba frases hechas, sin pensamiento propio."],
  ["¿Qué pregunta plantea Arendt en ese ensayo?",["¿Existe Dios y podemos demostrarlo con la razón?","¿Puede la actividad de pensar evitar que hagamos el mal?","¿Es la democracia el mejor de los sistemas de gobierno?","¿Qué distingue la verdad científica de la mera opinión?"],1,"Sugiere que la ausencia de pensamiento favorece el mal."],
  ["¿Qué diferencia hay entre pensar y conocer según Arendt?",["Ninguna: pensar y conocer son la misma actividad","Conocer busca la verdad; pensar busca el sentido","Pensar busca la verdad; conocer busca el sentido","Conocer es tarea de científicos; pensar, de filósofos"],1,"Recoge la distinción kantiana entre razón (Vernunft) e intelecto (Verstand)."],
  ["¿Quién es el modelo de pensador para Arendt?",["Platón","Sócrates","Kant","Heidegger"],1,"Lo describe como tábano, comadrona y pez torpedo."],
  ["¿Cómo entiende Arendt el pensar?",["Como un cálculo de consecuencias","Como un diálogo silencioso conmigo mismo","Como una revelación que llega de fuera","Como obediencia a la autoridad legítima"],1,"Por eso es mejor sufrir una injusticia que cometerla: no quiero convivir con un asesino dentro de mí."],
  ["¿Qué facultad «realiza» el pensar en el mundo de las apariencias?",["La memoria","El juicio","La voluntad","La imaginación"],1,"Juzgar casos particulares («esto está mal») puede evitar catástrofes en momentos de crisis."],
  ["Según «La promesa de la política», ¿cuál es el sentido de la política?",["La seguridad","La libertad","La riqueza","El orden"],1,"La política existe para que los hombres puedan ser libres juntos."],
  ["¿Dónde surge la política según Arendt?",["En el interior de cada individuo","En el espacio entre los hombres, en la pluralidad","En la naturaleza humana del individuo aislado","En el mercado y en los intercambios económicos"],1,"No hay política en el hombre, sino entre los hombres."],
  ["¿Por qué existe hoy desconfianza hacia la política?",["Por la corrupción generalizada de los partidos políticos","Por el totalitarismo y la amenaza de las armas atómicas","Porque cada vez menos ciudadanos acuden a votar","Por la globalización y el poder de las grandes empresas"],1,"La política ha llegado a amenazar la propia existencia de la humanidad."]
 ],
 ortega:[
  ["¿Qué dos posiciones quiere superar Ortega en «Relativismo y racionalismo»?",["Idealismo y materialismo","Relativismo y racionalismo","Empirismo y escepticismo","Liberalismo y socialismo"],1,"Ambas fallan: una sacrifica la verdad y la otra la vida."],
  ["¿Qué sacrifica el racionalismo según Ortega?",["La verdad","La vida","La razón","La ciencia"],1,"Para salvar una verdad única e invariable, ignora la vida concreta y cambiante."],
  ["¿Qué sacrifica el relativismo según Ortega?",["La vida","La verdad","La historia","La perspectiva"],1,"Si toda verdad es relativa, no hay verdad: el relativismo acaba en escepticismo."],
  ["¿Qué afirma el perspectivismo?",["Que todo es subjetivo y, por tanto, nada es verdad","Que la realidad se da en perspectivas, todas verdaderas e insustituibles","Que solo hay una perspectiva correcta, la de la razón pura y universal","Que la verdad está fuera de la vida, en un mundo de Ideas eternas e inmutables"],1,"La verdad total se aproxima integrando perspectivas."],
  ["¿Qué ejemplo usa Ortega para explicar la doctrina del punto de vista?",["El trozo de cera que cambia al acercarlo al fuego","Un paisaje visto desde dos lugares distintos","La caverna y los prisioneros encadenados","Un tendero que no engaña a sus clientes"],1,"Ambas visiones son reales; sería absurdo declarar falsa una de ellas."],

  document.getElementById("sidenav").innerHTML = html + '<a href="#examen" class="'+(active==="examen"?"on":"")+'">'+ICONS.exam+'<span>El examen</span></a>';

let timerHandle = null;
function route(){
  if(timerHandle){clearInterval(timerHandle);timerHandle=null}
  const h = (location.hash||"#inicio").slice(1);
  const v = document.getElementById("view");
  let section = h;
  if(h.startsWith("autor-")){section="comentario";v.innerHTML=viewAuthor(h.slice(6))}
  else if(h.startsWith("test-")){section="test";v.innerHTML='';startQuiz(h.slice(5))}
  else if(h==="comentario"){v.innerHTML=viewComentario()}
  else if(h==="disertacion"){v.innerHTML=viewDisertacion();bindDisertacion()}
  else if(h.startsWith("entrena-")){section="disertacion";v.innerHTML=viewDzStage(+h.slice(8));bindDzStage(+h.slice(8))}
  else if(h==="test"){v.innerHTML=viewTest()}
  else if(h==="examen"){v.innerHTML=viewExamen()}
  else if(h==="profe"){section="inicio";v.innerHTML=viewProfe()}
  else if(h==="insignias"){section="inicio";v.innerHTML=viewInsignias()}
  else {section="inicio";v.innerHTML=viewInicio()}
  renderNav(section);
  if(h.startsWith("autor-")) bindAuthor(h.slice(6));
  window.scrollTo(0,0);
}

function makeCollapsible(root){
  root.querySelectorAll("section.th").forEach(sec=>{
    const head=sec.querySelector(".th-head"); if(!head) return;
    const bodyEl=document.createElement("div"); bodyEl.className="th-body"; bodyEl.hidden=true;
    [...sec.children].forEach(ch=>{ if(ch!==head && !ch.classList.contains("vinline")) bodyEl.appendChild(ch); });
    sec.appendChild(bodyEl);
    const set=open=>{bodyEl.hidden=!open;head.setAttribute("aria-expanded",open);sec.classList.toggle("open",open);head.querySelector(".th-tog-t").textContent=open?"Ocultar":"Ver teoría"};
    head.onclick=()=>set(bodyEl.hidden);
    sec._open=()=>set(true);
  });
}

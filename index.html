["¿Qué tradición posterior recibió una gran influencia de la antropología platónica?",["El cristianismo","El atomismo","La sofística","El empirismo"],0,"La idea de un alma inmortal superior al cuerpo influyó enormemente en la antropología cristiana.","Antropología"],
["En el mito del carro alado, ¿qué parte del alma representa el auriga?",["El alma racional","El alma irascible","El alma concupiscible","El cuerpo"],0,"El auriga guía y ordena el carro, como la razón debe guiar las otras partes del alma.","Antropología"],
["En el mito del carro alado, el caballo noble y obediente representa…",["El alma irascible","El alma racional","El alma concupiscible","La Idea de Bien"],0,"Es la fuente de pasiones nobles: valor, ira, esperanza, ambición.","Antropología"],
["En el mito del carro alado, el caballo rebelde representa…",["El alma concupiscible","El alma irascible","El alma racional","El Demiurgo"],0,"Representa los apetitos, deseos e instintos, que dificultan la conducción.","Antropología"],
["¿Dónde sitúa Platón el alma racional?",["En la cabeza","En el pecho","En el vientre","En las extremidades"],0,"Es de naturaleza divina e inmortal y se dedica al puro pensar.","Antropología"],
["¿Dónde sitúa Platón el alma irascible?",["En el pecho","En la cabeza","En el vientre","En la sangre"],0,"Es la sede de las pasiones nobles, como el valor.","Antropología"],
["¿Dónde sitúa Platón el alma concupiscible?",["En el vientre","En el pecho","En la cabeza","En el corazón"],0,"Se encarga de las funciones fisiológicas y los apetitos.","Antropología"],
["¿Qué virtud corresponde al alma racional?",["La prudencia o sabiduría","La fortaleza","La moderación","La obediencia"],0,"La razón debe obrar con prudencia y sabiduría.","Antropología"],
["¿Qué virtud corresponde al alma irascible?",["La fortaleza o valor","La prudencia","La moderación","La piedad"],0,"La tendencia irascible expresa el valor y la fortaleza.","Antropología"],
["¿Qué virtud corresponde al alma concupiscible?",["La moderación o templanza","La fortaleza","La prudencia","La justicia"],0,"Los apetitos deben moderarse y dejarse guiar por la razón.","Antropología"],
["Aunque el alma tenga tres partes, la teoría sigue siendo dualista porque distingue entre…",["Un alma inmortal (racional) y un alma mortal (irascible y concupiscible)","Un alma buena y un alma malvada","El alma del filósofo y la del tirano","Un alma masculina y otra femenina"],0,"Las partes irascible y concupiscible están ligadas al cuerpo y son mortales; solo la racional es inmortal.","Antropología"],
["¿Qué partes del alma son mortales según Platón?",["La irascible y la concupiscible","La racional y la irascible","Solo la racional","Las tres por igual"],0,"Son separables del cuerpo y perecen con él.","Antropología"],
["La división tripartita del alma anticipa la política platónica mediante el principio de…",["Correlación estructural entre el alma y el Estado","Separación de poderes","Soberanía popular","Libre mercado"],0,"Igual que el alma tiene tres partes, la sociedad tendrá tres clases.","Antropología"],
["¿De qué tradición toma Platón las teorías de la inmortalidad y la transmigración del alma?",["De la órfica y pitagórica","De la sofística","Del atomismo de Demócrito","De los físicos jonios"],0,"Son un claro legado órfico-pitagórico.","Antropología"],
["¿En qué consiste el argumento de la anamnesis para demostrar la inmortalidad del alma?",["El alma recuerda Ideas que conoció antes de nacer, luego preexistió y volverá a contemplarlas","El alma es simple y lo simple no se corrompe","El alma se mueve a sí misma y por eso siempre vive","El alma hereda los recuerdos de los antepasados"],0,"Si el alma pasó de una preexistencia a la vida terrena, lo natural es que vuelva después a la contemplación de las Ideas (Fedón, 72).","Antropología"],
["«Solo se corrompe lo que está compuesto de partes». ¿Qué argumento sobre el alma empieza así?",["El de la simplicidad","El de la anamnesis","El del automovimiento","El de la transmigración"],0,"El alma conoce las Ideas, que son simples; luego también es simple y no puede morir (República, 608).","Antropología"],
["¿Qué sostiene el argumento del automovimiento?",["El alma es principio de vida y de movimiento propio, por lo que siempre vivirá","El alma recuerda las Ideas","El alma es simple y no tiene partes","El alma se mueve gracias al cuerpo"],0,"Su movimiento no viene de fuera, sino de su propia naturaleza (Las Leyes, 895).","Antropología"],
["¿En qué obra aparece el argumento de la anamnesis citado en los apuntes (pasaje 72)?",["Fedón","Las Leyes","Banquete","Cratilo"],0,"La simplicidad aparece en la República (608) y el automovimiento en Las Leyes (895).","Antropología"],
["Tras la muerte, ¿cuánto tiempo peregrina el alma encarnándose en distintos cuerpos?",["Unos mil años","Unos cien años","Eternamente, sin final","Solo hasta el siguiente nacimiento"],0,"Durante ese tiempo se encarna sucesivamente eligiendo su destino.","Antropología"],
["Según el mito de la transmigración, ¿dónde reside el gran peligro para el ser humano?",["En la elección de un nuevo género de vida en cada encarnación","En olvidar el nombre de los dioses","En no tener descendencia","En morir joven"],0,"Cada alma elige su modelo de vida, y esa elección expresa su carácter.","Antropología"],
["¿En qué tipo de persona se encarna el alma que ha visto más verdad?",["En un filósofo o amante de la belleza","En un rey guerrero","En un comerciante","En un sacerdote"],0,"Es el primer puesto de la jerarquía de vidas.","Antropología"],
["¿Qué vida ocupa el último lugar en la jerarquía de reencarnaciones?",["La del tirano","La del sofista","La del artesano","La del poeta"],0,"El tirano es el grado más bajo; justo antes está el sofista o demagogo.","Antropología"],
["¿Qué dos ideas centrales transmite el mito de la transmigración?",["La libertad y la responsabilidad","El azar y el destino","La igualdad y la fraternidad","El placer y el dolor"],0,"Los modelos de vida elegidos expresan la esencia y el carácter de cada uno.","Antropología"],
["¿Qué crítica se puede hacer a la escala de vidas de la transmigración?",["Refleja un clasismo antropológico, con preferencia por la aristocracia y desprecio por los trabajadores","Es demasiado igualitaria","Ignora la existencia del alma","Coloca al tirano por encima del filósofo"],0,"Muestra la nostalgia aristocrática y política de Platón.","Antropología"],
["¿Qué consecuencia tiene el dualismo antropológico de Platón?",["Consolida el abismo entre el mundo del espíritu y el de la materia","Une definitivamente cuerpo y alma","Niega la existencia del alma","Hace del cuerpo el elemento superior"],0,"Rompe la concepción unitaria del ser humano.","Antropología"],

// ===== ONTOLOGÍA =====
["¿Cuál es la teoría más importante de la ontología platónica?",["La teoría de las Ideas o de las Formas","La teoría de los átomos","La teoría del contrato social","La teoría de la sustancia"],0,"Impregna todo su pensamiento filosófico.","Ontología"],
["¿En qué obras aparece la primera formulación de la teoría de las Ideas, según los apuntes?",["Fedón y República","Leyes y Timeo","Banquete y Cratilo","Apología y Critón"],0,"Allí se pregunta por lo Justo, lo Bello y lo Bueno en sí.","Ontología"],
["Para Platón, las Ideas son…",["Realidades que existen con independencia de las cosas y de que sean pensadas","Representaciones mentales de cada persona","Palabras convencionales acordadas por los hombres","Abstracciones que hacemos a partir de los sentidos"],0,"No son simples conceptos: tienen realidad propia, existen en y por sí.","Ontología"],
["Según Platón, ¿qué es más real?",["Las Ideas","Las cosas sensibles","Las sombras","Las opiniones"],0,"Las Ideas son la realidad misma; las cosas son menos reales.","Ontología"],
["¿Qué características tiene cada Idea?",["Es única, eterna, inmutable y solo captable por la inteligencia","Es múltiple, cambiante y sensible","Es eterna pero captable por los sentidos","Es única pero cambia con el tiempo"],0,"Son los atributos del Ser de Parménides.","Ontología"],
["¿De qué filósofo toma Platón los atributos que asigna a las Ideas?",["Parménides","Heráclito","Demócrito","Protágoras"],0,"Las Ideas son, como el Ser parmenídeo, eternas, únicas e inmutables.","Ontología"],
["Las cosas sensibles están sometidas a un flujo de cambios permanente. ¿De qué filósofo procede esta idea del devenir?",["Heráclito","Parménides","Sócrates","Anaxágoras"],0,"Platón acepta el devenir de Heráclito para el mundo sensible.","Ontología"],
["¿Por qué una cosa es bella según Platón?",["Porque participa de la Idea de Belleza","Porque así lo decide la mayoría","Porque produce placer a quien la ve","Porque es útil"],0,"Las Ideas son la causa de las cosas.","Ontología"],
["Además de ser causa de las cosas, las Ideas son el fundamento de…",["Los juicios que formulamos sobre ellas","Las costumbres de cada pueblo","Las leyes de la física atomista","Los deseos del alma concupiscible"],0,"Podemos decir que algo es bello gracias a la Idea de Belleza.","Ontología"],
["¿Qué es el dualismo ontológico?",["La duplicación de la realidad en mundo inteligible y mundo sensible","La división del alma en dos partes","La oposición entre Atenas y Esparta","La distinción entre opinión y ciencia"],0,"El mundo inteligible es plenamente real; el sensible, mudable y aparente.","Ontología"],
["¿Cómo es el mundo sensible para Platón?",["Mudable, cambiante y aparente","Eterno e inmutable","Plenamente real","Captable solo por la inteligencia"],0,"Las cosas son múltiples y están en continuo cambio.","Ontología"],
["¿Mediante qué dos relaciones describe Platón el vínculo entre las cosas y las Ideas?",["Participación e imitación","Causa y efecto mecánico","Materia y forma","Acto y potencia"],0,"Las cosas participan de las Ideas y las imitan.","Ontología"],
["¿Qué papel tiene el mundo de las Ideas respecto al mundo sensible?",["Es su modelo o paradigma","Es su copia imperfecta","Es su consecuencia","No tiene relación con él"],0,"El mundo sensible es solo una representación continua y cambiante del inteligible.","Ontología"],
["¿Qué hace posible la existencia de la ciencia según Platón?",["El mundo de las Ideas","La experiencia sensible","Las opiniones de los sabios","La observación de los astros"],0,"La ciencia necesita un objeto estable, y solo las Ideas lo son.","Ontología"],
["¿Qué quiere ilustrar Platón con el ejemplo de la botánica, que no estudia este pino o aquel ciprés?",["Que la ciencia y la filosofía estudian lo universal, las Ideas, y no los casos particulares","Que los árboles no existen","Que la botánica es la ciencia suprema","Que solo conocemos cosas concretas"],0,"Igual que se asciende de pino a conífera, árbol y ser vivo, la filosofía se ocupa de los fundamentos.","Ontología"],
["¿Qué significa la expresión «ontos on»?",["El ser verdadero de algo, su Idea","La opinión sobre una cosa","La sombra de un objeto","El cuerpo de una persona"],0,"La Idea es lo que da consistencia a la cosa: su ser.","Ontología"],
["¿Cuál es la tarea del filósofo según la ontología platónica?",["Sacar a los hombres del mundo de las apariencias y conducirlos al verdadero ser","Describir con detalle el mundo sensible","Enseñar retórica para ganar debates","Acumular riquezas para la polis"],0,"Debe llevarlos al Mundo de las Ideas, el Mundo que Es.","Ontología"],
["Las Ideas tienen entidad ontológica y también epistemológica. ¿Qué supone esto?",["La fusión del ser con el pensar","La separación absoluta entre ser y conocer","Que las Ideas solo existen en la mente","Que no podemos conocer las Ideas"],0,"Son realidad y a la vez pueden ser captadas por el entendimiento.","Ontología"],
["¿Qué estructura tiene el mundo de las Ideas?",["Jerárquica","Igualitaria, todas valen lo mismo","Circular","Caótica"],0,"Hay Ideas subordinadas a otras superiores hasta llegar a la cúspide.","Ontología"],
["¿Qué Idea se sitúa en la cúspide de la jerarquía?",["La Idea de Bien","La Idea de Belleza","La Idea de Justicia","La Idea de Igualdad"],0,"Es la «Idea de las Ideas», de la que dependen todas las demás.","Ontología"],
["La Idea de Bien es, según Platón, causa última de…",["La verdad y el ser de todas las cosas","El movimiento de los átomos","Las pasiones del alma","Las guerras entre ciudades"],0,"No solo es la superior: todo depende de ella.","Ontología"],
["¿Con qué compara Platón la Idea de Bien?",["Con el Sol","Con la Luna","Con un río","Con el fuego"],0,"Así como el Sol nos hace ver los objetos sensibles, el Bien nos hace comprender las Ideas.","Ontología"],
["¿Cuáles son las «supremas realidades» que están por encima de las demás Ideas?",["Bien, Belleza y Justicia","Igualdad, Unidad y Número","Valor, Templanza y Prudencia","Ser, Movimiento y Reposo"],0,"Son absolutamente consistentes, inabarcables e indefinibles.","Ontología"],
["¿Qué Idea baña en luz y claridad el mundo físico y lo vuelve bello?",["La Idea de Belleza","La Idea de Bien","La Idea de Justicia","La Idea de Igualdad"],0,"Envuelve las realidades físicas haciéndolas bellas.","Ontología"],
["¿Qué Idea regula las relaciones entre las partes del alma, las clases sociales y las virtudes?",["La Idea de Justicia","La Idea de Belleza","La Idea de Bien","La Idea de Valor"],0,"Ordena alma individual, cuerpo social y virtudes.","Ontología"],
["Según Platón, ¿en qué reside la sabiduría?",["En la posesión de las Ideas de Belleza, Justicia y Bien","En conocer muchas opiniones","En la experiencia de los sentidos","En el dominio de la retórica"],0,"Son las tres realidades supremas.","Ontología"],
["¿Por qué las cosas sensibles no son propiamente inteligibles?",["Porque cambian continuamente","Porque son eternas","Porque son demasiado simples","Porque no participan de ninguna Idea"],0,"Lo que está siempre cambiando no puede ser objeto de ciencia.","Ontología"],

// ===== EPISTEMOLOGÍA =====
["¿Qué grave problema plantea la teoría de las Ideas desde el punto de vista del conocimiento?",["Cómo podemos conocer las Ideas si pertenecen a otro mundo distinto del nuestro","Cómo conocer las cosas sensibles","Cómo distinguir a los sofistas de los filósofos","Cómo medir el tiempo"],0,"Platón lo resuelve con la reminiscencia y la dialéctica.","Epistemología"],
["¿Con qué dos doctrinas resuelve Platón el problema del conocimiento de las Ideas?",["La reminiscencia y la dialéctica","La duda y el cogito","La inducción y la experiencia","La revelación y la fe"],0,"La dialéctica complementa a la reminiscencia.","Epistemología"],
["Gracias a las Ideas, palabras como «justicia» no tienen un significado meramente convencional y relativo, como sostenían…",["Los sofistas","Los pitagóricos","Los eleáticos","Los órficos"],0,"Remiten a la Justicia en sí.","Epistemología"],
["Para los griegos, y para Platón, se cumple la ecuación…",["Ciencia = Conocimiento = Bien","Ciencia = Opinión = Placer","Conocimiento = Poder = Riqueza","Bien = Placer = Utilidad"],0,"El auténtico conocimiento, el de las Ideas, conduce al Bien.","Epistemología"],
["¿Dónde termina el camino epistemológico según Platón?",["En el Bien","En la opinión","En la imaginación","En el mundo sensible"],0,"El Bien es la Idea suprema por excelencia.","Epistemología"],
["¿Qué tipo de conocimiento proporcionan los sentidos?",["Opinión (doxa)","Ciencia (episteme)","Inteligencia (nóesis)","Sabiduría plena"],0,"Es opinión sobre algo que está en continuo devenir.","Epistemología"],
["¿Por qué la percepción de las cosas sensibles no puede darnos a conocer las Ideas?",["Porque la Idea es una realidad separada, no contenida en las cosas","Porque las cosas no existen","Porque los sentidos son infalibles","Porque las Ideas son materiales"],0,"Las Ideas solo pueden conocerse por contemplación directa del mundo inteligible.","Epistemología"],
["¿Por qué olvida el alma las Ideas que contempló?",["Porque al entrar en el mundo sensible se une a un cuerpo","Porque las Ideas desaparecen","Porque el Demiurgo le borra la memoria","Porque nunca llegó a contemplarlas"],0,"La unión con el cuerpo provoca el olvido.","Epistemología"],
["¿Qué papel tiene el conocimiento sensible en la teoría de la reminiscencia?",["Sirve de ocasión para el recuerdo de las Ideas","Es la fuente de todo conocimiento verdadero","No tiene ningún valor","Es el conocimiento supremo"],0,"Como las cosas imitan a las Ideas, al verlas el alma puede recordarlas.","Epistemología"],
["Según la doctrina de la reminiscencia, conocer es…",["Recordar","Percibir","Opinar","Imaginar"],0,"El conocimiento de las Ideas es recuerdo (anamnesis) de lo que ya está en el alma.","Epistemología"],
["¿En qué obra expone Platón el símil de la línea?",["República","Fedón","Banquete","Las Leyes"],0,"Allí explica gráficamente los grados del conocimiento.","Epistemología"],
["¿Con qué criterio clasifica Platón los grados del conocimiento?",["En función de los grados del ser","Según la edad de quien conoce","Según la utilidad práctica","Según la opinión de la mayoría"],0,"Si hay dos ámbitos de lo real, hay dos tipos de conocimiento.","Epistemología"],
["¿Qué tipo de conocimiento corresponde al mundo inteligible?",["Episteme (ciencia)","Doxa (opinión)","Eikasía","Pístis"],0,"La episteme se divide en diánoia y nóesis.","Epistemología"],
["¿Qué tipo de conocimiento corresponde al mundo sensible?",["Doxa (opinión)","Episteme (ciencia)","Nóesis","Diánoia"],0,"La doxa se divide en eikasía y pístis.","Epistemología"],
["En el símil de la línea, ¿qué conoce la imaginación (eikasía)?",["Imágenes, sombras y apariencias","Objetos físicos","Entes matemáticos","Ideas"],0,"Es el conocimiento más bajo y confuso.","Epistemología"],
["En el símil de la línea, ¿qué conoce la creencia (pístis)?",["Las cosas sensibles, los objetos físicos","Las sombras","Los entes matemáticos","La Idea de Bien"],0,"Es opinión, pero más firme que la imaginación.","Epistemología"],
["En el símil de la línea, ¿qué conoce el pensamiento discursivo (diánoia)?",["Los entes matemáticos","Las sombras","Los objetos físicos","La Idea de Bien de forma directa"],0,"Es la razón que razona y deduce.","Epistemología"],
["En el símil de la línea, ¿qué conoce la inteligencia (nóesis)?",["Las Ideas, en especial la Idea de Bien","Los objetos físicos","Las imágenes y reflejos","Los números concretos"],0,"Es el grado supremo del conocimiento.","Epistemología"],
["¿Cuál es el grado de conocimiento más bajo y confuso?",["La imaginación (eikasía)","La creencia (pístis)","La razón discursiva (diánoia)","La inteligencia (nóesis)"],0,"Solo capta imágenes y sombras.","Epistemología"],
["¿Qué grado de conocimiento es intuitivo, directo y absoluto?",["La inteligencia (nóesis)","La razón discursiva (diánoia)","La creencia (pístis)","La imaginación (eikasía)"],0,"Capta las Ideas directamente.","Epistemología"],
["¿Qué grado de conocimiento «razona y deduce» a partir de principios?",["La razón discursiva (diánoia)","La inteligencia (nóesis)","La creencia (pístis)","La imaginación (eikasía)"],0,"Es propio de las matemáticas.","Epistemología"],
["Ordena los grados del conocimiento de menor a mayor:",["Imaginación, creencia, razón discursiva, inteligencia","Creencia, imaginación, inteligencia, razón discursiva","Inteligencia, razón discursiva, creencia, imaginación","Razón discursiva, imaginación, creencia, inteligencia"],0,"Se asciende de eikasía y pístis (doxa) a diánoia y nóesis (episteme).","Epistemología"],
["¿Cuál es el método del proceso ascendente del conocimiento?",["La dialéctica","La retórica","La experimentación","La duda metódica"],0,"Permite pasar de Idea en Idea hasta la Idea suprema.","Epistemología"],
["En el Banquete, ¿quién inicia a Sócrates en la naturaleza del amor y la belleza?",["Diótima","Alcibíades","Aristófanes","Jantipa"],0,"La sacerdotisa Diótima le enseña el camino hacia lo Bello en sí.","Epistemología"],
["Según la enseñanza de Diótima, ¿por dónde se empieza la ascensión hacia la Belleza?",["Por los cuerpos bellos","Por la Idea de Bien","Por las leyes de la ciudad","Por las matemáticas"],0,"Después se asciende a lo bello en las normas morales y la ciencia.","Epistemología"],
["¿En qué culmina la ascensión descrita por Diótima?",["En lo Bello en sí, la Idea de Belleza","En los cuerpos bellos","En las obras de arte","En el placer"],0,"Es un ejemplo de dialéctica ascendente.","Epistemología"],
["¿Cuál es el punto de partida de la dialéctica ascendente?",["Las cosas sensibles","La Idea de Bien","Los entes matemáticos","Las leyes"],0,"Va de lo particular a lo universal.","Epistemología"],
["¿Cuál es el punto de partida de la dialéctica descendente?",["La Idea de Bien","Las cosas sensibles","Las sombras","Las opiniones"],0,"Desciende hasta las demás Ideas y finalmente las cosas sensibles.","Epistemología"],
["¿Qué permite comprender la dialéctica descendente?",["Cómo todas las Ideas dependen del Bien y se organizan jerárquicamente","Cómo funcionan los sentidos","Cómo se forman las sombras","Cómo se elige a los gobernantes"],0,"Explica la estructura del mundo inteligible y su relación con el sensible.","Epistemología"],
["La dialéctica ascendente va…",["De lo particular a lo universal","De lo universal a lo particular","De las Ideas a las sombras","Del Bien a las cosas"],0,"La descendente hace el recorrido inverso.","Epistemología"],

["¿Qué obra de Platón está dedicada a diseñar un sistema político ideal?",["La República","El Banquete","El Fedón","El Cratilo"],0,"Es su obra más importante y conocida.","Ética y política"],

["¿Qué afirma el principio de correlación estructural?",["Que el Estado tiene la misma estructura tripartita que el alma","Que cada uno debe hacer la tarea para la que está capacitado","Que todos deben gobernar por turnos","Que el alma y el cuerpo son iguales"],0,"Hay tres clases sociales, como hay tres partes del alma.","Ética y política"],

["¿Qué forma de gobierno ideal propone Platón en la República?",["El gobierno de los sabios o filósofos","La democracia","La tiranía ilustrada","La oligarquía de los ricos"],0,"Platón era claramente antidemócrata.","Ética y política"],

["¿Qué se estudia en la primera fase del segundo nivel educativo?",["Las matemáticas: aritmética, geometría, estereometría, astronomía y armonía","La gimnasia y la música","La retórica y la oratoria","La agricultura y el comercio"],0,"Preparan para la disciplina suprema.","Ética y política"],
["¿Cuál es la disciplina suprema de la educación de los gobernantes?",["La dialéctica","La gimnasia","La retórica","La astronomía"],0,"Es el ejercicio adecuado de la razón para descubrir la Idea de Bien.","Ética y política"],

aristoteles:[
 ["¿Cuál es el bien supremo para el ser humano según la Ética a Nicómaco?",["El placer","El honor","La felicidad (eudaimonía)","La riqueza"],2,"La felicidad es el fin último: se busca por sí misma y nunca por otra cosa."],
 ["Según Ética a Nicómaco I, ¿qué ciencia estudia el bien supremo del hombre?",["La física","La política","La lógica","La metafísica"],1,"La política es la ciencia más directiva o arquitectónica, porque ordena todas las demás hacia el bien de la ciudad."],
 ["¿Cuál es la función propia (ergon) del ser humano?",["Alimentarse y crecer","Sentir","La actividad del alma conforme a la razón","Obedecer las leyes"],2,"Lo propio del ser humano no es la vida nutritiva ni la sensitiva, que comparte, sino la racional."],
 ["La virtud ética es un hábito de elegir…",["El placer mayor","El término medio relativo a nosotros, determinado por la prudencia","Lo que manda la ley universal","Lo que conviene a la mayoría"],1,"Por ejemplo, la valentía es el término medio entre la temeridad y la cobardía."],
 ["«El hombre es por naturaleza un animal…»",["racional y solitario","político","egoísta","contractual"],1,"Zoon politikón: solo en la polis puede desarrollarse plenamente; posee lenguaje para expresar lo justo y lo injusto."],
 ["¿En qué orden surgen las comunidades en Política I?",["Polis, aldea, casa","Casa, aldea, polis","Aldea, casa, polis","Tribu, nación, Estado"],1,"La casa satisface las necesidades diarias, la aldea las no diarias y la polis la vida buena y autosuficiente."],
 ["¿Por qué la polis es anterior por naturaleza al individuo?",["Porque existió antes en el tiempo","Porque el todo es anterior a la parte y el individuo aislado no es autosuficiente","Porque lo decidió un pacto","Porque la fundaron los dioses"],1,"Como una mano separada del cuerpo deja de ser mano, el individuo solo es plenamente humano en la polis."],
 ["¿Cuáles son las formas rectas de gobierno en Política III?",["Tiranía, oligarquía y democracia","Monarquía, aristocracia y politeia","Monarquía, democracia y tiranía","Aristocracia, oligarquía y anarquía"],1,"Son rectas porque gobiernan para el bien común."],

 ["Según Ética a Nicómaco I, 8, la felicidad…",["No necesita nada externo","Necesita también ciertos bienes externos, como amigos, recursos o buena fortuna","Consiste solo en bienes externos","Se alcanza tras la muerte"],1,"Es difícil actuar bien sin medios; por eso la buena fortuna también influye en la felicidad."]

descartes:[
// ===== RACIONALISMO Y FILOSOFÍA MODERNA =====
["¿Con qué obra y en qué año se suele situar el inicio de la filosofía moderna?",["Con las Meditaciones metafísicas, en 1641","Con el Discurso del método, en 1637","Con los Principios de la Filosofía, en 1644","Con las Reglas para la dirección del espíritu, en 1628"],1,"La filosofía moderna se inicia con Descartes en 1637, año de publicación del Discurso del método.","Racionalismo"],
["¿Dónde estudió Descartes y según qué principios fue educado?",["En la Universidad de París, según el humanismo","En el colegio jesuita de La Flèche, según la Escolástica","En Holanda, según el método experimental","En Estocolmo, según la filosofía griega"],1,"Estudió de 1604 a 1612 en el colegio jesuita de La Flèche, educado según los principios de la Escolástica.","Racionalismo"],
["¿Por qué vivió Descartes en Holanda entre 1628 y 1649?",["Porque allí estaba la corte de la reina Cristina","Porque era el país más tolerante de la época, refugio frente a la Inquisición","Porque allí estaba el colegio de La Flèche","Porque fue desterrado de Francia por hereje"],1,"Holanda era el país más tolerante de la época y servía de refugio a científicos y filósofos.","Racionalismo"],
["¿Qué caracteriza, ante todo, a la filosofía moderna según los apuntes?",["La subordinación de la razón a la fe","La autonomía absoluta de la razón","El rechazo de la ciencia","La vuelta a la autoridad de Aristóteles"],1,"La filosofía moderna se caracteriza por la autonomía absoluta de la razón y por su conexión con la ciencia moderna.","Racionalismo"],
["En sentido negativo, la autonomía de la razón significa que…",["La razón no puede conocer nada con certeza","Su ejercicio no está coartado por ninguna instancia exterior: tradición, autoridad o fe","La razón debe someterse a la experiencia","La razón depende de Dios para funcionar"],1,"Negativamente, nada ajeno a la razón (tradición, autoridad, fe religiosa) puede regularla.","Racionalismo"],
["En sentido positivo, la autonomía de la razón implica que la razón es…",["Un instrumento al servicio de la teología","El tribunal supremo que juzga lo verdadero y lo justo","Una facultad inferior a los sentidos","Una herencia de la tradición"],1,"Positivamente, la razón es el tribunal supremo, tanto en lo teórico como en lo moral y lo político.","Racionalismo"],
["¿Qué aportación hizo Descartes a las matemáticas?",["El cálculo infinitesimal","La geometría analítica","La teoría de probabilidades","Los números negativos"],1,"Descartes legó a las matemáticas la geometría analítica, además de trabajos de física y biología.","Racionalismo"],
["La autonomía de la razón y la conexión con la ciencia moderna son rasgos…",["Exclusivos del racionalismo","De toda la filosofía moderna","Exclusivos del empirismo","De la filosofía medieval"],1,"Ambos rasgos no son exclusivos del racionalismo, sino de toda la filosofía moderna.","Racionalismo"],
["¿Cuál de estos filósofos NO pertenece al racionalismo?",["Leibniz","Spinoza","Malebranche","Locke"],3,"Locke es empirista. Leibniz, Spinoza y Malebranche son racionalistas, como Descartes.","Racionalismo"],
["¿En qué siglo se sitúa el racionalismo y a qué corriente se opone?",["Siglo XVII; se opone al empirismo inglés del siglo XVIII","Siglo XVIII; se opone a la Escolástica","Siglo XVI; se opone al humanismo","Siglo XIX; se opone al idealismo"],0,"El racionalismo es la corriente del siglo XVII que se opone al empirismo inglés del siglo XVIII.","Racionalismo"],
["¿Cuál es la mejor forma de entender la oposición entre racionalismo y empirismo?",["Comparar sus teorías políticas","Comparar lo que dicen sobre el origen del conocimiento","Comparar su relación con la religión","Comparar sus éticas"],1,"La diferencia clave está en el origen del conocimiento: la razón o la experiencia sensible.","Racionalismo"],
["Según el empirismo, nuestros conocimientos proceden…",["De ideas innatas","En último término, de los sentidos y la experiencia","De la revelación divina","De la intuición intelectual"],1,"Para el empirismo, todo conocimiento procede en último término de la experiencia sensible.","Racionalismo"],
["Según el racionalismo, nuestros conocimientos válidos acerca de la realidad proceden…",["De los sentidos","De la razón misma","De la tradición","De la autoridad de la Iglesia"],1,"El racionalismo sostiene que el conocimiento válido procede de la razón misma.","Racionalismo"],
["¿Qué papel da el racionalismo al conocimiento sensible?",["Es la única fuente fiable","Lo infravalora, porque los sentidos son engañosos","Lo considera la base de la deducción","Lo identifica con la intuición"],1,"Una de las características del racionalismo es la crítica del conocimiento sensible, que se considera engañoso.","Racionalismo"],
["¿Qué son las ideas innatas para el racionalismo?",["Ideas que proceden de la experiencia externa","Verdades que se hallan potencialmente en el entendimiento","Ideas construidas por la imaginación","Opiniones heredadas de la tradición"],1,"Las ideas innatas son verdades que se hallan potencialmente en el entendimiento.","Racionalismo"],
["¿Qué significa la «racionalidad del mundo» como rasgo del racionalismo?",["Que el mundo es una ilusión","Que todo lo que sucede tiene una justificación que la razón puede conocer","Que solo existe la razón","Que el mundo es caótico e incomprensible"],1,"Todo lo que compone la realidad tiene una justificación que la razón puede llegar a conocer: todo lo real es racional.","Racionalismo"],
["La confianza absoluta del racionalismo en la razón supone que…",["No hay límites al conocimiento humano","Solo podemos conocer lo que vemos","La razón necesita la fe","El conocimiento es siempre probable"],0,"El racionalismo confía en la capacidad cognoscitiva de la razón: no hay límites al conocimiento humano.","Racionalismo"],
["¿Cómo se construye el conocimiento según el racionalismo?",["Inductivamente, a partir de muchas observaciones","Deductivamente, a partir de unos primeros principios: las ideas innatas","Por acumulación de opiniones","Por revelación"],1,"El conocimiento puede construirse deductivamente a partir de primeros principios, las ideas innatas.","Racionalismo"],
["¿Qué aspira a construir el racionalismo?",["Una ciencia universal y necesaria basada en la unidad de la razón y el método matemático","Una ciencia probable basada en la experiencia","Un saber religioso","Una colección de saberes independientes"],0,"El racionalismo aspira a una ciencia universal y necesaria, con el método matemático como modelo.","Racionalismo"],
["Para el racionalismo, el método más adecuado del pensamiento es…",["La inducción","La deducción","La observación","La experimentación"],1,"La deducción se considera el método más adecuado del pensamiento.","Racionalismo"],

// ===== EL MÉTODO =====
["¿Qué lugar ocupa el método en la filosofía de Descartes?",["Es un asunto secundario","Es a la vez el punto de partida y la meta de su filosofía","Solo le interesa para las matemáticas","Lo toma de Aristóteles"],1,"Descartes dedicó gran parte de sus esfuerzos al método, punto de partida y meta de su filosofía.","Método"],
["¿Qué situación provoca la búsqueda de un nuevo método en la Edad Moderna?",["El triunfo de la Escolástica","El derrumbamiento del sistema de ideas y creencias que había imperado durante siglos","La aparición del empirismo","La invención de la imprenta"],1,"La búsqueda nace del derrumbamiento de la Escolástica, aceptada durante siglos sin análisis crítico.","Método"],
["¿Sobre qué dos autoridades principales se fundaba la Escolástica?",["Platón y Agustín de Hipona","Aristóteles y Tomás de Aquino","Copérnico y Galileo","Lutero y Erasmo"],1,"La Escolástica se fundaba en la autoridad de Aristóteles y Tomás de Aquino.","Método"],
["¿Qué necesitaba la filosofía tras la crisis de la Escolástica?",["Descubrimientos ocasionales","Un nuevo criterio de verdad que sustituyera a la autoridad","Volver a la Biblia","Abandonar la razón"],1,"No bastaban descubrimientos ocasionales: hacía falta un nuevo criterio de verdad que sustituyera a la autoridad de la Escolástica, de Aristóteles y de la Biblia.","Método"],
["¿Qué expresión de Kant recogen los apuntes para describir el nuevo papel de la razón?",["La revolución copernicana","La mayoría de edad de la razón","La cosa en sí","El imperativo categórico"],1,"La razón alcanza su «mayoría de edad», como dirá Kant en ¿Qué es Ilustración?","Método"],
["¿Cuáles son los dos métodos predominantes en la filosofía moderna?",["Inductivo y dialéctico","Experimental y matemático","Escolástico y humanista","Socrático y platónico"],1,"Los métodos experimental y matemático configuran el empirismo y el racionalismo.","Método"],
["¿Qué método elige Descartes?",["El experimental","El matemático","El dialéctico","El histórico"],1,"Descartes opta por el método matemático, inaugurando así el racionalismo.","Método"],
["¿Qué coincidencia temática hay entre empiristas y racionalistas?",["Ninguna","Todos ponen el método en el centro de su investigación","Todos aceptan las ideas innatas","Todos rechazan la ciencia"],1,"Aunque lo entiendan de forma distinta, todos ponen el tema del método en el centro.","Método"],
["Según Descartes, las diversas ciencias son…",["Saberes completamente independientes","Manifestaciones de una única sabiduría humana","Opiniones sin fundamento","Partes de la teología"],1,"Las ciencias no son otra cosa que la sabiduría humana, que permanece una e idéntica aunque se aplique a objetos diversos.","Método"],
["¿Con qué imagen ilustra Descartes la unidad de la sabiduría en las Reglas?",["Con la luz del sol, que no cambia aunque ilumine objetos diversos","Con una escalera","Con una ciudad construida por un solo arquitecto","Con un río"],0,"La sabiduría no recibe de los objetos más distinción que la luz del sol de los objetos que ilumina.","Método"],
["¿De dónde procede, en último término, la concepción unitaria del saber?",["De una concepción unitaria de la razón","De la unidad de la Iglesia","De la experiencia","De la tradición aristotélica"],0,"La sabiduría es única porque la razón es única.","Método"],
["En el árbol de la filosofía de Descartes, las raíces son…",["La física","La metafísica","La moral","La medicina"],1,"«Toda la filosofía es como un árbol, cuyas raíces son la metafísica, el tronco es la física…»","Método"],
["En el árbol de la filosofía, ¿qué representa el tronco?",["La metafísica","La física","La mecánica","La lógica"],1,"El tronco es la física, de la que salen las ramas de las demás ciencias.","Método"],
["¿A qué tres ciencias principales se reducen las ramas del árbol del saber?",["Lógica, ética y política","Medicina, mecánica y moral","Astronomía, geometría y música","Física, química y biología"],1,"Las ramas se reducen a tres principales: la medicina, la mecánica y la moral.","Método"],
["¿En qué obra aparece la imagen del árbol de la filosofía?",["Discurso del método","Principios de la Filosofía","Meditaciones metafísicas","Reglas para la dirección del espíritu"],1,"La cita del árbol procede de los Principios de la Filosofía.","Método"],
["¿Cuáles son los dos modos de conocimiento según Descartes?",["Sensación y memoria","Intuición y deducción","Opinión y ciencia","Inducción y abstracción"],1,"Según Descartes hay dos modos de conocimiento: la intuición y la deducción.","Método"],
["¿Cómo describe Descartes la intuición?",["Como una opinión probable","Como una especie de «luz o instinto natural»","Como una sensación corporal","Como un razonamiento largo"],1,"La intuición es una especie de luz o instinto natural de la razón.","Método"],
["¿Cuál es el objeto de la intuición?",["Las cualidades secundarias","Las naturalezas simples","Las opiniones de la tradición","Las cosas sensibles"],1,"La intuición capta las naturalezas simples de manera inmediata y sin posibilidad de error.","Método"],
["Según las Reglas III, la intuición es más cierta que…",["La fe","La deducción misma","Las matemáticas","Los sentidos solo a veces"],1,"Es un concepto de la mente pura y atenta que nace de la sola luz de la razón y es más cierto que la deducción misma.","Método"],
["¿Qué es la deducción para Descartes?",["Un conocimiento de las cosas sensibles","Una sucesión de intuiciones de naturalezas simples y de sus conexiones","Una generalización a partir de casos","Una creencia sin fundamento"],1,"Por larga que sea, la deducción es en último término una sucesión de intuiciones y de sus conexiones.","Método"],
["¿Qué dos pasos exige el dinamismo de la intuición y la deducción?",["Observación y experimentación","Análisis y síntesis","Duda y fe","Tesis y antítesis"],1,"Primero un análisis hasta las naturalezas simples; después una síntesis o reconstrucción deductiva de lo complejo.","Método"],
["¿En qué consiste el proceso de síntesis?",["En descomponer lo complejo en partes","En reconstruir deductivamente lo complejo a partir de lo simple","En revisar que no falte nada","En dudar de todo"],1,"La síntesis es la reconstrucción deductiva de lo complejo a partir de lo simple.","Método"],
["Según la definición de las Reglas IV, el método consiste en…",["Unas reglas ciertas y fáciles para no tomar nunca lo falso por verdadero","Una colección de experimentos","Una serie de dogmas de fe","Un conjunto de opiniones probables"],0,"Por método entiende unas reglas ciertas y fáciles con las que no se tomará nunca por verdadero lo que es falso.","Método"],
["¿En qué obra expone Descartes las cuatro reglas del método?",["En la segunda parte del Discurso del método","En la sexta Meditación","En los Principios de la Filosofía","En las Pasiones del alma"],0,"Las reglas del método aparecen en la segunda parte del Discurso del método.","Método"],
["¿Cuáles son las cuatro reglas del método?",["Duda, cogito, Dios y mundo","Evidencia, análisis, síntesis y comprobación","Observación, hipótesis, experimento y ley","Intuición, deducción, inducción y abstracción"],1,"Las cuatro reglas son evidencia, análisis, síntesis y comprobaciones (enumeración y revisión).","Método"],
["¿Qué exige la regla de la evidencia?",["Dividir cada dificultad en partes","No admitir como verdadero nada que no se presente clara y distintamente","Empezar por lo más simple","Hacer revisiones generales"],1,"No admitir jamás como verdadera cosa alguna sin conocer con evidencia que lo era.","Método"],
["¿Qué dos errores manda evitar la primera regla del método?",["La duda y la fe","La precipitación y la prevención","La deducción y la intuición","El análisis y la síntesis"],1,"La regla de la evidencia pide evitar cuidadosamente la precipitación y la prevención.","Método"],
["«Dividir cada una de las dificultades que examinase en tantas partes como fuese posible» corresponde a la regla de…",["Evidencia","Análisis","Síntesis","Comprobación"],1,"Es la segunda regla, la del análisis.","Método"],
["«Conducir ordenadamente mis pensamientos comenzando por los objetos más simples» corresponde a la regla de…",["Síntesis","Evidencia","Análisis","Comprobación"],0,"Es la tercera regla: ascender poco a poco de lo más simple a lo más complejo.","Método"],
["¿Qué pide la cuarta regla del método?",["Dudar de los sentidos","Hacer enumeraciones completas y revisiones generales para no omitir nada","Aceptar solo lo evidente","Partir de lo más complejo"],1,"La regla de comprobación pide enumeraciones tan completas y revisiones tan generales que no se omita nada.","Método"],
["¿A qué procesos se refieren la segunda y la tercera reglas del método?",["A la duda y al cogito","Al análisis y a la síntesis","A la intuición y la fe","A la evidencia y la comprobación"],1,"La segunda regla es el análisis y la tercera la síntesis.","Método"],
["Según Descartes, ¿en qué ámbito se había usado ya la razón conforme a su método?",["En la teología","En las matemáticas","En la política","En la medicina"],1,"Hasta entonces la razón se había usado así solo en las matemáticas, con resultados admirables.","Método"],
["¿Por qué puede aplicarse el método a todos los ámbitos del saber?",["Porque todas las ciencias son experimentales","Porque la razón es única","Porque Dios lo garantiza","Porque lo dice Aristóteles"],1,"Al ser única la razón, nada impide utilizar el mismo método en todos los ámbitos del saber.","Método"],
["¿En qué consistía el proyecto cartesiano?",["En la unificación de la ciencia","En defender la Escolástica","En demostrar el empirismo","En reformar la Iglesia"],0,"El proyecto cartesiano consistía en la unificación de la ciencia, construida con un único método.","Método"],
["¿Qué exige la construcción del edificio del saber?",["Un punto de partida que sea una verdad absolutamente cierta","Muchas observaciones","La aceptación de la tradición","Un acuerdo entre los sabios"],0,"Exige un punto de partida absolutamente cierto, sobre el que no sea posible dudar.","Método"],

// ===== DUDA Y COGITO =====
["¿Qué camino elige Descartes para hallar un punto de partida absolutamente cierto?",["La experiencia","La duda metódica","La revelación","La autoridad de la tradición"],1,"El camino elegido por Descartes es el de la duda metódica.","Duda y cogito"],
["¿Es escéptica la duda cartesiana?",["Sí: Descartes duda por dudar","No: usa la duda solo para buscar la verdad","Sí: concluye que no podemos saber nada","No: porque no duda de nada"],1,"No es una actitud escéptica ni una duda gratuita: es un instrumento para buscar la verdad.","Duda y cogito"],
["¿Por qué la duda cartesiana se llama «metódica»?",["Porque se aplica solo a las matemáticas","Porque es una exigencia del método en su momento analítico","Porque la impone la Iglesia","Porque es una duda definitiva"],1,"La duda es metódica porque es una exigencia del método en su momento analítico.","Duda y cogito"],
["¿Cuál es la función principal de la duda metódica?",["Destruir toda posibilidad de conocimiento","Hacer una labor de desescombro en nuestro conocimiento","Demostrar la existencia del mundo","Sustituir a la razón"],1,"Su función principal es ejercer una labor de desescombro, eliminando todo aquello de que sea posible dudar.","Duda y cogito"],
["¿Con qué regla del método se corresponde la duda metódica?",["Con la primera, la evidencia","Con la segunda, el análisis","Con la tercera, la síntesis","Con la cuarta, la comprobación"],1,"La duda permite llevar a cabo la labor de análisis (2.ª regla) hasta llegar a una verdad simple e indubitable.","Duda y cogito"],
["¿Qué hay que eliminar según la duda metódica?",["Solo las opiniones falsas","Todo aquello de lo que sea posible dudar","Solo las creencias religiosas","Solo las verdades matemáticas"],1,"Hay que eliminar todos los conocimientos, ideas y creencias que no tengan una certeza absoluta.","Duda y cogito"],
["¿Cómo se ordenan los tres niveles de duda?",["De mayor a menor radicalidad","De menor a mayor radicalidad","Sin un orden concreto","Según su importancia religiosa"],1,"Descartes introduce tres niveles de duda que van de menor a mayor radicalidad escéptica.","Duda y cogito"],
["¿Cuál es el primer nivel de duda?",["El genio maligno","La falacia de los sentidos","El argumento del sueño","La duda sobre Dios"],1,"El primer nivel es la falacia de los sentidos.","Duda y cogito"],
["¿Qué argumenta la falacia de los sentidos?",["Que los sentidos nunca engañan","Que si los sentidos nos engañan a veces, no hay garantía de que no lo hagan siempre","Que solo engaña la vista","Que los sentidos son la base del conocimiento"],1,"Si a veces nos engañan, ¿qué garantía hay de que no lo hagan siempre?","Duda y cogito"],
["¿Por qué no basta con que sea improbable que los sentidos nos engañen siempre?",["Porque la improbabilidad no equivale a certeza","Porque los sentidos son infalibles","Porque Dios los controla","Porque lo prohíbe la tercera regla"],0,"Aunque sea improbable, la improbabilidad no equivale a la certeza que exige el método.","Duda y cogito"],
["¿Qué permite dudar el argumento del sueño?",["Solo de las verdades matemáticas","De que existan las cosas que percibimos, e incluso de que el mundo sea real","De que yo pienso","De la existencia de Dios"],1,"Como no podemos distinguir con seguridad la vigilia del sueño, dudamos de la existencia de lo que percibimos.","Duda y cogito"],
["¿En qué se basa el argumento del sueño?",["En que los sueños son siempre falsos","En que no hay un criterio seguro para distinguir la vigilia del sueño","En que el sueño es una enfermedad","En que soñamos con Dios"],1,"A veces los sueños son tan vivos como la vigilia y no hay criterios para distinguirlos.","Duda y cogito"],
["¿Qué verdades resisten el argumento del sueño, pero no el del genio maligno?",["Las verdades matemáticas","Las percepciones sensibles","La existencia del mundo","La existencia de mi cuerpo"],0,"Dormidos o despiertos, los tres ángulos de un triángulo suman 180°; solo el genio maligno permite dudar de ello.","Duda y cogito"],
["¿Cuál es el nivel más radical de la duda?",["La falacia de los sentidos","El argumento del sueño","El argumento del genio maligno","La duda sobre la tradición"],2,"El genio maligno es el tercer y más radical motivo de duda.","Duda y cogito"],
["¿Qué supone la hipótesis del genio maligno?",["Que Dios es bueno y veraz","Que tal vez el entendimiento está hecho de tal modo que se equivoca siempre","Que los sentidos son fiables","Que el mundo existe"],1,"Supone que tal vez el entendimiento humano se equivoca siempre, incluso al pensar con verdad aparente.","Duda y cogito"],
["¿Cómo describe Descartes al genio maligno en las Meditaciones?",["Como un ser débil e ignorante","Como un ser «extremadamente poderoso e inteligente» que emplea su industria en engañarme","Como el propio Dios","Como un sueño"],1,"Es un genio extremadamente poderoso e inteligente que pone todo su empeño en inducirme a error.","Duda y cogito"],
["¿A qué parece abocar la duda llevada a su extremo?",["Al dogmatismo","Al escepticismo","Al empirismo","Al materialismo"],1,"Llegado a una duda universal, parece abocar irremisiblemente al escepticismo.","Duda y cogito"],
["¿Cuál es la primera verdad que encuentra Descartes?",["Dios existe","El mundo existe","Pienso, luego existo","Los cuerpos son extensos"],2,"La existencia del propio sujeto que piensa y duda: «Cogito, ergo sum».","Duda y cogito"],
["¿Por qué el cogito resiste a toda duda?",["Porque lo garantizan los sentidos","Porque puedo dudar de todo menos de que dudo, y para dudar tengo que existir","Porque lo enseña la Escolástica","Porque es una verdad matemática"],1,"Si pienso que el mundo existe, puedo equivocarme sobre el mundo, pero no sobre que lo pienso.","Duda y cogito"],
["¿Qué significa «Cogito, ergo sum»?",["Dudo, luego no sé nada","Pienso, luego existo","Siento, luego existo","Creo, luego entiendo"],1,"Es la célebre frase con la que Descartes expresa la primera verdad: pienso, luego existo.","Duda y cogito"],
["Para Descartes, «pensar» incluye…",["Solo razonar matemáticamente","Dudar, afirmar, creer, equivocarse, amar…","Solo percibir con los sentidos","Solo imaginar"],1,"Mi existencia como sujeto que piensa (duda, afirma, cree, se equivoca, ama, etc.) está exenta de toda duda.","Duda y cogito"],
["Además de ser la primera verdad, el cogito es…",["Una hipótesis provisional","El prototipo de toda verdad y de toda certeza","Una verdad revelada","Una opinión probable"],1,"La existencia del sujeto pensante es la primera verdad y el prototipo de toda verdad.","Duda y cogito"],
["¿Cuál es el criterio de verdad que Descartes deduce del cogito?",["La utilidad","La claridad y la distinción","La coherencia con la tradición","El acuerdo de la mayoría"],1,"Todo lo que perciba con igual claridad y distinción será verdadero.","Duda y cogito"],
["¿Por qué es absolutamente indubitable la existencia del sujeto pensante?",["Porque la vemos con los ojos","Porque se percibe con toda claridad y distinción","Porque la demuestra Dios","Porque la acepta todo el mundo"],1,"Es indudable porque se percibe con total claridad y distinción, y de ahí sale el criterio de verdad.","Duda y cogito"],
["«Todo lo que percibo clara y distintamente es verdadero» aparece en…",["Meditaciones, III","Discurso del método, II","Principios de la Filosofía","Reglas, IV"],0,"La regla general del criterio de verdad se formula en la Meditación III.","Duda y cogito"],

// ===== IDEAS Y DIOS =====
["Tras el cogito, ¿cuál es el gran problema que se plantea Descartes?",["Demostrar que piensa","Conseguir la certeza de que existe algo fuera de su pensamiento","Encontrar un método","Refutar a Platón"],1,"La existencia del yo no implica otra realidad: ¿cómo saber que existe algo exterior al pensamiento?","Ideas y Dios"],
["¿Por qué Descartes tiene que deducir la realidad a partir del pensamiento?",["Porque así lo exige el ideal deductivo","Porque los sentidos son fiables","Porque así lo dice la Biblia","Porque lo prefiere por comodidad"],0,"El ideal deductivo exige extraer todos los conocimientos a partir de la primera verdad, el cogito.","Ideas y Dios"],
["En «yo pienso que el mundo existe», ¿qué factor es dudoso?",["El yo que piensa","El mundo como realidad exterior","La idea de mundo","La idea de existencia"],1,"El yo es indudable y las ideas también; lo dudoso es la realidad exterior del mundo.","Ideas y Dios"],
["¿Con qué dos elementos cuenta Descartes para llevar a cabo la deducción?",["Los sentidos y la memoria","El pensamiento como actividad y las ideas que pienso","Dios y el mundo","La fe y la razón"],1,"El inventario solo muestra dos elementos: el pensamiento como actividad (yo pienso) y las ideas que pienso.","Ideas y Dios"],
["¿Qué concluye Descartes de su análisis del pensamiento?",["Que el pensamiento piensa cosas","Que el pensamiento siempre piensa ideas","Que el pensamiento es material","Que no podemos pensar"],1,"De su análisis concluye que el pensamiento siempre piensa ideas.","Ideas y Dios"],
["Para la filosofía anterior a Descartes, ¿qué es la idea?",["Una fotografía que contemplamos","Un medio transparente, como una lente, a través del cual se ven las cosas","Una sustancia","Una sensación"],1,"Antes, el pensamiento recaía directamente sobre las cosas: la idea era como una lente transparente.","Ideas y Dios"],
["Para Descartes, ¿qué es la idea?",["Una lente transparente","Una representación o fotografía que contemplamos","Una realidad que existe en sí misma","Un objeto material"],1,"El pensamiento no recae sobre las cosas sino sobre las ideas, que son representaciones.","Ideas y Dios"],
["Según los apuntes, ¿qué cambia en la filosofía a partir de Descartes?",["Pasa de idealista a realista","Pasa de realista a idealista","Pasa de racionalista a empirista","No cambia nada"],1,"La filosofía es realista hasta Descartes e idealista a partir de él.","Ideas y Dios"],
["¿En qué se diferencia la idea cartesiana de la Idea platónica?",["En nada","Para Platón las Ideas existían en y por sí; para Descartes son contenidos del pensamiento","Para Descartes las ideas son materiales","Para Platón las ideas eran sensaciones"],1,"Para Platón las Ideas existían independientemente de las cosas; en Descartes son lo que el pensamiento piensa.","Ideas y Dios"],
["Como actos mentales o «modos del pensamiento», las ideas…",["Tienen todas la misma realidad","Tienen realidades muy distintas","No tienen realidad","Son sustancias"],0,"Como actos mentales, todas las ideas poseen la misma realidad.","Ideas y Dios"],
["En cuanto a su contenido objetivo, ¿qué ideas tienen más realidad?",["Las que representan modos o accidentes","Las que representan sustancias","Las facticias","Todas tienen la misma"],1,"Las ideas que representan sustancias poseen más realidad objetiva que las que representan modos o accidentes.","Ideas y Dios"],
["¿Qué son las ideas adventicias?",["Las que construye la mente","Las que parecen provenir de la experiencia externa","Las que posee el pensamiento en sí mismo","Las que vienen de Dios"],1,"Son las que parecen provenir de nuestra experiencia externa: ser humano, caballo, alas…","Ideas y Dios"],
["¿Por qué se dice que las ideas adventicias «parecen» provenir del exterior?",["Porque aún no consta la existencia de una realidad exterior","Porque son falsas","Porque las inventa la imaginación","Porque vienen de Dios"],0,"Decimos «parecen» porque todavía no está demostrada la existencia del mundo exterior.","Ideas y Dios"],
["¿Cuál de estas es una idea facticia?",["La idea de pensamiento","La idea de centauro","La idea de existencia","La idea de infinito"],1,"Las facticias las construye la mente a partir de otras ideas: caballo alado, centauro, ratoncito Pérez…","Ideas y Dios"],
["¿Por qué las ideas adventicias no sirven para demostrar la existencia del mundo?",["Porque su validez depende de esa misma existencia: sería un círculo vicioso","Porque son innatas","Porque son demasiado claras","Porque las crea Dios"],0,"Su validez depende de la problemática existencia de la realidad extramental, así que sería un círculo vicioso.","Ideas y Dios"],
["¿Qué son las ideas innatas?",["Las que el pensamiento posee en sí mismo","Las que proceden de los sentidos","Las que construye la imaginación","Las que se aprenden en la escuela"],0,"Son ideas que no son adventicias ni facticias: el pensamiento las posee en sí mismo.","Ideas y Dios"],
["¿Cuál de estas es un ejemplo de idea innata en los apuntes?",["La idea de caballo","La idea de existencia","La idea de ratoncito Pérez","La idea de color"],1,"Las ideas de «pensamiento» y «existencia» son innatas: las encuentro en el propio «pienso, luego existo».","Ideas y Dios"],
["¿Cuál es la afirmación fundamental del racionalismo sobre las ideas primitivas del conocimiento?",["Que proceden de la experiencia","Que son innatas","Que son facticias","Que no existen"],1,"Las ideas primitivas a partir de las cuales se construye el edificio del conocimiento son innatas.","Ideas y Dios"],
["¿Con qué identifica Descartes la idea de infinito?",["Con el mundo","Con Dios","Con el yo","Con la extensión"],1,"Entre las ideas innatas descubre la de infinito, que identifica con la idea de Dios.","Ideas y Dios"],
["¿Por qué la idea de Dios no es adventicia?",["Porque no tenemos experiencia directa de Dios","Porque la construye la mente","Porque es confusa","Porque procede de los sentidos"],0,"Evidentemente no es adventicia, pues no poseemos experiencia directa de Dios.","Ideas y Dios"],
["¿Cómo argumenta Descartes que la idea de infinito no es facticia?",["Diciendo que la idea de finitud presupone la de infinitud","Diciendo que procede de la experiencia","Diciendo que la inventó la Iglesia","Diciendo que es una idea confusa"],0,"Contra la opinión tradicional, la noción de finitud presupone la de infinitud, y no al revés.","Ideas y Dios"],
["¿Cuántos argumentos da Descartes para demostrar la existencia de Dios?",["Uno","Dos","Tres","Cinco"],2,"Dos argumentos de causalidad (aplicado a la idea de infinito y a mi propio ser) y el argumento ontológico.","Ideas y Dios"],
["En el argumento de causalidad aplicado a la idea de infinito, la causa de una idea debe tener…",["Tanta realidad formal como realidad objetiva tenga la idea","Menos realidad que la idea","Solo realidad material","Ninguna realidad"],0,"La causa ha de tener tanta realidad formal cuanta realidad objetiva tenga su idea: la idea de infinito la causa un ser infinito.","Ideas y Dios"],
["¿Qué afirma el argumento de causalidad aplicado a mi propio ser?",["Que soy causa de mí mismo","Que, si fuera mi propia causa, me habría hecho perfecto; por tanto me ha creado Dios","Que el mundo me ha creado","Que no existo"],1,"Soy imperfecto y tengo la idea de perfección: la causa de mi ser ha de ser Dios.","Ideas y Dios"],
["¿De quién toma Descartes, básicamente, el argumento ontológico?",["De Tomás de Aquino","De Anselmo de Canterbury","De Platón","De Agustín de Hipona"],1,"Es básicamente el mismo argumento de Anselmo de Canterbury.","Ideas y Dios"],
["¿Qué ejemplo usa Descartes en el argumento ontológico?",["Un trozo de cera","Un triángulo, que no puede concebirse sin tres lados","Una ciudad","Un árbol"],1,"Igual que no podemos concebir un triángulo sin tres lados, no podemos concebir un ser perfecto al que le falte la existencia.","Ideas y Dios"],
["¿Qué sostiene el argumento ontológico?",["Que la idea de ser perfecto contiene en sí misma su existencia","Que el mundo necesita una causa","Que soy imperfecto","Que los sentidos prueban a Dios"],0,"La idea de un ser perfecto contiene en sí misma su existencia.","Ideas y Dios"],
["¿Cómo demuestra Descartes la existencia del mundo?",["Por los sentidos","A partir de la existencia de Dios, que es bueno y veraz y no puede engañarme","Por el argumento del sueño","Por la autoridad de Aristóteles"],1,"Dios es infinitamente bueno y veraz: no puede permitir que me engañe al creer que el mundo existe.","Ideas y Dios"],
["¿Qué papel cumple Dios respecto del mundo en la filosofía cartesiana?",["Es una hipótesis innecesaria","Es la garantía de que a mis ideas les corresponde una realidad extramental","Es el genio maligno","Es una idea facticia"],1,"Dios aparece como garantía de que a mis ideas corresponde un mundo, algo paradójico en un sistema racionalista.","Ideas y Dios"],
["¿Garantiza Dios que a todas mis ideas les corresponda una realidad?",["Sí, a todas sin excepción","No: solo garantiza un mundo de extensión y movimiento","Sí, pero solo a las facticias","No garantiza nada"],1,"Dios no garantiza las cualidades secundarias; solo un mundo de extensión y movimiento.","Ideas y Dios"],
["¿Cuáles son las cualidades primarias?",["Color, olor y sabor","Extensión y movimiento (forma, tamaño, movimiento)","Frío y calor","Belleza y bondad"],1,"Las cualidades primarias son la extensión y el movimiento, de las que puede deducirse la física.","Ideas y Dios"],
["¿Qué dice Descartes de las cualidades secundarias como colores, sabores o sonidos?",["Que son lo más real del mundo","Que no existen, aunque tengamos sus ideas","Que son innatas","Que las garantiza Dios"],1,"Como Galileo y la ciencia moderna, Descartes niega que existan las cualidades secundarias.","Ideas y Dios"],
["¿Qué puede deducirse de la extensión y el movimiento?",["La moral","La física y las leyes generales del movimiento","La existencia de Dios","Las cualidades secundarias"],1,"A partir de la extensión y el movimiento puede deducirse la física.","Ideas y Dios"],

// ===== LAS TRES SUSTANCIAS =====
["¿Cuáles son las tres sustancias de Descartes?",["Agua, aire y fuego","Sustancia infinita, sustancia pensante y sustancia extensa","Alma racional, irascible y concupiscible","Materia, forma y acto"],1,"Dios (res infinita), el yo (res cogitans) y los cuerpos (res extensa).","Sustancias"],
["¿Qué nombre latino recibe la sustancia pensante?",["Res extensa","Res cogitans","Res infinita","Res publica"],1,"El yo o sustancia pensante es la res cogitans.","Sustancias"],
["¿Qué nombre latino recibe la sustancia de los cuerpos?",["Res cogitans","Res infinita","Res extensa","Res materialis"],2,"Los cuerpos son sustancia extensa: res extensa.","Sustancias"],
["¿Qué es el atributo de una sustancia?",["Una modificación pasajera","Su esencia","Su causa","Una cualidad secundaria"],1,"Cada sustancia tiene una esencia que Descartes denomina atributo.","Sustancias"],
["¿Cuál es el atributo de la sustancia pensante?",["La extensión","El pensamiento","La infinitud","El movimiento"],1,"El atributo de la res cogitans es el pensamiento.","Sustancias"],
["¿Cuál es el atributo de la sustancia extensa?",["El pensamiento","La infinitud","La extensión","El color"],2,"El atributo de la res extensa es la extensión.","Sustancias"],
["¿Cuál es el atributo de Dios?",["La infinitud","La extensión","El pensamiento","El movimiento"],0,"El atributo de la sustancia infinita es la infinitud.","Sustancias"],
["¿Qué son los modos de una sustancia?",["Su esencia","Las modificaciones que sufre la sustancia","Las pruebas de su existencia","Sus causas"],1,"Los modos son las modificaciones de la sustancia.","Sustancias"],
["¿Cuáles son modos de la sustancia pensante?",["Profundidad, volumen y anchura","Creer, dudar, imaginar, sentir, amar, odiar","Color, olor y sabor","Infinitud y perfección"],1,"Los modos de la res cogitans son creer, dudar, imaginar, sentir, amar, odiar, etc.","Sustancias"],
["¿Cuáles son modos de la sustancia extensa?",["Dudar y creer","Profundidad, volumen, anchura, formas y movimientos","Amar y odiar","Ninguno"],1,"Los modos de la res extensa son la profundidad, el volumen, la anchura, etc.","Sustancias"],
["¿Por qué la sustancia infinita no tiene modos?",["Porque no existe","Porque, dada su perfección, es siempre idéntica","Porque es material","Porque es una idea facticia"],1,"Dada su perfección, la sustancia infinita no tendría modos: es siempre idéntica.","Sustancias"],
["¿Cómo define Descartes la sustancia?",["Lo que existe en otro","Toda cosa que existe de tal modo que no necesita de ninguna otra para existir","Lo que se percibe con los sentidos","La unión de materia y forma"],1,"Sustancia es toda cosa que no necesita de ninguna otra cosa para existir.","Sustancias"],
["Tomada al pie de la letra, ¿a qué se aplicaría la definición de sustancia?",["A los cuerpos","Solo a Dios","Solo al yo","A las ideas"],1,"En sentido absoluto, solo Dios no necesita de nada para existir.","Sustancias"],
["¿Por qué mantiene Descartes el nombre de sustancia para el yo y los cuerpos?",["Por su independencia mutua: no necesitan la una de la otra para existir","Porque son infinitos","Porque se crean a sí mismos","Porque son idénticos"],0,"La sustancia pensante y la extensa no necesitan la una de la otra para existir.","Sustancias"],
["¿Qué tipo de dualismo antropológico defiende Descartes?",["Uno más moderado que el de Platón","Uno más radical que el de Platón","Ninguno","Uno igual al de Aristóteles"],1,"Se deduce un dualismo antropológico mucho más radical que el del propio Platón.","Sustancias"],
["¿Cuál es el objetivo último de separar alma y cuerpo como sustancias distintas?",["Explicar las enfermedades","Salvaguardar la autonomía del alma respecto de la materia","Demostrar el mundo","Negar la libertad"],1,"El objetivo es salvaguardar la autonomía del alma con respecto a la materia.","Sustancias"],
["¿Qué concepción del mundo material imponía la ciencia moderna?",["Teleológica y libre","Mecanicista y determinista","Mágica","Animista"],1,"La ciencia moderna imponía una concepción mecanicista y determinista del mundo material.","Sustancias"],
["¿Por qué el alma tiene que ser independiente del cuerpo, según Descartes?",["Para poder salvar la libertad frente al determinismo mecanicista","Para explicar la digestión","Para justificar el geocentrismo","Para negar a Dios"],0,"Si el alma fuera materia estaría sometida a las leyes mecánicas: solo separándola se salva la libertad.","Sustancias"],
["¿En qué se justifica la autonomía del alma respecto de la materia?",["En la experiencia sensible","En la claridad y distinción con que el entendimiento percibe su independencia","En la tradición","En la autoridad de Platón"],1,"Poseo una idea clara y distinta de mí como cosa pensante e inextensa, y del cuerpo como cosa extensa que no piensa.","Sustancias"],
["Según la Meditación VI, el yo es…",["Idéntico a su cuerpo","Distinto de su cuerpo y puede existir sin él","Una parte del cuerpo","Una cualidad secundaria"],1,"«Es evidente que yo soy distinto de mi cuerpo y que puedo existir sin él».","Sustancias"],
["¿Por qué consigue Descartes su propósito «solo a medias»?",["Porque no encuentra ninguna verdad","Porque tiene que acudir a una garantía externa al yo: Dios","Porque renuncia al método","Porque niega el cogito"],1,"Justifica el mundo a partir del yo, pero necesita un intermediario, Dios, que lo garantice todo.","Sustancias"],
["En el orden del descubrimiento, Dios es la segunda verdad. ¿Qué lugar ocupa en el orden ontológico?",["El último","El primero","El segundo también","Ninguno"],1,"Aunque sea la segunda verdad epistemológica, pasa a ser la primera desde el punto de vista ontológico.","Sustancias"],
["En la reconstrucción cartesiana, el yo se conoce por intuición. ¿Cómo se conoce el mundo?",["Por intuición también","Por deducción","Por los sentidos","Por revelación"],1,"Del yo, lo más simple y conocido por intuición, se llega al mundo, lo más complejo y conocido por deducción.","Sustancias"]

locke:[
 ["¿Cómo describe Locke el estado de naturaleza?",["Como una guerra de todos contra todos","Como un estado de perfecta libertad e igualdad regido por la ley natural","Como una sociedad organizada","Como el paraíso terrenal"],1,"La libertad no es libertinaje: la ley natural, que es la razón, obliga a todos."],
 ["¿Qué prescribe la ley natural según Locke?",["Obedecer siempre al rey","Que nadie dañe a otro en su vida, salud, libertad o posesiones","Que todo es de todos","Que el más fuerte manda"],1,"Todos son iguales e independientes, criaturas del mismo Hacedor."],
 ["¿En qué se diferencia el estado de guerra del estado de naturaleza?",["No se diferencian","El estado de guerra surge cuando alguien usa la fuerza sin derecho contra otro","El estado de guerra es la vida en sociedad","El estado de naturaleza es peor"],1,"Frente a Hobbes, Locke separa ambos estados: la naturaleza no es guerra."],
 ["¿Por qué nadie puede venderse como esclavo según el capítulo 4?",["Porque es caro","Porque nadie tiene poder absoluto sobre su propia vida y no puede dar lo que no tiene","Porque lo prohíbe el Parlamento","Porque los esclavos no trabajan bien"],1,"La libertad frente al poder absoluto está unida a la conservación de la vida."],
 ["¿Cuál es el origen de la propiedad según el capítulo 5?",["La herencia","El trabajo que cada uno mezcla con lo que la naturaleza ofrece","La concesión del rey","La conquista"],1,"El trabajo es mío; al añadirlo a una cosa natural, la saco del estado común y la hago mía."],
 ["¿Qué límites tiene la propiedad en el estado de naturaleza?",["Ninguno","Dejar suficiente y de igual calidad para los demás y no dejar que se eche a perder","Solo lo que permita el gobierno","No poseer tierra"],1,"Nadie puede apropiarse de más de lo que puede aprovechar."],
 ["¿Qué permite la introducción del dinero?",["Acabar con la propiedad","Acumular más allá del límite del deterioro, por consentimiento","Suprimir el trabajo","Igualar a todos"],1,"El oro y la plata no se estropean; su uso se basa en un acuerdo tácito."],
 ["¿Cuál es el fin principal de la sociedad política (cap. 9)?",["La gloria del Estado","La preservación de la propiedad: vida, libertad y bienes","La salvación de las almas","La conquista de territorios"],1,"Los hombres se unen en sociedad para proteger lo que ya les pertenece por naturaleza."],
 ["¿Qué falta en el estado de naturaleza según el capítulo 9?",["Ley natural","Una ley establecida y conocida, un juez imparcial y un poder que ejecute las sentencias","Libertad","Propiedad"],1,"Por esos tres defectos el disfrute de la propiedad es inseguro."],
 ["¿A qué corrientes se asocia a Locke?",["Racionalismo y absolutismo","Empirismo y liberalismo político","Idealismo y comunismo","Vitalismo y anarquismo"],1,"En teoría del conocimiento es empirista; en política, padre del liberalismo."]
],
kant:[
 ["Según la Fundamentación, ¿qué es lo único bueno sin restricción?",["La felicidad","La inteligencia","Una buena voluntad","El valor"],2,"Los talentos y dones pueden ser malos si los usa una mala voluntad."],
 ["¿Cuándo tiene valor moral una acción?",["Cuando produce buenos resultados","Cuando se hace por deber","Cuando es conforme al deber, por cualquier motivo","Cuando nos hace felices"],1,"Solo la acción hecha por deber, por respeto a la ley, tiene auténtico valor moral."],
 ["¿Qué muestra el ejemplo del tendero que no engaña a sus clientes por interés?",["Que su acción tiene valor moral","Que actúa conforme al deber, pero no por deber","Que el comercio es inmoral","Que el interés es el fundamento de la moral"],1,"Hace lo correcto por conveniencia: su acción es legal, pero no moral."],
 ["¿Cómo define Kant el deber?",["Como la necesidad de una acción por respeto a la ley","Como lo que ordena el Estado","Como lo que da placer","Como una costumbre social"],0,"El respeto es el sentimiento que produce la conciencia de la ley moral."],
 ["¿Dónde reside el valor moral de una acción hecha por deber?",["En el fin que se consigue","En la máxima por la que se decide","En la opinión de los demás","En la intensidad del esfuerzo"],1,"No depende de la realidad del objeto, sino del principio del querer."],
 ["¿Cuál es la formulación de la ley que aparece en la sección 1?",["Haz a los demás lo que quieras que te hagan","Obra de modo que puedas querer que tu máxima se convierta en ley universal","Busca la mayor felicidad para el mayor número","Sigue la naturaleza"],1,"Es el núcleo del imperativo categórico."],
 ["¿En qué se distingue un imperativo categórico de uno hipotético?",["El categórico manda de forma incondicionada; el hipotético depende de un fin","No se distinguen","El hipotético es moral y el categórico técnico","El categórico depende de la felicidad"],0,"«Si quieres aprobar, estudia» es hipotético; «no mientas» es categórico."],
 ["La ética kantiana es…",["Material y heterónoma","Formal y autónoma","Eudemonista","Utilitarista"],1,"No dice qué bienes perseguir, sino la forma que debe tener la voluntad, que se da a sí misma la ley."],
 ["¿Por qué la razón no está destinada a la felicidad según Kant?",["Porque la felicidad no existe","Porque el instinto la alcanzaría mejor; la razón está para producir una voluntad buena","Porque la razón es mala","Porque Dios lo prohíbe"],1,"Si la naturaleza buscara nuestra felicidad, habría confiado en el instinto, no en la razón."],
 ["¿Qué ocurre si universalizamos la máxima de hacer una falsa promesa?",["Todos serían más felices","La promesa misma se destruiría, porque nadie creería ninguna","Aumentaría la confianza","Nada"],1,"La máxima no puede ser ley universal sin contradecirse."]
],
nietzsche:[
 ["¿Qué anuncia el hombre loco en La gaya ciencia, § 125?",["La llegada del superhombre","La muerte de Dios","El fin de la ciencia","La inmortalidad del alma"],1,"Busca a Dios con una linterna en pleno día en la plaza del mercado."],
 ["Según el hombre loco, ¿quién ha matado a Dios?",["Los filósofos","Nosotros, los hombres","La ciencia","Nadie, se ha muerto solo"],1,"«Nosotros lo hemos matado, vosotros y yo», aunque aún no somos conscientes del acontecimiento."],
 ["¿Qué consecuencias describe el § 343?",["Que nada cambia","El derrumbe de la moral europea, pero también un horizonte libre para los espíritus libres","El regreso del cristianismo","El triunfo de la razón"],1,"Para el filósofo, la noticia es como una nueva aurora: el mar vuelve a estar abierto."],
 ["Según «La razón en la filosofía», ¿qué rasgo comparten los filósofos?",["Su amor al devenir","Su falta de sentido histórico y su odio al devenir: momifican conceptos","Su confianza en los sentidos","Su ateísmo"],1,"Nietzsche lo llama «egipticismo»: convierten todo en momias conceptuales."],
 ["Para Nietzsche, ¿quién falsea el testimonio de los sentidos?",["Los sentidos mismos","La razón","El cuerpo","El arte"],1,"Los sentidos muestran el devenir; la razón introduce unidad, sustancia y permanencia."],
 ["¿En qué consiste el error de «confundir lo último con lo primero»?",["Leer los libros al revés","Poner los conceptos más generales y vacíos (ser, bien) como origen y causa de todo","Confundir el pasado con el futuro","Creer en la ciencia"],1,"Lo último y más tenue de la realidad se convierte en lo más alto y en causa de sí."],
 ["¿Qué dice Nietzsche sobre el mundo «verdadero» y el «aparente»?",["El verdadero es el de las Ideas","El mundo aparente es el único; el «verdadero» es una añadidura mentirosa","Ambos son igual de reales","Solo existe Dios"],1,"Dividir el mundo en verdadero y aparente es síntoma de vida decadente."],
 ["¿Qué papel atribuye al lenguaje en la creencia en Dios?",["Ninguno","«Temo que no nos libraremos de Dios mientras creamos en la gramática»","El lenguaje demuestra a Dios","El lenguaje es divino"],1,"La gramática nos hace creer en sujetos, sustancias y causas."],
 ["¿Qué sostiene el § 110 sobre el origen del conocimiento?",["Nace de la contemplación pura","Se forma a partir de errores útiles para la conservación de la vida","Es innato","Procede de Dios"],1,"Creer en cosas duraderas, cuerpos o libre voluntad fue útil, aunque no verdadero."],
 ["¿A qué corriente se asocia a Nietzsche?",["Racionalismo","Vitalismo","Empirismo","Positivismo"],1,"La vida es el valor supremo; es también uno de los «maestros de la sospecha»."]
],
arendt:[

 ["¿Qué significa «banalidad del mal»?",["Que el mal no tiene importancia","Que grandes crímenes pueden cometerlos personas corrientes por irreflexión, no por maldad demoníaca","Que todos somos malos","Que el mal es aburrido"],1,"Eichmann le pareció alguien superficial que usaba frases hechas, sin pensamiento propio."],
 ["¿Qué pregunta plantea Arendt en ese ensayo?",["¿Existe Dios?","¿Puede la actividad de pensar condicionarnos para no hacer el mal?","¿Es la democracia el mejor sistema?","¿Qué es la verdad científica?"],1,"Sugiere que la ausencia de pensamiento favorece el mal."],
 ["¿Qué diferencia hay entre pensar y conocer según Arendt?",["Ninguna","El conocer busca la verdad; el pensar busca el sentido o significado","El pensar busca la verdad; el conocer, el sentido","Conocer es solo para científicos"],1,"Recoge la distinción kantiana entre razón (Vernunft) e intelecto (Verstand)."],
 ["¿Quién es el modelo de pensador para Arendt?",["Platón","Sócrates","Kant","Heidegger"],1,"Lo describe como tábano, comadrona y pez torpedo."],
 ["¿Cómo entiende Arendt el pensar?",["Como un cálculo","Como un diálogo silencioso conmigo mismo, el dos-en-uno","Como una revelación","Como obediencia a la autoridad"],1,"Por eso es mejor sufrir una injusticia que cometerla: no quiero convivir con un asesino dentro de mí."],
 ["¿Qué facultad «realiza» el pensar en el mundo de las apariencias?",["La memoria","El juicio","La voluntad","La imaginación"],1,"Juzgar casos particulares («esto está mal») puede evitar catástrofes en momentos de crisis."],
 ["Según «La promesa de la política», ¿cuál es el sentido de la política?",["La seguridad","La libertad","La riqueza","El orden"],1,"La política existe para que los hombres puedan ser libres juntos."],
 ["¿Dónde surge la política según Arendt?",["En el interior del individuo","En el espacio entre los hombres, en la pluralidad","En la naturaleza humana aislada","En el mercado"],1,"No hay política en el hombre, sino entre los hombres."],

 ["¿Cuál es la única perspectiva falsa para Ortega?",["La del científico","La que pretende ser la única","La del poeta","La del ciudadano común"],1,"El error es la utopía: ver desde ninguna parte."],

 ["¿Qué es la razón vital?",["Una razón opuesta a la vida","La razón al servicio de la vida, que comprende la realidad desde la vida concreta","El instinto","La razón matemática pura"],1,"Raciovitalismo: ni razón sin vida ni vida sin razón."],
 ["Según «Sobre la historia del Ser», el ser de las cosas…",["Es algo fijo que descubrimos","Es una interpretación que el hombre elabora desde su vida y que tiene historia","Es una ilusión de los sentidos","Es lo que dice la ciencia"],1,"Las distintas ideas del ser responden a distintas situaciones vitales e históricas."]

function makeCollapsible(root){
  root.querySelectorAll("section.th").forEach(sec=>{
    const head=sec.querySelector(".th-head"); if(!head) return;
    const bodyEl=document.createElement("div"); bodyEl.className="th-body"; bodyEl.hidden=true;
    [...sec.children].forEach(ch=>{ if(ch!==head && !ch.classList.contains("vinline")) bodyEl.appendChild(ch); });
    sec.appendChild(bodyEl);
    const set=open=>{bodyEl.hidden=!open;head.setAttribute("aria-expanded",open);sec.classList.toggle("open",open);head.querySelector(".th-tog-t").textContent=open?"Ocultar":"Ver teoría"};
    head.onclick=()=>set(bodyEl.hidden);
    sec._open=()=>set(true);
  });
}

platon(a){

<!-- 3.1 -->
<section class="card th" id="pl-intro">
  ${secHead("3.1","Biografía, contexto e influencias","Platón, discípulo de Sócrates, y su alumno Aristóteles marcan las dos coordenadas del pensamiento occidental. La platónica se sitúa en el ámbito de la <b>necesidad y la universalidad</b>; la aristotélica, en el de la experimentación, de donde nacerá la veta empirista.")}

        <div class="tlv-i"><span class="tlv-y">427 a. C.</span><p>Nace en Atenas, en plena Guerra del Peloponeso, en una familia <b>aristocrática y culta</b> educada para gobernar. Su nombre real era Aristocles; «Platón» alude a lo ancho de sus hombros (<i>platys</i>).</p></div>

  return '<section class="card tx-card" id="tx-'+t.id+'"><div class="tx-head"><span class="tx-n">'+(i+1)+'</span><div><b>'+t.ref+'</b><span class="tiny muted">'+t.id+'</span></div></div>'+
    '<div class="tx-video">'+(t.yt?ytEmbed(t.yt,title,a,'Texto '+(i+1)):'<div class="tx-v tx-v-empty">'+txCover(a,'Texto '+(i+1),null)+'<span class="tx-v-txt"><b>Vídeo de la explicación</b><span class="small muted">Próximamente</span></span></div>')+'</div>'+
    '<div class="tx-body">'+t.html+'</div></section>';
}
function tabTextos(a){
  const L=TEXTOS[a.id]||[];
  const G=TEXTOS_GRUPOS[a.id];
  if(!G){
    if(!L.length) return '<section class="card"><p class="muted">Los textos de '+a.name+' se añadirán pronto.</p></section>';
    return '<div class="tx-list">'+L.map((t,i)=>txCard(a,t,i)).join('')+txResumen(a)+'</div>';
  }
  const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="tx-list">'+G.map(g=>{
    let items=L.filter(t=>t.id.startsWith(g.prefix));
    let plain=false;
    const base=(COMMENTS[a.id]||[]).filter(c=>c.id.startsWith(g.prefix));
    if(base.length>items.length){
      items=base.map(c=>L.find(t=>t.id===c.id)||{id:c.id,ref:c.ref,yt:null,html:esc(c.texto),plain:true});
      plain=items.some(t=>t.plain);
    }
    const nv=items.filter(t=>t.yt).length;
    const res=(TEXTOS_RESUMEN[a.id]&&TEXTOS_RESUMEN[a.id].grupo===g.key)?txResumen(a):'';
    return '<section class="tx-group" data-g="'+g.key+'"><button class="tx-gh" aria-expanded="false"><span class="tx-gi" aria-hidden="true">'+ICONS.book+'</span><span class="tx-gt"><b>'+g.title+'</b><span class="small muted">'+g.sub+' · '+items.length+' textos'+(nv?' · '+nv+' vídeos':'')+'</span></span><svg class="tx-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>'+
      '<div class="tx-gb" hidden>'+(plain?'<p class="small muted tx-note">Algunos textos están todavía sin subrayar.</p>':'')+(items.length?items.map((t,i)=>txCard(a,t,i)).join(''):'<p class="muted">Próximamente.</p>')+res+'</div></section>';
  }).join('')+'</div>';
}
function bindTextos(body){
  body.querySelectorAll(".tx-gh").forEach(h=>h.onclick=()=>{const b=h.nextElementSibling;const open=b.hidden;b.hidden=!open;h.setAttribute("aria-expanded",open);h.parentElement.classList.toggle("open",open)});
}
function bindAuthor(id){
  const a = getA(id); if(!a) return;
  const body = document.getElementById("tabbody");
  const tabs = document.querySelectorAll(".seg button");
  const show = t=>{
    tabs.forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
    body._go=show;
    if(t==="textos"){body.innerHTML=tabTextos(a);bindTextos(body);store.set("tab",t);return}
    if(t==="test"){body.innerHTML='<div id="quizhost" style="display:flex;flex-direction:column;gap:18px"></div>';const qh=document.getElementById("quizhost");qh._go=show;startQuiz(a.id,qh);store.set("tab",t);return}
    if(t==="practicar"&&COMMENTS[a.id]){body.innerHTML=tabPracticarComentario(a);bindPracticarComentario(a,()=>show("practicar"));store.set("tab",t);return}
    body.innerHTML = t==="teoria"?tabFicha(a):tabPracticar(a);
    store.set("tab",t);
    if(t==="practicar") bindPractice(a);
    body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
    if(t==="teoria") makeCollapsible(body);
    body.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.jump);if(el){if(el._open)el._open();el.scrollIntoView({behavior:"smooth",block:"start"})}});
  };
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab));
  show("teoria");
}
function bindPractice(a){
  const all = store.get("drafts",{});
  const d = all[a.id]||{q1:"",q2:"",q3:"",checks:[]};
  const save = ()=>{all[a.id]=d;store.set("drafts",all);const m=document.getElementById("savedMsg");if(m){m.textContent="Guardado";clearTimeout(m._t);m._t=setTimeout(()=>m.textContent="",1500)}};
  document.querySelectorAll("textarea[data-k]").forEach(t=>t.addEventListener("input",()=>{d[t.dataset.k]=t.value;document.getElementById("c-"+t.dataset.k).textContent=words(t.value)+" palabras";save()}));
  document.querySelectorAll("input[data-i]").forEach(c=>c.addEventListener("change",()=>{const i=+c.dataset.i;d.checks=(d.checks||[]).filter(x=>x!==i);if(c.checked)d.checks.push(i);save()}));
  document.getElementById("copyAns").onclick=async()=>{
    const txt = a.name+"\n\n1. Ideas principales y problema\n"+(d.q1||"")+"\n\n2. Relación con su filosofía\n"+(d.q2||"")+"\n\n3. Comparación con otra época\n"+(d.q3||"");
    const m=document.getElementById("savedMsg");
    try{await navigator.clipboard.writeText(txt);m.textContent="Copiado"}catch(e){m.textContent="No se pudo copiar; selecciona el texto a mano"}
  };
  document.getElementById("clearAns").onclick=()=>{
    const btn=document.getElementById("clearAns");
    if(btn.dataset.confirm!=="1"){btn.dataset.confirm="1";btn.textContent="Pulsa otra vez para borrar";setTimeout(()=>{btn.dataset.confirm="";btn.textContent="Borrar borrador"},2500);return}
    delete all[a.id];store.set("drafts",all);document.getElementById("tabbody").innerHTML=tabPracticar(a);bindPractice(a);
  };
}

function bindDisertacion(){
  const host=document.getElementById("distab");

function bindEscribir(){
  const e = store.get("essay",{i:0,text:"",checks:[]});
  const save=()=>{store.set("essay",e);const m=document.getElementById("esaved");m.textContent="Guardado";clearTimeout(m._t);m._t=setTimeout(()=>m.textContent="",1500)};
  const ta=document.getElementById("etext");
  const upd=()=>{const n=words(ta.value);document.getElementById("ew").innerHTML='<span class="'+(n>400?"over":n>=350?"wc-ok":"")+'">'+n+' / 400 palabras</span>'+(n===0?'':n<350?'<span class="wc-low"> · te faltan '+(350-n)+' para llegar a 350</span>':n<=400?'<span class="wc-ok"> · extensión ideal</span>':'<span class="over"> · te pasas en '+(n-400)+'</span>')};
  const setQ=i=>{
    e.i=i;const x=ESSAYS[i];
    document.getElementById("eq").textContent=x.q;
    document.getElementById("ehint").innerHTML=ICONS.bulb+'<span><b>Autores útiles: </b>'+x.authors.map(id=>'<a href="#autor-'+id+'">'+getA(id).name+'</a>').join(", ")+'. '+x.hint+'</span>';
    document.querySelectorAll(".qitem").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
    store.set("essay",e);
  };
  document.querySelectorAll(".qitem").forEach(b=>b.onclick=()=>{setQ(+b.dataset.i);if(window.innerWidth<861)document.getElementById("timer").scrollIntoView({behavior:"smooth",block:"start"})});
  document.getElementById("rnd").onclick=()=>{let i;do{i=Math.floor(Math.random()*ESSAYS.length)}while(i===e.i);setQ(i)};
  ta.addEventListener("input",()=>{e.text=ta.value;upd();save();if(words(ta.value)>=100){const w=store.get("essaysWritten",[]);const q=ESSAYS[e.i].q;if(!w.includes(q)){w.push(q);store.set("essaysWritten",w)}}});
  document.querySelectorAll("input[data-i]").forEach(c=>c.addEventListener("change",()=>{const i=+c.dataset.i;e.checks2=(e.checks2||[]).filter(x=>x!==i);if(c.checked)e.checks2.push(i);save()}));
  document.getElementById("ecopy").onclick=async()=>{const m=document.getElementById("esaved");try{await navigator.clipboard.writeText(ESSAYS[e.i].q+"\n\n"+ta.value);m.textContent="Copiado"}catch(err){m.textContent="No se pudo copiar"}};
  document.getElementById("eclear").onclick=()=>{const b=document.getElementById("eclear");if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Pulsa otra vez para borrar";setTimeout(()=>{b.dataset.confirm="";b.textContent="Borrar"},2500);return}ta.value="";e.text="";e.checks2=[];document.querySelectorAll("input[data-i]").forEach(c=>c.checked=false);upd();save();b.dataset.confirm="";b.textContent="Borrar"};
  // temporizador
  let left=25*60,running=false;
  const tt=document.getElementById("tt"),tbox=document.getElementById("timer"),tb=document.getElementById("tstart");
  const draw=()=>{const m=Math.floor(left/60),s=left%60;tt.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");tbox.classList.toggle("warn",left<=300)};
  tb.onclick=()=>{
    if(running){clearInterval(timerHandle);timerHandle=null;running=false;tb.textContent="Seguir";return}
    running=true;tb.textContent="Pausa";
    timerHandle=setInterval(()=>{left--;draw();if(left<=0){clearInterval(timerHandle);timerHandle=null;running=false;tb.textContent="Tiempo";tt.textContent="00:00"}},1000);
  };
  document.getElementById("treset").onclick=()=>{if(timerHandle)clearInterval(timerHandle);timerHandle=null;running=false;left=25*60;tb.textContent="Empezar";draw()};
  draw();upd();setQ(e.i||0);
}

 rT:0,rWhy:"La objeción señala un riesgo real, pero no basta para negar las oportunidades: solo obliga a usar bien la tecnología.",
 nosirve:"A mí me encanta jugar a videojuegos online con mis amigos los fines de semana.",
 def:"Entendemos por mundo digital el conjunto de redes, plataformas y entornos virtuales en los que hoy transcurre buena parte de nuestra vida.",
 ctx:"Los jóvenes de hoy son la primera generación que ha crecido con una pantalla en la mano, y su identidad se forma dentro y fuera de ella.",
 ruta:"Para mostrarlo, analizaré primero sus efectos en la identidad; después, en las relaciones; y, por último, responderé a quienes solo ven riesgos.",
 sint:"En suma, la realidad virtual abre a los jóvenes posibilidades de expresión y conexión, pero amenaza la autenticidad de su identidad.",
 reaf:"Por eso, el mundo digital no es bueno ni malo en sí: su valor depende de cómo se use.",
 cierre:"¿Sabremos educar a los jóvenes para que la pantalla sea una ventana y no una nueva caverna?",
 nueva:"Además, habría que estudiar cómo afecta el teletrabajo a los adultos mayores de cincuenta años.",
 contradice:"Por eso, el mundo digital solo trae beneficios a los jóvenes y no plantea ningún riesgo."},

{id:"democracia",doc:2,q:"¿Corre peligro la democracia como consecuencia de las redes sociales?",k:["peligro","democracia","redes","sociales"],o:["Corre","consecuencia"],
 dil:"Si las redes sociales fortalecen la democracia al dar voz a todos o si la debilitan con algoritmos y bulos.",
 dilMal:["Qué partidos políticos tienen más seguidores en las redes sociales y cuáles invierten más en publicidad digital.", "Que las redes sociales son hoy, sin ninguna duda, la mayor amenaza para cualquier sistema democrático."],
 tF:"Las redes sociales democratizan la información y dan voz a quienes antes no la tenían.",
 tC:"Las redes sociales ponen en peligro la democracia porque fomentan la polarización y los bulos.",
 tM:"Las redes pueden fortalecer la democracia, siempre que se regulen para frenar la desinformación.",
 tB:"Defenderé que las redes sociales amenazan hoy la democracia, aunque podrían fortalecerla si se regularan adecuadamente.",tT:2,
 tMal:["Las redes sociales son un fenómeno muy interesante que ha cambiado muchas cosas de nuestras vidas.","Más de cinco mil millones de personas usan hoy algún tipo de red social en todo el mundo.","Las redes ponen en peligro la democracia porque son un peligro para la vida democrática."],
 a1:"Los algoritmos crean cámaras de eco que nos aíslan de opiniones distintas y fomentan la polarización.",
 a2:"Las redes son el hábitat ideal de bulos y teorías de la conspiración que manipulan a la opinión pública.",
 a2Mal:["Los algoritmos nos encierran en burbujas donde solo vemos opiniones parecidas a las nuestras y nunca las contrarias.", "Las redes han dado voz a millones de personas que antes no podían participar en el debate público."],
 au:{a1:["Platón","la caverna: el algoritmo nos muestra sombras que tomamos por la realidad"],a2:["Kant","el uso público de la razón exige ciudadanos que piensen por sí mismos y no se dejen tutelar"],c:["Arendt","la política nace de la pluralidad de voces en un espacio común"]},
 contra:"Las redes han democratizado el acceso a la información y han dado voz a grupos tradicionalmente marginados.",
 paja:"Los defensores de las redes creen que todo lo que se publica en internet es verdad.",
 refut:"Pero esa democratización es solo aparente: lo que cada uno ve lo decide un algoritmo diseñado para el negocio, no para el debate.",
 rT:1,rWhy:"La objeción olvida un aspecto clave: quién decide qué voces se escuchan. Por eso es incompleta.",
 nosirve:"Mi tío comparte muchos bulos en el grupo de WhatsApp de la familia.",
 def:"Entendemos por democracia un sistema basado en la libertad de expresión, el pluralismo y la deliberación informada de la ciudadanía.",
 ctx:"Hoy buena parte del debate político se libra en redes sociales, donde un bulo puede llegar a millones de personas en pocas horas.",
 ruta:"Para defenderlo, analizaré primero cómo actúan los algoritmos; después, la difusión de bulos; y, finalmente, responderé a quienes ven en las redes una democratización.",
 sint:"En definitiva, la lógica algorítmica de las redes fomenta la polarización y la desinformación, y eso debilita el debate público.",
 reaf:"Por tanto, la democracia sí corre peligro, salvo que regulemos estas plataformas como cualquier otro ámbito social.",
 cierre:"¿Estamos dispuestos a exigir esa regulación aunque limite nuestra comodidad digital?",
 nueva:"Además, la televisión también influyó mucho en las elecciones del siglo pasado.",
 contradice:"Por tanto, las redes sociales no suponen ningún peligro para la democracia."},

{id:"libertad",doc:3,q:"¿Cómo afectan las redes sociales a la libertad humana?",k:["redes","sociales","libertad"],o:["afectan","humana"],
 dil:"Si las redes amplían nuestra libertad de expresión y pensamiento o si la limitan con presión social y algoritmos.",
 dilMal:["Cuántas personas han sido censuradas o expulsadas de las redes sociales durante el último año en nuestro país.", "Que las redes sociales nos han convertido a todos en esclavos de los «me gusta» y de la aprobación ajena."],
 tF:"Las redes sociales amplían la libertad de expresión y de pensamiento de millones de personas.",
 tC:"Las redes sociales reducen nuestra autonomía con la presión social y los algoritmos.",
 tM:"Las redes amplían nuestra libertad solo si las usamos de forma crítica y consciente.",
 tB:"Defenderé que las redes, aunque favorecen la libertad de expresión, limitan seriamente nuestra autonomía.",tT:2,
 tMal:["La libertad es un concepto filosófico del que han hablado muchísimos autores a lo largo de la historia.","Instagram se creó en 2010 y TikTok se hizo popular en todo el mundo a partir de 2018.","Las redes afectan a la libertad porque influyen en lo libres que somos cuando las usamos."],
 a1:"La necesidad de «me gusta» y la presión social producen conformidad y autocensura.",
 a2:"Los algoritmos nos encierran en burbujas informativas y deciden por nosotros qué vemos.",
 a2Mal:["La búsqueda de aprobación en las redes hace que callemos lo que de verdad pensamos para no perder seguidores.", "Las redes han permitido a muchas minorías expresarse con libertad y hacer visibles sus problemas."],
 au:{a1:["Kant","la autonomía exige pensar por uno mismo, sin tutelas ajenas"],a2:["Platón","la caverna moderna: el mundo real se oculta tras las sombras digitales"],c:["Locke","la libertad natural de cada individuo debe ser protegida por la sociedad"]},
 contra:"Las redes han sacado del ostracismo a millones de personas y les permiten expresarse con libertad.",
 paja:"Quienes defienden las redes dicen que en internet se puede insultar a quien uno quiera.",
 refut:"Pero poder hablar no basta para ser libres: si lo que pensamos depende de la aprobación ajena y de un algoritmo, nuestra autonomía se recorta.",
 rT:0,rWhy:"La objeción tiene parte de razón (hay más expresión), pero no basta: expresarse no garantiza pensar con autonomía.",
 nosirve:"Yo tengo tres cuentas de Instagram y casi nunca publico nada.",
 def:"Por libertad entendemos la capacidad de pensar, elegir y expresarse por uno mismo, sin coacciones externas.",
 ctx:"Pasamos varias horas al día en redes que prometen libertad total, pero que miden y premian cada cosa que decimos.",
 ruta:"Para ello, mostraré primero el efecto de la presión social; después, el de los algoritmos; y, finalmente, responderé a quienes solo ven en las redes libertad de expresión.",
 sint:"En resumen, las redes nos permiten expresarnos, pero la tiranía de los «me gusta» y los algoritmos limita lo que pensamos y vemos.",
 reaf:"Por eso, su impacto en la libertad humana es más negativo de lo que parece.",
 cierre:"¿Somos nosotros quienes usamos las redes, o son ellas las que nos usan a nosotros?",
 nueva:"También habría que analizar el impacto de la publicidad en televisión sobre los niños.",
 contradice:"Por eso, las redes sociales solo aumentan nuestra libertad y no la limitan en nada."},

{id:"tiktok",doc:4,q:"¿Son las redes sociales como TikTok o Instagram fuentes válidas de conocimiento?",k:["fuentes","válidas","conocimiento"],o:["redes","sociales","TikTok","Instagram"],
 dil:"Si los contenidos de TikTok o Instagram pueden considerarse conocimiento o si solo transmiten información sin garantías.",
 dilMal:["Qué tipo de vídeos tienen más visualizaciones en TikTok e Instagram entre los adolescentes de nuestro país.", "Que todo lo que aparece en TikTok o Instagram es falso y no sirve absolutamente para nada a quien lo ve."],
 tF:"TikTok e Instagram democratizan el saber y pueden ser fuentes válidas de conocimiento.",
 tC:"TikTok e Instagram no son fuentes válidas de conocimiento por su falta de verificación y su lógica viral.",
 tM:"Estas plataformas no dan conocimiento en sentido clásico, aunque sí cierto «saber hacer» con valor propio.",
 tB:"Defenderé que, aunque tengan valor en otros sentidos, TikTok e Instagram distan mucho de ser fuentes válidas de conocimiento.",tT:1,
 tMal:["TikTok e Instagram son plataformas muy populares de las que se habla mucho hoy en día.","TikTok pertenece a una empresa china e Instagram, a Meta, la empresa de Facebook.","No son fuentes válidas de conocimiento porque lo que dicen no vale como conocimiento."],
 a1:"El conocimiento es creencia verdadera justificada, y estos contenidos son fugaces y carecen de verificación.",
 a2:"Su lógica algorítmica premia lo viral y no lo veraz, y difunde bulos con enorme facilidad.",
 a2Mal:["Lo que se publica en estas redes es efímero y nadie comprueba si es verdad antes de difundirlo masivamente.", "Cualquiera puede informarse y participar en los debates que surgen en estas plataformas, sin intermediarios."],
 au:{a1:["Platón","el conocimiento (episteme) exige justificación; lo demás es mera opinión (doxa)"],a2:["Descartes","solo debemos aceptar como verdadero lo que se presenta con evidencia"],c:["Nietzsche","todo conocimiento es interpretación desde una perspectiva"]},
 contra:"Con conceptos como el de «conocimiento tácito», estos contenidos serían una forma valiosa de saber hacer.",
 paja:"Los defensores de TikTok creen que un vídeo de quince segundos sustituye a una carrera universitaria.",
 refut:"Pero ese «saber hacer» no vuelve fiable lo que se transmite: sin verificación, no distingue lo verdadero de lo falso, que es lo que define al conocimiento.",
 rT:1,rWhy:"La objeción olvida la verdad y la justificación, que son lo esencial del conocimiento: por eso es incompleta.",
 nosirve:"Una vez aprendí a hacer una tortilla de patatas viendo un vídeo de TikTok.",
 def:"Llamamos conocimiento a una creencia verdadera y justificada, y fuente válida a la que ofrece garantías de esa verdad.",
 ctx:"Muchos jóvenes se informan hoy antes en TikTok o Instagram que en un periódico o en un libro.",
 ruta:"Para ello, examinaré primero la definición clásica de conocimiento; después, la lógica de los algoritmos; y, por último, responderé a quienes los ven como un nuevo tipo de saber.",
 sint:"En conclusión, la fugacidad, la falta de verificadores y la lógica viral impiden que estos contenidos cumplan las condiciones del conocimiento.",
 reaf:"Por eso, TikTok e Instagram no pueden considerarse fuentes válidas de conocimiento.",
 cierre:"¿No estaremos confundiendo estar entretenidos con estar informados?",
 nueva:"Además, los libros de texto también contienen a veces erratas.",
 contradice:"Por eso, TikTok e Instagram son hoy las fuentes de conocimiento más fiables que existen."},

{id:"universales",doc:5,q:"¿Sigue teniendo sentido hablar de verdades o valores universales en un mundo cada vez más diverso y plural?",k:["verdades","valores","universales","diverso","plural"],o:["sentido","mundo"],
 dil:"Si la diversidad cultural obliga a renunciar a verdades y valores comunes o si, al contrario, los hace más necesarios.",
 dilMal:["Cuántas culturas, lenguas y religiones distintas conviven hoy en las grandes ciudades europeas y americanas.", "Que todas las opiniones valen exactamente lo mismo, porque cada cultura tiene su propia verdad indiscutible."],
 tF:"En un mundo plural sigue siendo necesario defender verdades y valores universales.",
 tC:"En un mundo diverso no hay verdades universales: cada cultura tiene las suyas.",
 tM:"Hay valores universales, pero deben reconocerse sin anular la diversidad de cada cultura.",
 tB:"Defenderé que en un mundo diverso y plural sigue teniendo sentido, e incluso más que nunca, hablar de valores universales.",tT:0,
 tMal:["La diversidad es algo muy bonito que enriquece nuestras sociedades y que todos deberíamos valorar.","La Declaración Universal de los Derechos Humanos se aprobó en París en el año 1948.","Tiene sentido hablar de valores universales porque son valores que tienen sentido en todo el mundo."],
 a1:"No todas las opiniones tienen el mismo valor ni todas las informaciones la misma veracidad.",
 a2:"La democracia exige proteger a las minorías, es decir, respetar unos derechos humanos comunes.",
 a2Mal:["Una opinión infundada no vale lo mismo que una información verdadera, contrastada y respaldada por pruebas.", "Las redes crean cámaras de eco que refuerzan nuestras creencias previas y nos aíslan de los demás."],
 au:{a1:["Platón","frente al relativismo de los sofistas, hay una verdad que no depende de la opinión"],a2:["Kant","la dignidad de cada persona es un valor universal, no un precio"],c:["Nietzsche","no hay valores absolutos: los valores son creaciones humanas"]},
 contra:"El relativismo parece la postura más respetuosa: si cada cultura tiene su verdad, nadie impone la suya.",
 paja:"Los defensores de los valores universales quieren que todo el mundo piense exactamente igual.",
 refut:"Pero el relativismo se contradice: si todo vale lo mismo, también vale la intolerancia, y el propio respeto deja de ser un valor.",
 rT:2,rWhy:"La objeción se contradice: defiende el respeto como valor para todos mientras niega que existan valores para todos.",
 nosirve:"En mi clase hay compañeros de cinco países distintos y nos llevamos muy bien.",
 def:"Por valores universales entendemos los principios válidos para todos los seres humanos, con independencia de su cultura.",
 ctx:"Las redes y la globalización han multiplicado las voces y las culturas que participan en el debate público.",
 ruta:"Para defenderlo, mostraré primero por qué no todas las opiniones valen lo mismo; después, qué exige la democracia; y, finalmente, responderé al relativismo.",
 sint:"En definitiva, sin verdades comunes el debate se degrada y la democracia pierde la protección de las minorías.",
 reaf:"Por eso, en un mundo plural los valores universales tienen más sentido que en ningún otro.",
 cierre:"El reto será combinar el respeto a las diferencias con la defensa de lo que nos une a todos.",
 nueva:"Además, el turismo masivo está cambiando el centro de muchas ciudades.",
 contradice:"Por eso, en un mundo diverso ya no tiene sentido hablar de valores universales."},

{id:"educacion",doc:6,q:"¿Qué importancia tiene la educación en la formación de una ciudadanía responsable en las sociedades actuales?",k:["educación","ciudadanía","responsable"],o:["importancia","formación","sociedades","actuales"],
 dil:"Si la educación es la base de una ciudadanía crítica y responsable o si ese papel lo cumplen hoy otros medios.",
 dilMal:["Cuántos años de escolarización obligatoria hay en los distintos países europeos y cuánto dinero invierten en ella.", "Que sin educación no puede existir ninguna sociedad justa ni democrática en ningún lugar del mundo."],
 tF:"La educación es el pilar básico para formar ciudadanos críticos y responsables.",
 tC:"La educación formal ha perdido importancia: hoy los ciudadanos se forman en internet.",
 tM:"La educación es decisiva, siempre que enseñe a pensar y no solo a acumular conocimientos.",
 tB:"Defenderé que la educación se ha convertido en el pilar básico de la cohesión democrática y del bien común.",tT:0,
 tMal:["La educación es un tema del que todo el mundo opina porque todos hemos pasado por la escuela.","En España, la educación es obligatoria desde los seis hasta los dieciséis años de edad.","La educación es importante para la ciudadanía porque tiene mucha importancia para los ciudadanos."],
 a1:"La educación crítica permite distinguir hechos de opiniones y reconocer bulos y falacias.",
 a2:"Educar en el diálogo y en el respeto a lo diferente frena la polarización y el fanatismo.",
 a2Mal:["Una buena educación enseña a detectar noticias falsas, a contrastar fuentes y a no dejarse engañar fácilmente.", "Las redes sociales informan a los jóvenes de lo que pasa en el mundo mucho más rápido que la escuela."],
 au:{a1:["Kant","la Ilustración es la salida de la minoría de edad: atreverse a pensar por uno mismo"],a2:["Platón","la educación forma ciudadanos justos y gobernantes sabios"],c:null},
 contra:"Hoy la información está al alcance de todos en internet, así que la escuela ya no es imprescindible.",
 paja:"Los críticos de la escuela quieren cerrar todos los institutos y que nadie estudie.",
 refut:"Pero tener información no es saber usarla: sin una educación crítica, internet se convierte en una cámara de eco llena de bulos.",
 rT:1,rWhy:"La objeción confunde información con formación y olvida que hace falta criterio para usarla: por eso es incompleta.",
 nosirve:"Mi profesora de Historia es la que mejor explica de todo el instituto.",
 def:"Una ciudadanía responsable es la que participa en la vida común con espíritu crítico y respeto a los derechos de todos.",
 ctx:"En el siglo XXI, marcado por la globalización y la desinformación, la educación ya no puede entenderse solo como acumular conocimientos.",
 ruta:"Para ello, mostraré primero su papel frente a la desinformación; después, frente a la polarización; y, finalmente, responderé a quienes creen que internet puede sustituirla.",
 sint:"En resumen, la educación crítica nos protege frente a los bulos y forma ciudadanos capaces de dialogar y respetar la diversidad.",
 reaf:"Por eso, es fundamental para una ciudadanía responsable: donde se descuida, aparecen el autoritarismo y el individualismo.",
 cierre:"No podemos permitir que las redes sociales ocupen el lugar de las aulas.",
 nueva:"Además, sería bueno que los institutos tuvieran mejores instalaciones deportivas.",
 contradice:"Por eso, la educación tiene hoy muy poca importancia en la formación de los ciudadanos."},

{id:"filoprogreso",doc:7,q:"¿Contribuye la filosofía al progreso de la humanidad?",k:["filosofía","progreso","humanidad"],o:["Contribuye"],
 dil:"Si la filosofía impulsa el progreso humano o si es un saber abstracto que no aporta nada práctico.",
 dilMal:["Cuántos filósofos importantes ha habido a lo largo de la historia de Occidente y en qué siglos vivieron.", "Que la filosofía es el saber más útil de todos y que sin ella no existirían ni la ciencia ni la técnica."],
 tF:"La filosofía ha contribuido de forma decisiva al progreso político, ético y científico.",
 tC:"La filosofía es un saber abstracto e inútil que no contribuye al progreso real.",
 tM:"La filosofía no produce avances técnicos, pero orienta hacia dónde debe ir el progreso.",
 tB:"Defenderé que la aportación de la filosofía al progreso es profunda, porque el progreso no es solo técnico.",tT:0,
 tMal:["La filosofía es una asignatura que se estudia en bachillerato y que a algunos les gusta mucho.","La palabra «filosofía» procede del griego y significa «amor a la sabiduría».","La filosofía contribuye al progreso porque el progreso se ve impulsado por la filosofía."],
 a1:"La filosofía sentó las bases de la democracia, de los derechos humanos y del contrato social.",
 a2:"Su función crítica evita el conformismo y el dogmatismo, y solo una sociedad que se cuestiona progresa.",
 a2Mal:["Las ideas de los filósofos ilustrados sobre los derechos y el contrato social están en el origen de nuestras democracias.", "La filosofía no sirve para fabricar vacunas ni para generar riqueza, como sí hacen la ciencia y la técnica."],
 au:{a1:["Locke","el contrato social y los derechos naturales son la base del liberalismo"],a2:["Sócrates","una vida sin examen no merece ser vivida"],c:null},
 contra:"La filosofía no sirve para fabricar vacunas ni para generar riqueza, así que no aporta progreso real.",
 paja:"Los críticos de la filosofía dicen que los filósofos son unos vagos que no trabajan.",
 refut:"Pero esa objeción reduce el progreso a lo técnico: la libertad, la justicia y los derechos humanos también son progreso, y nacen del pensamiento.",
 rT:1,rWhy:"La objeción solo tiene en cuenta el progreso técnico y olvida el moral y el político: por eso es incompleta.",
 nosirve:"Mi hermano estudió Filosofía en la universidad y ahora trabaja en una editorial.",
 def:"Entendemos por progreso la mejora de la vida humana, no solo en lo técnico, sino también en libertad y justicia.",
 ctx:"En una época que valora sobre todo lo útil y lo rentable, la filosofía se cuestiona a menudo por abstracta.",
 ruta:"Para defenderlo, mostraré primero sus aportaciones históricas; después, su función crítica; y, finalmente, responderé a quienes la consideran inútil.",
 sint:"En definitiva, la filosofía ha fundado sistemas políticos y éticos y mantiene viva la actitud crítica que permite corregir el rumbo.",
 reaf:"Por eso, la filosofía sí contribuye al progreso de la humanidad.",
 cierre:"Sin filosofía, el progreso corre el riesgo de ser solo técnico; con ella, puede ser también justo.",
 nueva:"Además, la economía de los países depende mucho del precio de la energía.",
 contradice:"Por eso, la filosofía no contribuye en nada al progreso de la humanidad."},

{id:"iaimplica",doc:8,q:"¿Qué implicaciones epistemológicas o ético-políticas tiene la proliferación del uso de la inteligencia artificial en cada vez más ámbitos de nuestra vida?",k:["epistemológicas","ético-políticas","inteligencia","artificial"],o:["implicaciones","proliferación","ámbitos"],
 dil:"Si la inteligencia artificial mejora nuestro conocimiento y nuestras decisiones o si amenaza la comprensión y la libertad.",
 dilMal:["Qué empresas tecnológicas han desarrollado los sistemas de inteligencia artificial más potentes del mundo.", "Que la inteligencia artificial acabará sustituyendo por completo a los seres humanos en todos los ámbitos."],
 tF:"La inteligencia artificial amplía nuestro conocimiento y mejora la eficacia de nuestras decisiones.",
 tC:"La inteligencia artificial amenaza la comprensión humana, la igualdad y la libertad política.",
 tM:"La IA es valiosa siempre que un marco ético garantice su transparencia y su responsabilidad.",
 tB:"Defenderé que la IA, pese a su eficacia, no es neutral y puede convertirse en una herramienta de control si no se regula.",tT:2,
 tMal:["La inteligencia artificial es un tema muy actual del que se habla constantemente en los medios.","El término «inteligencia artificial» se acuñó en una conferencia celebrada en 1956.","La IA tiene implicaciones éticas porque implica cuestiones de tipo ético para todos."],
 a1:"Los algoritmos dan resultados eficaces sin explicar cómo llegan a ellos: es conocimiento sin comprensión.",
 a2:"El control masivo de datos da a empresas y gobiernos un poder de vigilancia que debilita la libertad política.",
 a2Mal:["La opacidad algorítmica nos ofrece respuestas muy precisas que, sin embargo, nadie sabe explicar ni justificar.", "La IA procesa en segundos cantidades de datos que ningún ser humano podría analizar en toda su vida."],
 au:{a1:["Descartes","solo es conocimiento lo que comprendemos con claridad y distinción"],a2:["Arendt","el totalitarismo aspira a controlar por completo la vida de las personas"],c:null},
 contra:"La IA tiene un enorme potencial de eficiencia e innovación que puede mejorar mucho nuestra vida.",
 paja:"Los defensores de la IA creen que las máquinas nunca se equivocan y deben gobernarnos.",
 refut:"Pero la eficacia no responde a la pregunta clave: ¿quién responde de los errores y sesgos de un algoritmo? Sin transparencia, la eficacia puede volverse control.",
 rT:0,rWhy:"La objeción es cierta (la IA es eficaz), pero no basta para anular sus riesgos éticos y políticos: es insuficiente.",
 nosirve:"Ayer usé una aplicación de IA para que me resumiera un libro de lectura.",
 def:"Por inteligencia artificial entendemos los sistemas que procesan datos y toman decisiones que antes requerían inteligencia humana.",
 ctx:"La IA ya decide qué noticias vemos, quién recibe un crédito o qué diagnóstico se propone a un paciente.",
 ruta:"Para ello, analizaré primero sus implicaciones epistemológicas; después, las ético-políticas; y, finalmente, responderé a quienes solo ven en ella eficiencia.",
 sint:"En suma, la IA produce conocimiento sin comprensión y concentra un poder de vigilancia sin precedentes.",
 reaf:"Por eso, el debate sobre la IA debe ser ético y no solo técnico.",
 cierre:"¿Quién responderá ante las decisiones injustas tomadas por un algoritmo?",
 nueva:"Además, los coches eléctricos también están transformando la industria del automóvil.",
 contradice:"Por eso, la IA es una herramienta neutral que no plantea ningún problema ético."},

{id:"filodesafios",doc:9,q:"¿Hasta qué punto necesitamos de la filosofía para comprender y abordar los grandes desafíos de la humanidad en nuestro tiempo?",k:["filosofía","desafíos"],o:["necesitamos","comprender","abordar","humanidad"],
 dil:"Si los grandes desafíos actuales pueden resolverse solo con ciencia y tecnología o si también necesitan reflexión filosófica.",
 dilMal:["Cuáles son los principales desafíos globales que señala la ONU para la próxima década y cómo se miden.", "Que la filosofía es más importante que la ciencia para resolver cualquier problema de la humanidad."],
 tF:"La filosofía es necesaria para comprender y orientar las respuestas a los desafíos actuales.",
 tC:"Los desafíos actuales son técnicos y se resuelven con ciencia, no con filosofía.",
 tM:"La ciencia aporta soluciones, pero solo la filosofía pregunta para qué y por qué las aplicamos.",
 tB:"Defenderé que un enfoque filosófico es una necesidad práctica para comprender y abordar los desafíos de nuestro tiempo.",tT:0,
 tMal:["Los desafíos de la humanidad son muchos y muy complejos, y la filosofía tiene mucho que decir.","El cambio climático es uno de los mayores desafíos actuales y preocupa a millones de personas.","Necesitamos la filosofía porque la filosofía es algo que necesitamos para casi todo."],
 a1:"Frente al cambio climático no basta reducir emisiones: hay que repensar nuestra idea de progreso y de consumo.",
 a2:"Medir la desigualdad solo con la renta es engañoso; hay que preguntarse qué pueden hacer y ser las personas.",
 a2Mal:["Combatir el cambio climático exige preguntarse si un crecimiento económico ilimitado es realmente sostenible.", "La ciencia y la tecnología ofrecen soluciones rápidas y comprobables a muchos problemas globales."],
 au:{a1:["Aristóteles","la prudencia delibera sobre los fines, no solo sobre los medios"],a2:["Kant","cada persona es un fin en sí misma y no un simple medio o una cifra"],c:null},
 contra:"Ante los grandes problemas recurrimos a la ciencia y la tecnología, que dan soluciones inmediatas y comprobables.",
 paja:"Los críticos de la filosofía creen que los filósofos quieren sustituir a los médicos y a los ingenieros.",
 refut:"Pero saber cómo actuar no dice por qué ni para qué actuar: la ciencia ofrece los medios, y la filosofía ayuda a elegir los fines.",
 rT:0,rWhy:"La objeción acierta en que la ciencia es necesaria, pero no basta: los fines no los decide la ciencia. Por eso es insuficiente.",
 nosirve:"En mi pueblo cada vez llueve menos y hace más calor en verano.",
 def:"Llamamos grandes desafíos a problemas globales como el cambio climático, la desinformación o la desigualdad extrema.",
 ctx:"Todos estos desafíos tienen algo en común: exigen cooperación global, una mirada a largo plazo y compromiso entre generaciones.",
 ruta:"Para defenderlo, mostraré primero los límites de las soluciones solo técnicas; después, un ejemplo concreto; y, finalmente, responderé a quienes confían solo en la ciencia.",
 sint:"En conclusión, la ciencia nos dice cómo actuar, pero la filosofía nos obliga a preguntarnos por qué y para qué.",
 reaf:"Por eso, la filosofía no es un saber obsoleto, sino una necesidad práctica.",
 cierre:"La filosofía puede ser la brújula que nos permita afrontar estos desafíos de forma plenamente humana.",
 nueva:"Además, la exploración espacial podría abrir nuevas fuentes de minerales.",
 contradice:"Por eso, la filosofía no sirve para afrontar ninguno de los desafíos actuales."},

{id:"conflicto",doc:10,q:"¿Contribuye el conflicto al avance en el conocimiento y el progreso de la sociedad?",k:["conflicto","conocimiento","progreso","sociedad"],o:["Contribuye","avance"],
 dil:"Si el choque de ideas e intereses hace avanzar el saber y la sociedad o si, al contrario, los frena.",
 dilMal:["Qué guerras y revoluciones han marcado la historia de la humanidad desde la Antigüedad hasta nuestros días.", "Que el conflicto es siempre negativo para la convivencia y para el progreso de cualquier sociedad humana."],
 tF:"El conflicto es condición necesaria del avance del conocimiento y del progreso social.",
 tC:"El progreso nace de la cooperación y el consenso; el conflicto solo genera destrucción.",
 tM:"El conflicto hace avanzar el saber y la sociedad siempre que se resuelva con argumentos y no con violencia.",
 tB:"Defenderé que el conocimiento y la sociedad no avanzan en la conformidad, sino en la duda y la confrontación.",tT:0,
 tMal:["El conflicto es un tema muy interesante del que se ha hablado mucho en la historia de la filosofía.","Hay muchos conflictos en el mundo actual, como las guerras, que frenan el progreso de los pueblos.","El conflicto contribuye al avance porque gracias al conflicto se producen muchos avances."],
 a1:"Las revoluciones científicas, de Copérnico a Darwin, nacieron del enfrentamiento con las ideas vigentes.",
 a2:"Los grandes cambios sociales, como la Revolución francesa, convirtieron a súbditos en ciudadanos mediante el conflicto.",
 a2Mal:["El heliocentrismo y el evolucionismo triunfaron precisamente al chocar con las teorías aceptadas en su tiempo.", "El conflicto puede degenerar en violencia y destruir en poco tiempo lo que una sociedad había construido."],
 au:{a1:["Sócrates","el diálogo que pone a prueba las opiniones acerca a la verdad"],a2:["Marx","la lucha de clases es el motor de la historia"],c:["Arendt","la política es acción concertada entre iguales, no violencia"]},
 contra:"El conflicto puede degenerar en violencia y destruir lo que una sociedad había construido.",
 paja:"Los críticos del conflicto dicen que nunca hay que discutir con nadie.",
 refut:"Pero que algunos conflictos sean destructivos no prueba que frenen el progreso: casi todos los avances han exigido enfrentarse a lo establecido.",
 rT:0,rWhy:"La objeción señala un riesgo real, pero no basta para negar que el conflicto impulse el progreso: es insuficiente.",
 nosirve:"Me encanta discutir de política con mis amigos aunque nunca nos pongamos de acuerdo.",
 def:"Entendemos por conflicto la oposición entre ideas, intereses o grupos, y por progreso, la mejora del conocimiento y de la vida en común.",
 ctx:"Resulta paradójico que, en una época en la que todo se discute en redes, el debate parezca polarizarnos más que hacernos avanzar.",
 ruta:"Para defenderlo, analizaré primero el avance científico; después, el progreso social; y, finalmente, responderé a quienes ven en el conflicto solo destrucción.",
 sint:"En definitiva, tanto las revoluciones científicas como los grandes cambios sociales se han producido a través del conflicto.",
 reaf:"Por tanto, el conflicto, entre ideas o entre oprimidos y opresores, es motor del conocimiento y del progreso.",
 cierre:"¿Sabremos canalizar nuestros conflictos actuales mediante razones y no mediante la violencia?",
 nueva:"Además, los avances médicos han aumentado mucho la esperanza de vida.",
 contradice:"Por tanto, el conflicto no contribuye en nada al avance del conocimiento ni de la sociedad."},

{id:"pluralismo",doc:11,q:"¿Es el pluralismo un obstáculo o una condición imprescindible para la verdad y la justicia?",k:["pluralismo","verdad","justicia"],o:["obstáculo","condición","imprescindible"],
 dil:"Si la coexistencia de muchas opiniones nos acerca a la verdad y la justicia o si, al contrario, las vuelve imposibles.",
 dilMal:["Cuántos partidos políticos distintos tienen hoy representación en el Parlamento y en los gobiernos autonómicos.", "Que el pluralismo es la única condición necesaria para que exista la justicia en una sociedad."],
 tF:"El pluralismo es una condición imprescindible para buscar la verdad y construir la justicia.",
 tC:"El pluralismo es un obstáculo: con tantas opiniones enfrentadas es imposible llegar a la verdad.",
 tM:"El pluralismo favorece la verdad y la justicia, siempre que comparta unos criterios comunes básicos.",
 tB:"Defenderé que el pluralismo no es un obstáculo, sino una condición imprescindible para la verdad y la justicia.",tT:0,
 tMal:["Vivimos en una sociedad muy plural, con personas de muchas ideologías, culturas y creencias.","El término «pluralismo» procede del latín «plures», que significa «muchos».","El pluralismo es imprescindible porque no se puede prescindir de él para nada."],
 a1:"El contraste de ideas diferentes permite detectar errores y evita el dogmatismo.",
 a2:"Reconocer la diversidad de valores promueve el respeto, la participación y la convivencia democrática.",
 a2Mal:["Cuando se aceptan opiniones diversas es más fácil cuestionar las creencias infundadas que todos daban por buenas.", "Las redes crean cámaras de eco que fomentan la polarización y el enfrentamiento entre grupos."],
 au:{a1:["Ortega","la verdad integral se alcanza integrando perspectivas distintas"],a2:["Arendt","la política nace de la pluralidad, en el espacio entre los hombres"],c:["Platón","la mayoría opina sin saber: la opinión (doxa) no es ciencia (episteme)"]},
 contra:"Las redes sociales han convertido la diversidad de opiniones en polarización, cámaras de eco y bulos.",
 paja:"Los defensores del pluralismo creen que cualquier opinión, por absurda que sea, vale tanto como la ciencia.",
 refut:"Pero esos problemas no nacen del pluralismo, sino de la falta de regulación de las redes: se confunde la diversidad con su manipulación.",
 rT:1,rWhy:"La objeción olvida la verdadera causa del problema, la falta de regulación de las redes: por eso es incompleta.",
 nosirve:"En mi familia cada uno vota a un partido distinto y en Navidad siempre discutimos.",
 def:"Entendemos por pluralismo la coexistencia de múltiples opiniones, valores y formas de vida en una misma sociedad.",
 ctx:"Nunca habían convivido tantas voces en el debate público como en la era de las redes sociales.",
 ruta:"Para defenderlo, mostraré primero su relación con la verdad; después, con la justicia; y, finalmente, responderé a quienes lo culpan de la polarización.",
 sint:"En conclusión, el pluralismo evita el dogmatismo y hace posible una convivencia más justa.",
 reaf:"Por eso, es una condición imprescindible para la verdad y la justicia, siempre que compartamos unos criterios básicos.",
 cierre:"El reto es que la diversidad de voces no se convierta en un ruido en el que ya nadie escucha.",
 nueva:"Además, cada vez más personas viven solas en las grandes ciudades.",
 contradice:"Por eso, el pluralismo es el principal obstáculo para alcanzar la verdad y la justicia."},

{id:"iareflexion",doc:12,q:"¿En qué sentido condiciona la inteligencia artificial nuestra capacidad de reflexión?",k:["condiciona","inteligencia","artificial","reflexión"],o:["capacidad"],
 dil:"Si la inteligencia artificial amplía nuestra capacidad de pensar por nosotros mismos o si la debilita.",
 dilMal:["Cuántas personas usan a diario asistentes de inteligencia artificial en el trabajo, en casa o en los estudios.", "Que la inteligencia artificial nos está volviendo a todos incapaces de pensar por nosotros mismos."],
 tF:"La IA favorece la reflexión al darnos acceso rápido a información y a perspectivas diversas.",
 tC:"La IA debilita nuestra capacidad de reflexión porque nos acostumbra a que otros piensen por nosotros.",
 tM:"La IA amplía o debilita nuestra reflexión según el uso que hagamos de ella.",
 tB:"Defenderé que la IA no es una amenaza inevitable para la reflexión: sus efectos dependen del uso que hagamos de ella.",tT:2,
 tMal:["La inteligencia artificial es un invento muy reciente que ha cambiado la forma de estudiar.","ChatGPT alcanzó cien millones de usuarios apenas dos meses después de su lanzamiento.","La IA condiciona la reflexión porque nuestra reflexión está condicionada por la IA."],
 a1:"Un uso adecuado de la IA ahorra tiempo en buscar datos y nos permite dedicarlo a analizarlos.",
 a2:"Si delegamos en ella todo el esfuerzo intelectual, la reflexión se convierte en recepción pasiva.",
 a2Mal:["La IA nos ofrece en pocos segundos información que antes tardábamos horas o días en encontrar.", "La IA es muy útil para traducir textos, para resumir documentos largos y para organizar el trabajo."],
 au:{a1:["Sócrates","contrastar distintos puntos de vista estimula el pensamiento"],a2:["Kant","la minoría de edad: preferir que otros piensen por nosotros"],c:["Arendt","pensar es un diálogo silencioso conmigo mismo que nadie puede hacer por mí"]},
 contra:"La IA nunca es neutral: reproduce sesgos y errores, y confiar en ella nos lleva a interpretaciones equivocadas.",
 paja:"Los defensores de la IA creen que deberíamos dejar de estudiar porque las máquinas ya lo saben todo.",
 refut:"Pero eso refuerza la tesis en lugar de negarla: precisamente porque la IA tiene sesgos, el problema está en usarla sin espíritu crítico.",
 rT:0,rWhy:"La objeción describe un riesgo real, pero no prueba que la IA dañe siempre la reflexión: solo exige usarla con criterio. Es insuficiente.",
 nosirve:"Mi primo usa la IA para que le haga los deberes de Matemáticas.",
 def:"Por capacidad de reflexión entendemos la habilidad de pensar por uno mismo, analizar y juzgar con criterio propio.",
 ctx:"Cada vez más personas recurren a sistemas que responden preguntas, redactan textos y toman decisiones por ellas.",
 ruta:"Para defenderlo, mostraré primero cómo puede favorecer la reflexión; después, cómo puede debilitarla; y, finalmente, responderé a quienes la consideran siempre peligrosa.",
 sint:"En definitiva, la IA transforma nuestro acceso al conocimiento: puede ampliar el pensamiento o sustituirlo.",
 reaf:"Por eso, su efecto sobre la reflexión depende del uso que hagamos de ella.",
 cierre:"Atreverse a pensar por uno mismo sigue siendo, también con la IA, la tarea de cada uno.",
 nueva:"Además, los videojuegos también pueden mejorar la capacidad de atención.",
 contradice:"Por eso, la IA destruye siempre nuestra capacidad de reflexión, la usemos como la usemos."},

{id:"realidad",q:"¿Podemos conocer la realidad tal como es?",k:["conocer","realidad"],o:["Podemos","es?"],
 dil:"Si la razón puede captar la realidad tal como es o si solo conocemos interpretaciones o perspectivas de ella.",
 dilMal:["Qué instrumentos utiliza la ciencia actual para observar el universo, la materia y las partículas más pequeñas.", "Que nunca podremos conocer nada con certeza absoluta, porque los sentidos y la razón siempre nos engañan."],
 tF:"La razón puede conocer la realidad tal como es si sigue un método riguroso.",
 tC:"No conocemos la realidad, solo interpretaciones: no hay hechos, solo perspectivas.",
 tM:"Conocemos la realidad, pero siempre desde una perspectiva, sin que eso la vuelva falsa.",
 tB:"Defenderé que conocemos la realidad, pero siempre desde un punto de vista, y que cada perspectiva capta una parte de ella.",tT:2,
 tMal:["La realidad es algo muy complejo que ha preocupado a los filósofos desde la Antigua Grecia.","Parménides y Heráclito fueron los primeros en preguntarse por el ser y el cambio.","Podemos conocer la realidad porque la realidad es algo que podemos conocer."],
 a1:"Dos personas que miran un paisaje desde lugares distintos ven cosas distintas, y ambas ven algo real.",
 a2:"Un conocimiento desde ningún lugar es imposible: todo sujeto conoce desde su vida y su circunstancia.",
 a2Mal:["Cada observador capta una parte distinta del mismo paisaje, y ninguna de esas partes es falsa ni ilusoria.", "La razón puede alcanzar verdades universales y necesarias por deducción, sin depender de ningún punto de vista."],
 au:{a1:["Ortega","la perspectiva no deforma la realidad, sino que la organiza"],a2:["Nietzsche","todo conocer está atravesado por los impulsos y la perspectiva de quien conoce"],c:["Descartes","la razón, con un método seguro, alcanza verdades indudables"]},
 contra:"La ciencia y las matemáticas alcanzan verdades universales que no dependen del punto de vista de nadie.",
 paja:"Los defensores de las perspectivas creen que cualquier opinión es tan verdadera como otra.",
 refut:"Pero incluso la ciencia elige qué observar, con qué instrumentos y desde qué teoría: su verdad también se alcanza desde un punto de vista.",
 rT:1,rWhy:"La objeción olvida que la ciencia también parte de un punto de vista (teorías, instrumentos): es incompleta.",
 nosirve:"Me gustan mucho las películas que juegan con la realidad, como Matrix.",
 def:"Conocer la realidad tal como es significaría captarla sin ninguna deformación, desde ningún punto de vista particular.",
 ctx:"En la era de las imágenes retocadas y la IA, cada vez nos cuesta más distinguir lo real de lo fabricado.",
 ruta:"Para ello, mostraré primero el ejemplo del paisaje; después, por qué no hay conocimiento sin perspectiva; y, finalmente, responderé a quienes defienden una verdad absoluta.",
 sint:"En suma, no existe un conocimiento desde ningún lugar, pero las perspectivas no son deformaciones, sino partes de la verdad.",
 reaf:"Por eso, podemos conocer la realidad, aunque nunca de una vez y desde un solo punto de vista.",
 cierre:"Quizá la verdad completa solo se alcance escuchando lo que ven los demás.",
 nueva:"Además, la física cuántica ha descubierto partículas muy extrañas.",
 contradice:"Por eso, no podemos conocer nada de la realidad: todo es pura ilusión."},

{id:"sentidos",q:"¿Son fiables los sentidos para conocer?",k:["fiables","sentidos","conocer?"],o:[],
 dil:"Si la experiencia es una fuente segura de conocimiento o si puede engañarnos y necesitamos la razón.",
 dilMal:["Cuántos sentidos tiene el ser humano y cómo transmiten la información al cerebro a través de los nervios.", "Que los sentidos nos engañan siempre y que solo podemos fiarnos de lo que nos dice la razón."],
 tF:"Los sentidos son la fuente de todo nuestro conocimiento y merecen nuestra confianza.",
 tC:"Los sentidos nos engañan; solo la razón ofrece un conocimiento seguro.",
 tM:"Los sentidos son un punto de partida imprescindible, pero necesitan ser corregidos por la razón.",
 tB:"Defenderé que los sentidos son necesarios para conocer, pero insuficientes si la razón no corrige sus errores.",tT:2,
 tMal:["Los sentidos son algo que todos tenemos y usamos cada día para relacionarnos con el mundo.","Descartes fue un filósofo racionalista del siglo XVII que desconfiaba de los sentidos.","Los sentidos son fiables porque podemos fiarnos de lo que nos dicen los sentidos."],
 a1:"Sin experiencia no tendríamos ningún contenido sobre el que pensar.",
 a2:"Los datos de los sentidos pueden contrastarse y corregirse con instrumentos y razonamiento.",
 a2Mal:["Todo lo que sabemos empieza por lo que vemos, oímos y tocamos: sin percepciones no habría nada que pensar.", "Si los sentidos nos engañan alguna vez, como en las ilusiones ópticas, pueden engañarnos siempre."],
 au:{a1:["Locke","la mente es como un papel en blanco que se llena con la experiencia"],a2:["Nietzsche","poseemos ciencia en la medida en que aguzamos y pensamos los sentidos"],c:["Descartes","es prudente no fiarse nunca de quien nos ha engañado una vez"]},
 contra:"Si los sentidos nos engañan a veces, como el palo que parece quebrado en el agua, no podemos fiarnos de ellos.",
 paja:"Los empiristas creen que todo es exactamente como lo vemos.",
 refut:"Pero ¿cómo sabemos que el palo no está quebrado? Sacándolo del agua y mirándolo: la objeción usa los sentidos para desacreditar a los sentidos.",
 rT:2,rWhy:"La objeción se apoya en los sentidos para decir que no podemos fiarnos de los sentidos: es incoherente.",
 nosirve:"Tengo muy buena vista: nunca he necesitado gafas.",
 def:"Por sentidos entendemos las facultades con las que percibimos el mundo, y llamamos fiable a aquello en lo que podemos confiar sin riesgo de error.",
 ctx:"Hoy, cuando una imagen puede retocarse con inteligencia artificial en segundos, preguntarse por la fiabilidad de lo que vemos es más urgente que nunca.",
 ruta:"En primer lugar mostraré por qué no podemos prescindir de la experiencia; después atenderé a la objeción de que los sentidos nos engañan; finalmente, la refutaré.",
 sint:"En suma, sin los sentidos no habría nada que conocer, pero sin la razón no sabríamos corregir sus errores.",
 reaf:"Por eso, los sentidos son fiables siempre que su testimonio pase por el filtro de la razón.",
 cierre:"¿Qué pasará cuando ni siquiera podamos fiarnos de las imágenes y los vídeos que vemos?",
 nueva:"Además, algunos animales tienen sentidos mucho más desarrollados que los nuestros.",
 contradice:"Por eso, los sentidos son completamente fiables y nunca necesitan corrección."},

{id:"felicidad",q:"¿Es la felicidad el fin de la vida humana?",k:["felicidad","fin","vida","humana?"],o:[],
 dil:"Si todo lo que hacemos busca, en último término, ser felices o si hay algo, como el deber, por encima.",
 dilMal:["Qué cosas concretas nos hacen felices en el día a día y cuáles nos hacen sufrir más, según las encuestas.", "Que la felicidad es el fin de la vida humana, tal y como defendía Aristóteles en su ética."],
 tF:"Todo lo que hacemos lo hacemos, en última instancia, para ser felices.",
 tC:"El fin de la vida no es ser feliz, sino obrar moralmente, aunque eso nos haga menos felices.",
 tM:"La felicidad es un fin legítimo, pero no puede perseguirse a costa de la dignidad de los demás.",
 tB:"Sostendré que la felicidad, entendida como pleno desarrollo de nuestras capacidades, es el fin último de la vida.",tT:0,
 tMal:["Cada persona tiene su propia opinión sobre la felicidad y todas ellas son igual de respetables.","Aristóteles escribió la Ética a Nicómaco, donde habla de la felicidad como bien supremo.","La felicidad es el fin de la vida humana porque la vida humana tiene como fin la felicidad."],
 a1:"El dinero, la fama o la salud los buscamos como medios; la felicidad se busca por sí misma.",
 a2:"Ser feliz consiste en realizar bien lo que nos es propio como seres humanos: pensar y convivir.",
 a2Mal:["Todo lo demás lo deseamos para conseguir otra cosa, pero la felicidad la deseamos únicamente por sí misma.", "Una acción tiene valor moral si se hace por deber, y no por la felicidad que pueda producir."],
 au:{a1:["Aristóteles","la eudaimonía es el bien supremo, al que tienden todas las acciones"],a2:["Platón","el alma justa, en la que cada parte cumple su función, es la verdaderamente feliz"],c:["Kant","el valor moral está en obrar por deber, no en buscar la felicidad"]},
 contra:"Si la felicidad es lo más importante, ¿qué impide sacrificar a otros para ser feliz?",
 paja:"Los críticos de la felicidad creen que hay que vivir amargado para ser buena persona.",
 refut:"Pero la felicidad entendida como vida lograda incluye la virtud y la amistad: quien daña a otros no es feliz en ese sentido.",
 rT:1,rWhy:"La objeción entiende la felicidad como simple placer y olvida que, en sentido filosófico, incluye la virtud: es incompleta.",
 nosirve:"Ayer fui al cine con mis amigos y fui muy feliz.",
 def:"La felicidad puede entenderse como placer pasajero o como una vida lograda en su conjunto; por «fin» entendemos aquello para lo que se hace todo lo demás.",
 ctx:"En una sociedad que nos invita constantemente a «ser felices» a través del consumo y las redes, conviene preguntarse si ese es el sentido de nuestra vida.",
 ruta:"Para fundamentarlo, analizaré primero el argumento aristotélico; a continuación expondré la objeción kantiana; y, finalmente, responderé a ella.",
 sint:"En suma, todo lo demás lo buscamos como medio, y la felicidad entendida como vida lograda incluye la virtud.",
 reaf:"Por eso, la felicidad sí es el fin último de la vida humana.",
 cierre:"¿Buscamos de verdad la felicidad, o solo el placer inmediato que nos venden como tal?",
 nueva:"Además, los países nórdicos suelen encabezar las listas de felicidad.",
 contradice:"Por eso, la felicidad no tiene nada que ver con el fin de la vida humana."},

{id:"deber",q:"¿Debemos actuar por deber aunque las consecuencias sean malas?",k:["deber","consecuencias"],o:["Debemos","actuar","malas?"],
 dil:"Si el valor moral de una acción está en cumplir el deber o en las consecuencias que produce.",
 dilMal:["Qué deberes tienen los ciudadanos según la Constitución española de 1978 y qué ocurre si no los cumplen.", "Que hay que cumplir siempre el deber, pase lo que pase, caiga quien caiga y cueste lo que cueste."],
 tF:"Debemos actuar por deber, porque el valor moral está en la intención y no en los resultados.",
 tC:"Una acción solo es buena si produce buenas consecuencias para la mayoría.",
 tM:"El deber es la base de la moral, pero la prudencia debe atender también a cada situación concreta.",
 tB:"Defenderé que el valor moral está en actuar por deber, aunque el juicio de cada caso exige también prudencia.",tT:2,
 tMal:["El deber es una palabra que usamos mucho en la vida cotidiana y que tiene muchos significados.","Kant nació en Königsberg en 1724 y apenas salió de su ciudad natal en toda su vida.","Debemos actuar por deber porque el deber es precisamente lo que debemos hacer."],
 a1:"Las consecuencias no dependen del todo de nosotros; la intención con que actuamos, sí.",
 a2:"Si juzgáramos solo por resultados, podríamos justificar mentir o dañar a alguien por un bien mayor.",
 a2Mal:["Lo único que controlamos de verdad es nuestra voluntad, y no lo que pasará después de que actuemos.", "Las normas generales no siempre aciertan ante situaciones excepcionales que nadie había previsto."],
 au:{a1:["Kant","lo único bueno sin restricción es una buena voluntad"],a2:["Sócrates","es preferible sufrir una injusticia que cometerla"],c:["Aristóteles","la prudencia busca el término medio en cada caso concreto"]},
 contra:"Seguir una norma sin mirar sus consecuencias puede causar daños graves, como decir la verdad a un asesino.",
 paja:"Los críticos de Kant dicen que quiere que la gente sea como un robot sin sentimientos.",
 refut:"Pero si abandonamos el deber cada vez que las consecuencias parecen malas, nadie podría confiar en nadie: la moral sería un cálculo de conveniencias.",
 rT:0,rWhy:"La objeción muestra un caso difícil, pero un caso extremo no basta para anular el deber como criterio moral: es insuficiente.",
 nosirve:"Mis padres siempre me dicen que primero los deberes y luego el móvil.",
 def:"Actuar por deber es cumplir una norma por respeto a ella, y no por miedo al castigo ni por interés.",
 ctx:"En una época que mide el valor de todo por sus resultados, la idea de un deber incondicional parece casi anticuada.",
 ruta:"Para defenderlo, mostraré primero por qué importa la intención; después, el peligro del cálculo de consecuencias; y, finalmente, responderé a la objeción de los casos extremos.",

const DZ_TORCH = '<svg class="dz-torch" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 12h4l-1.2 10h-1.6z" fill="#8a4f5a"/><rect x="8.5" y="10.5" width="7" height="2.2" rx="1" fill="#4a1430"/><path d="M12 1.5c2.8 2.6 4 4.7 4 6.4A4 4 0 0 1 8 7.9c0-1 .5-2 1.3-2.8.1 1.2.8 2 1.6 2.2C10.5 5.6 11 3.6 12 1.5z" fill="#f7a548"/><path d="M12 5.5c1.3 1.3 2 2.4 2 3.2a2 2 0 0 1-4 0c0-.9.8-2 2-3.2z" fill="#f7c948"/></svg>';
function dzTorches(k){let s="";for(let i=0;i<3;i++)s+=DZ_TORCH.replace('class="dz-torch"','class="dz-torch'+(i<k?'':' off')+'"');return s}
function dzProg(){const p=store.get("dz",{s:{},all:false});p.s=p.s||{};p.last=p.last||{};return p}
function dzDone(p,n){const r=p.s[n];return !!(r&&r.best>=6)}
function dzUnlocked(p,n){return n===1||p.all||dzDone(p,n-1)}
function dzTorchCount(best){return best>=9.5?3:best>=8?2:best>=6?1:0}
function dzLitPieces(p){const lit=new Set();DZ_STAGES.forEach(s=>{if(dzDone(p,s.n))s.pieces.forEach(i=>lit.add(i))});if(dzDone(p,8))DZ_PIECES.forEach((x,i)=>lit.add(i));return lit}
function dzChoose(n){const p=dzProg();const pool=DZ_BANK.filter(f=>f.id!==p.last[n]);const f=dzPick(pool);p.last[n]=f.id;store.set("dz",p);return f}

function viewDzHub(){
  const p=dzProg();
  const done=DZ_STAGES.filter(s=>dzDone(p,s.n)).length;
  const torches=DZ_STAGES.reduce((a,s)=>a+(p.s[s.n]?dzTorchCount(p.s[s.n].best):0),0);
  const lit=dzLitPieces(p);
  const next=DZ_STAGES.find(s=>dzUnlocked(p,s.n)&&!dzDone(p,s.n));
  let lastPhase="",path="";
  DZ_STAGES.forEach(s=>{
    if(s.phase!==lastPhase){path+='<div class="dz-phase">'+s.phase+'</div>';lastPhase=s.phase}
    const info=p.s[s.n];const isDone=dzDone(p,s.n);const un=dzUnlocked(p,s.n);
    let cls="dz-node",st="";
    if(!un){cls+=" locked";st='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'}
    else if(info){st=dzTorches(dzTorchCount(info.best))}
    else st="Empezar";
    if(isDone)cls+=" done";
    if(next&&next.n===s.n)cls+=" next";
    if(s.final)cls+=" final";
    const inner='<span class="n">'+(isDone?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>':s.n)+'</span><span class="tx"><b>'+s.title+'</b><span>'+s.sub+'</span></span><span class="st">'+st+'</span>';
    path+=un?'<a class="'+cls+'" href="#entrena-'+s.n+'">'+inner+'</a>':'<div class="'+cls+'" aria-disabled="true">'+inner+'</div>';
  });
  path+='<div class="dz-sun">Salida al sol</div>';
  return '<section class="dz-hero"><div class="label">Entrenador de disertaciones</div><h2>Salir de la caverna</h2>'+
    '<p>Ocho etapas cortas para construir una disertación paso a paso. En cada etapa te toca una pregunta al azar entre '+DZ_BANK.length+'. Cada etapa superada enciende una antorcha.</p>'+
    '<div class="row"><div><b>'+done+'/'+DZ_STAGES.length+'</b><span>etapas superadas</span></div><div><b>'+torches+'</b><span>antorchas</span></div><div><b>'+lit.size+'/11</b><span>elementos dominados</span></div></div>'+
    '<div class="dz-pieces" aria-label="Elementos de la disertación">'+DZ_PIECES.map((x,i)=>'<span class="'+(lit.has(i)?"on":"")+'">'+x+'</span>').join("")+'</div>'+
    (next?'<div style="margin-top:16px"><a class="btn accent" href="#entrena-'+next.n+'">'+(p.s[next.n]?'Seguir: ':'Empezar: ')+next.title+'</a></div>':'')+
  '</section>'+
  '<section class="card"><div class="dz-path">'+path+'</div></section>'+
  '<p class="dz-teacher">'+(p.all?'Modo profesor activo: todas las etapas abiertas. <button id="dzAll">Desactivar</button>':'¿Eres profesor? <button id="dzAll">Abrir todas las etapas</button>')+' · <button id="dzReset">Borrar progreso</button></p>';
}
function bindDzHub(rerender){
  const a=document.getElementById("dzAll");if(a)a.onclick=()=>{const p=dzProg();p.all=!p.all;store.set("dz",p);rerender()};

}

function dzSaveResult(n,score,fid){
  const pr=dzProg();if(fid){pr.worked=pr.worked||[];if(!pr.worked.includes(fid))pr.worked.push(fid)}const prev=pr.s[n];const wasDone=dzDone(pr,n);
  pr.s[n]={best:Math.max(score,prev?prev.best:0),last:score,t:(prev?prev.t:0)+1};store.set("dz",pr);
  return wasDone;
}
function dzResultHead(n,score,s){
  const k=dzTorchCount(score);const passed=score>=6;
  const msg=passed?(k===3?"Perfecto: has salido de esta parte de la caverna con todas las antorchas.":k===2?"Muy bien. Repite la etapa con otra pregunta si quieres la tercera antorcha.":"Etapa superada. Puedes repetirla con otra pregunta para mejorar."):"Necesitas al menos un 6 para superar la etapa. Repítela: te tocará otra pregunta.";
  return '<div class="torches">'+dzTorches(k)+'</div><div class="score">'+score.toFixed(1).replace(".",",")+'<small> / 10</small></div><p style="margin:0;max-width:460px">'+msg+'</p>';

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(id,host){
  const embedded=!!host;
  let pool;
  const isMix=id.startsWith("mix");
  if(isMix){const line=id.slice(4);const list=shuffle((line==="a"||line==="b")?byLine(line):AUTHORS);
    const per=list.map((a,k)=>Math.floor(10/list.length)+(k<10%list.length?1:0));
    pool=shuffle(list.flatMap((a,k)=>shuffle(QUESTIONS[a.id].map(q=>({q,id:a.id}))).slice(0,per[k])))}
  else {if(!QUESTIONS[id]){location.hash="#test";return}pool=shuffle(QUESTIONS[id].map(q=>({q,id}))).slice(0,10)}
  // barajar opciones
  const items = pool.map(({q,id})=>{const order=shuffle([0,1,2,3]);return {id,text:q[0],opts:order.map(i=>q[1][i]),ans:order.indexOf(q[2]),exp:q[3],tema:q[4]||""}});

  const toTop=()=>{if(embedded)v.scrollIntoView({block:"start"});else window.scrollTo(0,0)};
  const draw=()=>{
    if(st.i>=items.length) return finish();
    const it=items[st.i];const answered=st.answers[st.i]!==undefined;
    v.innerHTML=top("Pregunta "+(st.i+1)+" de "+items.length,["test","Salir"])+
    '<div class="progress" aria-hidden="true"><i style="width:'+((st.i)/items.length*100)+'%"></i></div>'+
    '<section class="card" style="display:flex;flex-direction:column;gap:18px">'+
     '<div class="qhead"><span>'+(isMix?getA(it.id).name:(it.tema?'<span class="chip era">'+it.tema+'</span>':'Pregunta '+(st.i+1)))+'</span><span>'+st.answers.filter((x,k)=>x===items[k].ans).length+' de '+st.answers.filter(x=>x!==undefined).length+' aciertos</span></div>'+
     '<div class="question">'+it.text+'</div>'+
     '<div class="opts">'+it.opts.map((o,k)=>{
       let cls="";if(answered){if(k===it.ans)cls="right";else if(k===st.answers[st.i])cls="wrong"}
       return '<button class="opt '+cls+'" data-k="'+k+'" '+(answered?"disabled":"")+'><span class="k">'+"ABCD"[k]+'</span><span>'+o+'</span></button>'}).join("")+'</div>'+
     (answered?'<div class="feedback '+(st.answers[st.i]===it.ans?"ok":"bad")+'"><b>'+(st.answers[st.i]===it.ans?"Correcto":"No es esa")+'</b>'+it.exp+'</div><div class="btnrow"><button class="btn primary" id="next">'+(st.i===items.length-1?"Ver resultado":"Siguiente")+'</button></div>':'')+
    '</section>';
    v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.answers[st.i]=+b.dataset.k;draw();const n=document.getElementById("next");if(n)n.focus({preventScroll:true})});
    const n=document.getElementById("next");if(n)n.onclick=()=>{st.i++;draw();toTop()};
  };
  const finish=()=>{
    const ok=st.answers.filter((x,k)=>x===items[k].ans).length;
    const score=ok/items.length*10;stat("test-terminado");actividad();
    const best=store.get("best",{});if(best[id]===undefined||score>best[id]){best[id]=score;store.set("best",best)}
    const hist=store.get("hist",[]);const d=new Date();hist.push({id,score,date:d.toLocaleDateString("es-ES",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})});store.set("hist",hist.slice(-30));
    const C=2*Math.PI*62;
    const msg = score>=9?"Excelente. Lo tienes dominado.":score>=7?"Muy bien. Repasa los fallos y listo.":score>=5?"Aprobado. Vuelve a la teoría para reforzar.":"Toca repasar la teoría y volver a intentarlo.";
    v.innerHTML=top("Resultado",["test","Tests"])+
    '<section class="card" style="text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center">'+
     '<div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="75" cy="75" r="62" fill="none" stroke="'+(score>=5?"var(--petrol)":"var(--orange)")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*score/10)+' '+C+'"/></svg><div class="v">'+score.toFixed(1).replace(".",",")+'<small>'+ok+' de '+items.length+' aciertos</small></div></div>'+
     '<p style="font-weight:700">'+msg+'</p>'+
     '<div class="btnrow" style="justify-content:center"><button class="btn primary" id="again">Repetir test</button>'+(embedded?'<button class="btn ghost" data-go="teoria">Repasar la teoría</button>':!isMix?'<a class="btn ghost" href="#autor-'+id+'">Ver teoría de '+getA(id).name+'</a>':'<a class="btn ghost" href="#test">Elegir otro</a>')+'</div>'+
    '</section>'+
    '<section class="card"><h2 style="margin-bottom:12px">Revisión</h2><div class="review">'+items.map((it,k)=>{const good=st.answers[k]===it.ans;return '<div class="rv"><div class="rq">'+(k+1)+'. '+it.text+'</div>'+(good?'<div class="ra ok">Tu respuesta: '+it.opts[it.ans]+'</div>':'<div class="ra bad">Tu respuesta: '+it.opts[st.answers[k]]+'</div><div class="ra ok">Correcta: '+it.opts[it.ans]+'</div>')+'<div class="rx">'+it.exp+'</div></div>'}).join("")+'</div></section>';
    document.getElementById("again").onclick=()=>startQuiz(id,host);

/* ============ PREGUNTA DEL DÍA, RACHA E INSIGNIAS ============ */
function hoyStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function diaNum(s){const p=s.split("-").map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5)}
function actividad(){const d=store.get("dias",[]);const h=hoyStr();
  if(new Date().getHours()<8)store.set("aurora",true);
  if(!d.includes(h)){if(d.length){const last=Math.max(...d.map(diaNum));if(diaNum(h)-last>=7)store.set("retorno",true)}d.push(h);store.set("dias",d.slice(-400))}
  checkInsignias()}
function rachas(){
  const set=[...new Set(store.get("dias",[]))].map(diaNum).sort((a,b)=>a-b);
  let best=0,run=0,prev=null;
  set.forEach(n=>{run=(prev!==null&&n===prev+1)?run+1:1;best=Math.max(best,run);prev=n});
  const hoy=diaNum(hoyStr());
  const actual=(prev===hoy||prev===hoy-1)?run:0;
  return {actual,best,hoyHecho:prev===hoy};
}
function pdiaHoy(){
  const all=[];AUTHORS.forEach(a=>(QUESTIONS[a.id]||[]).forEach(q=>all.push({q,id:a.id})));
  const n=diaNum(hoyStr());const pick=all[(n*7919)%all.length];
  let seed=n;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const order=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  return {id:pick.id,text:pick.q[0],opts:order.map(i=>pick.q[1][i]),ans:order.indexOf(pick.q[2]),exp:pick.q[3]};
}
const FLAME='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1.2 3.4 5 5.2 5 10a5 5 0 0 1-10 0c0-2 .9-3.5 1.9-4.4.2 1.6 1.2 2.6 2.3 2.6 0-3.1-.7-5.6.8-8.2z"/></svg>';
let pdiaRecien=false;
function pdiaHTML(){
  const it=pdiaHoy();const r=store.get("pdia",{});const done=r.fecha===hoyStr();const rc=rachas();
  if(done&&!pdiaRecien) return '';
  const au=getA(it.id);
  return '<section class="card pdia" id="pdia"><div class="pdia-head"><div><h2>Pregunta del día</h2><span class="tiny muted">'+(au?au.name:'')+'</span></div>'+
    '<span class="racha-chip'+(rc.actual?'':' off')+'" title="Días seguidos">'+FLAME+rc.actual+(rc.actual===1?' día':' días')+'</span></div>'+
    '<div class="question">'+it.text+'</div>'+
    '<div class="opts">'+it.opts.map((o,k)=>{let cls="";if(done){if(k===it.ans)cls="right";else if(k===r.k)cls="wrong"}
      return '<button type="button" class="opt '+cls+'" data-pdia="'+k+'" '+(done?'disabled':'')+'><span class="k">'+"ABCD"[k]+'</span><span>'+o+'</span></button>'}).join("")+'</div>'+
    (done?'<div class="feedback '+(r.ok?'ok':'bad')+'"><b>'+(r.ok?'Correcto':'No es esa')+'</b>'+it.exp+'</div><div class="btnrow"><button type="button" class="btn primary" data-pdia-ok>Hecho</button><span class="small muted">Mañana, otra pregunta.</span></div>':'')+
  '</section>';
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-pdia-ok]")){pdiaRecien=false;const c=document.getElementById("pdia");if(c)c.remove();return}

function seenGet(){return store.get("seen",{})}
function markSeenId(id){if(!id)return;const s=seenGet();if(!s[id]){s[id]=Date.now();store.set("seen",s);actividad()}}
function ytIdFromHref(h){const m=String(h||"").match(/(?:v=|shorts\/|youtu\.be\/|embed\/)([\w-]{6,})/);return m?m[1]:null}
function progData(){
  const seen=seenGet();const best=store.get("best",{});
  const all=AUTHORS.map(a=>{
    const th=(VIDEOS[a.id]||[]).map(v=>v.id);
    const tx=(TEXTOS[a.id]||[]).filter(t=>t.yt).map(t=>t.yt).concat(TEXTOS_RESUMEN[a.id]?[TEXTOS_RESUMEN[a.id].yt]:[]);
    return {a,th:[th.filter(i=>seen[i]).length,th.length],tx:[tx.filter(i=>seen[i]).length,tx.length],test:best[a.id]};
  });
  const dz=dzProg();const worked=new Set(dz.worked||[]);const wr=store.get("essaysWritten",[]);
  DZ_BANK.forEach(f=>{if(wr.includes(f.q))worked.add(f.id)});
  const seenV=seenGet();const dvAvail=DIS_VIDEOS.filter(v=>v.id);const dvSeen=dvAvail.filter(v=>seenV[v.id]).length;
  const stagesDone=DZ_STAGES.filter(st=>dzDone(dz,st.n)).length;
  const ds=(stagesDone+dvSeen)/(DZ_STAGES.length+dvAvail.length);
  const calc=ids=>{
    const rows=all.filter(r=>ids.includes(r.a.id));
    const sum=k=>rows.reduce((acc,r)=>[acc[0]+r[k][0],acc[1]+r[k][1]],[0,0]);
    const th=sum("th"),tx=sum("tx");
    const thp=th[1]?th[0]/th[1]:null,txp=tx[1]?tx[0]/tx[1]:null;
    const testPct=rows.reduce((s,r)=>s+(r.test||0),0)/(rows.length*10);
    const parts=[thp,txp,testPct,ds].filter(x=>x!==null);
    return {rows,th,tx,thp,txp,testPct,tests:rows.filter(r=>r.test!==undefined).length,n:rows.length,total:parts.reduce((a,b)=>a+b,0)/parts.length};
  };
  const A=calc(LINE_ORDER.a),B=calc(LINE_ORDER.b);
  const pref=store.get("via","auto");
  const via=pref==="auto"?(B.total>A.total?"b":"a"):pref;
  const R=via==="both"?calc(AUTHORS.map(x=>x.id)):via==="b"?B:A;
  return Object.assign(R,{pref,via,ds,worked:worked.size,dtotal:DZ_BANK.length,stages:stagesDone,dvSeen,dvTotal:dvAvail.length});
}

  '</section>';
}
function hideInstallCard(){store.set("installHide",true);const c=document.getElementById("installCard");if(c)c.remove()}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
window.addEventListener("appinstalled",()=>{deferredInstall=null;store.set("appInstalada",true);hideInstallCard()});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-install]"); if(!b) return;
  if(b.dataset.install==="hide"){hideInstallCard();return}
  if(deferredInstall){
    deferredInstall.prompt();
    const r=await deferredInstall.userChoice; deferredInstall=null;
    if(r&&r.outcome==="accepted") hideInstallCard();
    return;
  }
  const h=document.getElementById("installHelp"); if(!h) return;
  h.innerHTML=isIOS()
    ? 'En <b>Safari</b>, pulsa el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y elige <b>«Añadir a pantalla de inicio»</b>.'
    : 'Abre el menú del navegador (<b>⋮</b>) y elige <b>«Instalar aplicación»</b> o <b>«Añadir a pantalla de inicio»</b>.';
  h.hidden=false;
});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caverna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app bancaria — barra lateral en escritorio, barra de pestañas inferior en móvil; tarjetas redondeadas sobre fondo neutro frío */
:root{
  --petrol:#0d4c57;
  --petrol-deep:#083640;
  --petrol-soft:#e3eff0;
  --orange:#e2773a;
  --ochre:#c9962b;
  --sand:#f3e7cf;
  --bg:#f2f5f5;
  --surface:#ffffff;
  --surface-2:#f7f9f9;
  --ink:#10262b;
  --muted:#5d7277;
  --line:#dbe4e5;
  --ok:#2f8f5b;
  --ok-soft:#e2f3e9;
  --bad:#c4473a;
  --bad-soft:#fbe6e3;
  --shadow:0 1px 2px rgba(8,54,64,.06),0 6px 20px rgba(8,54,64,.07);
  --font-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --petrol:#2a8a99;--petrol-deep:#0b3a43;--petrol-soft:#123238;
    --orange:#f08a4b;--ochre:#d9aa45;--sand:#3a3020;
    --bg:#0b1517;--surface:#132226;--surface-2:#182a2e;
    --ink:#e6f0f1;--muted:#93a9ad;--line:#24393e;
    --ok:#4cbf82;--ok-soft:#163528;--bad:#ec6d5f;--bad-soft:#3a1c19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --petrol:#2a8a99;--petrol-deep:#0b3a43;--petrol-soft:#123238;
  --orange:#f08a4b;--ochre:#d9aa45;--sand:#3a3020;
  --bg:#0b1517;--surface:#132226;--surface-2:#182a2e;
  --ink:#e6f0f1;--muted:#93a9ad;--line:#24393e;
  --ok:#4cbf82;--ok-soft:#163528;--bad:#ec6d5f;--bad-soft:#3a1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--petrol)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--petrol-deep);color:#e8f3f4;padding:28px 18px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand-sub{font-size:12px;opacity:.7;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#cfe3e6;text-decoration:none;font-weight:600;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff}
.nav a.on svg{color:var(--orange)}
.side-foot{margin-top:auto;font-size:12px;opacity:.65;padding:0 8px;line-height:1.5}

.main{padding:28px 32px 48px;min-width:0}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar .hello{font-size:14px;color:var(--muted);font-weight:600}
.topbar h1{font-size:26px;font-weight:800}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:8px 14px 8px 10px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.back:hover{border-color:var(--petrol)}

.tabbar{display:none}

/* Tarjetas */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px}
.card h2{font-size:18px;font-weight:700}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head a,.link-btn{font-size:14px;font-weight:700;color:var(--petrol);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}

/* Tarjeta principal tipo "saldo" */
.balance{position:relative;overflow:hidden;border-radius:26px;padding:26px 26px 22px;color:#fff;background:
  radial-gradient(120% 140% at 100% 0%,rgba(226,119,58,.55) 0%,rgba(226,119,58,0) 45%),
  radial-gradient(90% 120% at 0% 100%,rgba(201,150,43,.35) 0%,rgba(201,150,43,0) 50%),
  linear-gradient(135deg,#0f5966 0%,#083640 100%);box-shadow:0 14px 34px rgba(8,54,64,.28)}
.balance .label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.balance .big{font-family:var(--font-display);font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.balance .big small{font-size:22px;font-weight:600;opacity:.8}
.balance .row{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px}
.balance .row div{display:flex;flex-direction:column}
.balance .row b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.balance .row span{font-size:12.5px;opacity:.75}
.balance .chip-card{position:absolute;right:22px;top:22px;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:999px}

/* Acciones rápidas */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-md);padding:16px 8px 14px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;text-align:center;border:0;cursor:pointer;transition:transform .15s ease}
.qa:hover{transform:translateY(-2px)}
.qa .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--petrol-soft);color:var(--petrol)}
.qa:nth-child(2) .ic{background:var(--sand);color:#9a6a12}
.qa:nth-child(3) .ic{background:#fbe3d4;color:#b4531c}
.qa:nth-child(4) .ic{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
:root[data-theme="dark"] .qa:nth-child(2) .ic,:root[data-theme="dark"] .qa:nth-child(3) .ic{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qa:nth-child(2) .ic,:root:not([data-theme="light"]) .qa:nth-child(3) .ic{color:var(--ink)}}
:root[data-theme="dark"] .qa:nth-child(3) .ic{background:#3d2416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qa:nth-child(3) .ic{background:#3d2416}}

/* Matriz épocas */
.matrix{display:grid;grid-template-columns:150px repeat(4,1fr);gap:8px;align-items:stretch}
.matrix .mh{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.matrix .rowlabel{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;padding:6px;line-height:1.3}
.matrix .rowlabel .chip{white-space:normal;line-height:1.3}
.cell{background:var(--surface-2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.cell.empty{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.mini{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;transition:border-color .15s}
.mini:hover{border-color:var(--petrol)}
.mini svg{flex:none}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.a{background:var(--petrol-soft);color:var(--petrol)}
.chip.b{background:#fbe3d4;color:#a84c18}
.chip.era{background:var(--sand);color:#7d5710}
:root[data-theme="dark"] .chip.b{background:#3d2416;color:#f6b48a}
:root[data-theme="dark"] .chip.era{color:#f0cf86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.b{background:#3d2416;color:#f6b48a}:root:not([data-theme="light"]) .chip.era{color:#f0cf86}}

/* Listas tipo movimientos */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.li:first-child{border-top:0}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-weight:700}
.li .lt span{font-size:13px;color:var(--muted)}
.li .amount{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.li .amount.ok{color:var(--ok)}
.li .amount.bad{color:var(--bad)}
.dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--petrol-soft);color:var(--petrol);font-weight:800;font-family:var(--font-display)}

/* Grid autores */
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:1px solid transparent;transition:border-color .15s,transform .15s}
.acard:hover{border-color:var(--petrol);transform:translateY(-2px)}
.acard .av{background:var(--surface-2);border-radius:16px;display:grid;place-items:center;height:120px}
.acard h3{font-size:18px}
.acard .meta{display:flex;gap:6px;flex-wrap:wrap}
.acard .score{font-size:13px;color:var(--muted);font-weight:600}

/* Cabecera autor */
.hero-a{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;background:linear-gradient(135deg,#0f5966 0%,#083640 100%);color:#fff;border-radius:26px;padding:22px 26px;box-shadow:0 14px 34px rgba(8,54,64,.25)}
.hero-a .av{background:rgba(255,255,255,.08);border-radius:20px;height:150px;display:grid;place-items:center}
.hero-a h1{font-size:32px;font-weight:800}
.hero-a .yrs{opacity:.8;font-weight:600;margin-top:2px}
.hero-a .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero-a .chip{background:rgba(255,255,255,.14);color:#fff}
.hero-a .problem{grid-column:1 / -1;margin-top:0;font-size:15px;opacity:.92;max-width:60ch}

/* Segmentado */
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow);gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--petrol);color:#fff}

/* Contenido */
.prose{max-width:68ch}
.prose p+p{margin-top:10px}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bullets li{position:relative;padding-left:22px}
.bullets li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:3px;background:var(--orange)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.concept{background:var(--surface-2);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.concept b{display:block;font-family:var(--font-display);font-size:15px;margin-bottom:2px;color:var(--petrol)}
.concept span{font-size:14px;color:var(--ink)}
.works{display:flex;flex-direction:column;gap:8px}
.work{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.work .wi{width:34px;height:34px;border-radius:10px;background:var(--sand);display:grid;place-items:center;flex:none;color:#7d5710}
.work b{display:block}
.work span{font-size:14px;color:var(--muted)}

.steps{display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--petrol);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.step h3{font-size:16px;margin-bottom:4px}
.step p{font-size:15px;color:var(--ink)}
.step .pts{font-size:12.5px;color:var(--muted);font-weight:700}

.callout{border-radius:16px;padding:14px 16px;background:var(--sand);color:var(--ink);font-size:14.5px;display:flex;gap:12px;align-items:flex-start}
.callout svg{flex:none;color:var(--ochre);margin-top:2px}
.callout.info{background:var(--petrol-soft)}
.callout.info svg{color:var(--petrol)}

.compare{display:flex;flex-direction:column;gap:10px}
.cmp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cmp .tag{flex:none}

/* Editor */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
textarea{width:100%;min-height:150px;resize:vertical;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);padding:12px 14px;font:inherit;font-size:15.5px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--petrol);background:var(--surface)}
.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.counter .over{color:var(--bad)}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--petrol);margin-top:3px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--petrol);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--orange);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--petrol)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.saved{font-size:13px;color:var(--ok);font-weight:700}

.qbank{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:15px}
.qitem:hover{border-color:var(--petrol)}
.qitem.on{border-color:var(--petrol);background:var(--petrol-soft)}
.qitem .num{width:28px;height:28px;border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none;border:1px solid var(--line)}
.qitem.on .num{background:var(--petrol);color:#fff;border-color:var(--petrol)}

.timer{display:flex;align-items:center;gap:12px;background:var(--petrol-deep);color:#fff;border-radius:16px;padding:10px 12px 10px 16px}
.timer .t{font-family:var(--font-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.01em;flex:1}
.timer button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
.timer.warn .t{color:var(--orange)}

/* Test */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:14px 10px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:1.5px solid transparent;font-weight:700;text-align:center}
.pcard:hover{border-color:var(--petrol)}
.pcard .best{font-size:12.5px;color:var(--muted);font-weight:600}
.pcard.mix{background:linear-gradient(135deg,#e2773a,#c9962b);color:#fff}
.pcard.mix .best{color:rgba(255,255,255,.85)}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--petrol),var(--orange));border-radius:999px;transition:width .3s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-weight:700}
.question{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.35;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-size:15.5px;font-weight:600;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--petrol)}
.opt .k{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:13px;flex:none;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;font-size:15px}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:2px}
.ring{width:150px;height:150px;position:relative;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1}
.ring .v small{display:block;font-size:13px;font-weight:600;color:var(--muted);font-family:var(--font-body);margin-top:4px}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rv .rq{font-weight:700;margin-bottom:6px}
.rv .ra{font-size:14px}
.rv .ra.ok{color:var(--ok)}
.rv .ra.bad{color:var(--bad)}
.rv .rx{font-size:14px;color:var(--muted);margin-top:6px}

.examgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ex{background:var(--surface-2);border-radius:16px;padding:14px;border:1px solid var(--line)}
.ex .p{font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--petrol);font-variant-numeric:tabular-nums}
.ex .p small{font-size:14px;color:var(--muted);font-weight:600}
.ex b{display:block;margin-top:2px}
.ex span{font-size:13.5px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .m{font-family:var(--font-display);font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}

.videos{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:620px){.videos{grid-template-columns:1fr}}
.vcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.vthumb{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s ease}
.vcard:hover .vthumb{transform:translateY(-2px)}
.vcard b{font-size:15px;line-height:1.3}
.vembed{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden}
.vembed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* ===== Teoría ===== */
.th{display:flex;flex-direction:column;gap:14px;scroll-margin-top:70px}
.th-head{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;cursor:pointer;border-radius:12px}
.th-head:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
.th-head h2{font-size:21px;font-weight:800}
.th-tog{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:13.5px;font-weight:800;color:var(--petrol);background:var(--petrol-soft);padding:7px 12px;border-radius:999px}
.th-tog svg{transition:transform .2s ease}
.th.open .th-tog{background:var(--petrol);color:#fff}
.th.open .th-tog svg{transform:rotate(180deg)}
.th-body{display:flex;flex-direction:column;gap:14px}
.th-body[hidden]{display:none}
.th-lead{margin-top:6px;color:var(--muted);max-width:70ch;font-size:15.5px}
.th-h3{font-family:var(--font-display);font-size:17px;font-weight:700;margin-top:8px;color:var(--petrol)}
.th-p{max-width:72ch}
.th-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.th-stack{display:flex;flex-direction:column;gap:12px}
.th-index{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);scrollbar-width:none}
.th-index::-webkit-scrollbar{display:none}
.th-index button{flex:none;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink)}
.th-index button:hover{border-color:var(--petrol);color:var(--petrol)}
.th-key{border-left:4px solid var(--orange);background:var(--surface-2);border-radius:0 14px 14px 0;padding:12px 14px}
.th-key.warn{border-left-color:var(--bad)}
.th-key-l{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
.th-key.warn .th-key-l{color:var(--bad)}
.th-quote{margin:0;padding:16px 18px;border-radius:16px;background:var(--petrol-soft);font-size:15.5px;font-style:italic;position:relative;max-width:75ch}
.th-quote::before{content:"“";position:absolute;left:10px;top:-14px;font-family:var(--font-display);font-size:56px;color:var(--orange);font-style:normal;line-height:1}
.th-quote cite{display:block;margin-top:6px;font-style:normal;font-weight:800;font-size:13px;color:var(--muted)}
.tlv{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tlv-i{position:relative;padding:0 0 14px 18px}
.tlv-i::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--orange)}
.tlv-y{font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--orange)}
.tlv-i p{font-size:14.5px}
.infl{display:flex;flex-direction:column;gap:8px}
.infl-i{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.infl-i b{display:block;font-family:var(--font-display);color:var(--petrol)}
.infl-i span{font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.vs-side{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.vs-side p{font-size:14px}
.vs-mid{align-self:center;font-family:var(--font-display);font-weight:800;color:var(--orange);font-size:18px}
.th-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;counter-reset:ts}
.th-steps>div{background:var(--surface-2);border-radius:14px;padding:12px 14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.th-steps b{font-family:var(--font-display);font-size:14.5px}
.th-steps span{font-size:14px;color:var(--ink)}
.vinline{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:10px}
.vinline:hover{border-color:var(--petrol)}
.vinline>div:last-child{display:flex;flex-direction:column;gap:2px}
.vinline .vthumb{border-radius:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo-i{border-radius:16px;padding:14px}
.duo-i.dim{background:var(--surface-2);border:1px solid var(--line)}
.duo-i.lit{background:var(--petrol-soft)}
.duo-t{display:block;font-family:var(--font-display);font-weight:800;font-size:17px;margin-bottom:8px}
.soul{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.soul-i{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.soul-i.s1{background:linear-gradient(180deg,var(--petrol-soft),var(--surface))}
.soul-i.s2{background:linear-gradient(180deg,var(--sand),var(--surface))}
.soul-i.s3{background:linear-gradient(180deg,#fbe3d4,var(--surface))}
:root[data-theme="dark"] .soul-i.s3{background:linear-gradient(180deg,#3d2416,var(--surface))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .soul-i.s3{background:linear-gradient(180deg,#3d2416,var(--surface))}}
.soul-tag{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.soul-i>b{font-family:var(--font-display);font-size:18px}
.soul-sub{font-size:12.5px;font-weight:700;color:var(--orange)}
.soul-i p{font-size:14px;flex:1}
.soul-f{display:flex;flex-direction:column;gap:2px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.args{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.arg{border-radius:16px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:6px}
.arg.g1{background:linear-gradient(135deg,#0f5966,#083640)}
.arg.g2{background:linear-gradient(135deg,#6b5a7a,#43354f)}
.arg.g3{background:linear-gradient(135deg,#d58a2e,#b06a1a)}
.arg-t{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.02em}
.arg p{font-size:14px;flex:1;opacity:.95}
.arg-r{font-size:12px;font-weight:800;opacity:.8}
.ladder{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px}
.ladder-cap{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ladder ol{margin:0;padding:0;list-style:none;counter-reset:l;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.ladder li{counter-increment:l;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;font-size:14px;padding:6px 8px;border-radius:10px;background:var(--surface)}
.ladder li::before{content:counter(l);flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:color-mix(in srgb,var(--petrol) calc(100% - (var(--i,0) * 10%)),var(--orange))}
.ladder li:nth-child(1)::before{background:var(--petrol)}
.ladder li:nth-child(n+4)::before{background:var(--ochre)}
.ladder li:nth-child(n+8)::before{background:var(--bad)}
.dialog{display:flex;flex-direction:column;gap:6px;max-width:520px}
.dialog p{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14.5px;align-self:flex-start}
.dialog p.r{align-self:flex-end;background:var(--petrol);color:#fff;border-color:var(--petrol);border-radius:14px 14px 4px 14px}
.dialog p span{display:none}
.attr{display:flex;flex-wrap:wrap;gap:8px}
.attr span{background:var(--petrol-soft);color:var(--petrol);font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px}
.worlds{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.world{border-radius:18px;padding:16px}
.world.sens{background:var(--sand)}
.world.int{background:linear-gradient(135deg,#0f5966,#083640);color:#fff}
.world-t{display:block;font-family:var(--font-display);font-weight:800;font-size:17px;margin-bottom:8px}
.world ul{margin:0;padding-left:18px;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.world-arrow{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.04em}
.world-arrow span::after{content:" →"}
.pyr-wrap{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:18px;align-items:center}
.pyr{width:100%;height:auto}
.pyr-i>b{display:block;font-family:var(--font-display)}
.pyr-i>b.o{color:var(--orange)}
.pyr-i>b.y{color:var(--ochre)}
.pyr-i span{font-size:14.5px}
.banner{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#0f5966,#083640);color:#fff;border-radius:16px;padding:14px;font-family:var(--font-display);font-weight:800;font-size:20px}
.banner i{font-style:normal;color:var(--orange)}
.bigword{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sand);border-radius:18px;padding:22px;text-align:center}
.bigword span{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.bigword b{font-family:var(--font-display);font-size:36px;font-weight:800;color:var(--petrol);letter-spacing:-.02em}
.line-wrap{display:flex;flex-direction:column;gap:8px}
.line-top,.line-bot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.line-top div{display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:3px solid var(--ochre);padding-bottom:6px}
.line-top div:last-child{border-color:var(--petrol)}
.line-top b{font-family:var(--font-display)}
.line-top span{font-size:12.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.line>div{position:relative;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.line .seg1{background:color-mix(in srgb,var(--ochre) 18%,var(--surface))}
.line .seg2{background:color-mix(in srgb,var(--ochre) 32%,var(--surface))}
.line .seg3{background:color-mix(in srgb,var(--petrol) 22%,var(--surface))}
.line .seg4{background:linear-gradient(135deg,#0f5966,#083640);color:#fff}
.line .ln{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--orange);line-height:1}
.line b{font-family:var(--font-display);font-size:15px}
.line i{font-size:13px;opacity:.8}
.line p{font-size:13.5px;margin-top:4px}
.line small{font-size:12.5px;opacity:.8}
.line-bot div{text-align:center;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:6px}
.tblwrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
.tbl thead th{border-top:0;background:var(--surface-2);font-family:var(--font-display);font-size:13.5px}
.tbl tbody th{font-weight:800;color:var(--muted);font-size:13px;white-space:nowrap;background:var(--surface-2)}
.tbl.dual thead .c1{background:var(--petrol-soft);color:var(--petrol)}
.tbl.dual thead .c2{background:var(--sand);color:#7d5710}
.tbl small{display:block;font-family:var(--font-body);font-weight:600;font-style:italic;opacity:.8}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:13px}
.pill.p1{background:var(--petrol-soft);color:var(--petrol)}
.pill.p2{background:var(--sand);color:#7d5710}
.pill.p3{background:#fbe3d4;color:#a84c18}
.virt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.virt div{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;text-align:center}
.virt b{font-family:var(--font-display);color:var(--petrol);font-size:16px}
.v-arrow{color:var(--orange);font-weight:800}
.principle{border-radius:16px;padding:14px;background:linear-gradient(135deg,#e2773a,#c9962b);color:#fff}
.pr-t{display:block;font-family:var(--font-display);font-weight:800;font-size:16px;margin-bottom:4px}
.principle p{font-size:14.5px}
.gov{display:flex;flex-direction:column;gap:8px}
.gov-i{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border-radius:14px;padding:10px 14px;border:1px solid var(--line);background:var(--surface-2)}
.gov-n{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:#fff}
.gov-i b{font-family:var(--font-display);font-size:16px}
.gov-w{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.gov-i p{font-size:14px;margin-top:2px}
.gov-v{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.g1 .gov-n{background:var(--ok)}.g1 .gov-v{background:var(--ok-soft);color:var(--ok)}
.g2 .gov-n{background:var(--petrol)}.g2 .gov-v{background:var(--petrol-soft);color:var(--petrol)}
.g3 .gov-n{background:var(--ochre)}.g3 .gov-v{background:var(--sand);color:#7d5710}
.g4 .gov-n{background:var(--orange)}.g4 .gov-v{background:#fbe3d4;color:#a84c18}
.g5 .gov-n{background:var(--bad)}.g5 .gov-v{background:var(--bad-soft);color:var(--bad)}
.edu{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.edu.e1{background:var(--petrol-soft)}
.edu.e2{background:var(--sand)}
.edu-t{font-family:var(--font-display);font-weight:800;font-size:17px}
.edu-s{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.edu-c{display:flex;align-items:center;gap:8px;margin:4px 0}
.edu-c span{background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px}
.edu-c i{font-style:normal;font-weight:800;color:var(--orange)}
.edu p{font-size:14.5px}
.evo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.evo>div{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.evo-a{font-size:22px;color:var(--orange);font-weight:800}
@media (max-width:860px){
  .th-grid2,.duo,.soul,.args,.virt{grid-template-columns:1fr}
  .vs,.worlds{grid-template-columns:1fr}
  .vs-mid{justify-self:center}
  .world-arrow{flex-direction:row}
  .world-arrow span::after{content:" ↓"}
  .pyr-wrap{grid-template-columns:1fr}
  .line{grid-template-columns:1fr 1fr}
  .vinline{grid-template-columns:1fr}
  .th-head h2{font-size:19px}
  .gov-i{grid-template-columns:36px 1fr}
  .gov-v{grid-column:2;justify-self:start}
}
.cx{border:0;cursor:pointer;background:var(--petrol-soft);color:var(--petrol);font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;font-family:inherit}
.cx:hover{background:var(--petrol);color:#fff}
.cm-sum>div{display:flex;align-items:baseline;gap:10px}
.cm-sum2 b{font-size:18px!important;opacity:.9}
.cm-flags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cm-flag{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px}
.cm-flag.ok{background:var(--ok-soft);color:var(--ok)}
.cm-flag.bad{background:var(--bad-soft);color:var(--bad)}
.cm-auto{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.6;margin-left:6px}
.cm-coh{font-size:14.5px;background:var(--surface);border-radius:10px;padding:8px 10px}
.cm-frag{font-size:16px;line-height:1.7;max-width:72ch;background:var(--surface-2);border-left:4px solid var(--ochre);border-radius:0 14px 14px 0;padding:14px 16px}
.cm-form{display:flex;flex-direction:column;gap:18px}
.cm-in{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);padding:12px 14px;font:inherit;font-size:15.5px}
.cm-in:focus{outline:none;border-color:var(--petrol);background:var(--surface)}
.cm-res:empty{display:none}
.cm-r{border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.cm-r.ok{background:var(--ok-soft)}.cm-r.ok>b{color:var(--ok)}
.cm-r.bad{background:var(--bad-soft)}.cm-r.bad>b{color:var(--bad)}
.cm-r.mid{background:var(--sand)}.cm-r.mid>b{color:#7d5710}
.cm-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.cm-tags .t{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.cm-tags .t.ok{background:var(--ok);color:#fff}
.cm-tags .t.miss{background:var(--surface);border:1px dashed var(--muted);color:var(--muted)}
.cm-tags .t.extra{background:var(--surface);color:var(--muted);text-decoration:line-through}
.cm-sum{display:flex;align-items:center;flex-wrap:wrap;gap:12px 28px;background:var(--petrol-deep);color:#fff;border-radius:14px;padding:12px 16px}
.cm-sum b{font-family:var(--font-display);font-size:24px}
.cm-sum span{font-size:14px;opacity:.85}
.cm-ai{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start;background:var(--petrol-soft);border-radius:16px;padding:14px}
.cm-ai-n{background:linear-gradient(135deg,#0f5966,#083640);color:#fff;border-radius:14px;padding:12px;text-align:center}
.cm-ai-n b{display:block;font-family:var(--font-display);font-size:32px;line-height:1}
.cm-ai-n span{font-size:12px;opacity:.8}
.cm-ai p{font-size:15px;margin-bottom:8px}
.cm-h{display:block;font-family:var(--font-display);font-size:14px;margin:8px 0 4px;color:var(--orange)}
.cm-h.ok{color:var(--ok)}
.cm-model{margin-top:10px;font-size:14.5px}
.cm-model summary{cursor:pointer;font-weight:800;color:var(--petrol)}
.cm-model p,.cm-modelp{margin-top:6px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14.5px}
.cm-dots{display:inline-flex;gap:4px}
.cm-dots i{width:7px;height:7px;border-radius:50%;background:var(--ochre);animation:cmd 1s infinite ease-in-out}
.cm-dots i:nth-child(2){animation-delay:.15s}.cm-dots i:nth-child(3){animation-delay:.3s}
@keyframes cmd{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:620px){.cm-ai{grid-template-columns:1fr}}
.linehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.linehead h2{font-size:19px;font-weight:700}
.lineblock{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface-2)}
.lineblock+.lineblock{margin-top:10px}
.lb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px}
.lb-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini span{display:flex;flex-direction:column;line-height:1.2}
.mini small{font-size:11.5px;font-weight:600;color:var(--muted)}
@media (max-width:620px){.lb-row{grid-template-columns:1fr 1fr}}
.empty-state{text-align:center;padding:18px 8px;color:var(--muted);font-size:14.5px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 16px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -6px 20px rgba(8,54,64,.08)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:10px;min-width:64px}
  .tabbar a.on{color:var(--petrol)}
  .tabbar a.on svg{color:var(--orange)}
  .topbar h1{font-size:22px}
  .balance .big{font-size:40px}
  .grid2{grid-template-columns:1fr}
  .matrix{grid-template-columns:1fr 1fr}
  .matrix .mh,.matrix .corner{display:none}
  .matrix .rowlabel{grid-column:1 / -1;padding-top:10px}
  .matrix .cell.empty{display:none}
  .hero-a{grid-template-columns:96px 1fr;padding:18px;gap:16px}

<script>
/* ============ DATOS ============ */
const AUTHORS = [
 {id:"platon",name:"Platón",years:"427–347 a. C.",era:"Antigua",block:"a",
  problem:"¿Qué es lo verdaderamente real y cómo podemos conocerlo?",
  works:[
   {t:"Fedón, 74a–75e",d:"La igualdad en sí y la reminiscencia: conocer es recordar."},
   {t:"República VI, 504d–511e",d:"La Idea de Bien, el símil del Sol y el símil de la línea."}],
  context:"Atenas tras la Guerra del Peloponeso y la condena a muerte de Sócrates (399 a. C.). Platón reacciona contra el relativismo de los sofistas, para quienes no hay verdad ni bien universales, y busca un fundamento firme para el conocimiento, la moral y la política. Recoge influencias de Sócrates (búsqueda de definiciones), Parménides (el ser inmutable), Heráclito (el cambio del mundo sensible) y los pitagóricos (matemáticas, alma inmortal).",
  ideas:[
   "Dualismo ontológico: el mundo sensible es cambiante, múltiple e imperfecto; el mundo inteligible de las Ideas es eterno, inmutable y verdadero.",
   "Las cosas sensibles participan de las Ideas o las imitan: algo es bello porque participa de la Belleza en sí.",
   "Dualismo epistemológico: la opinión (doxa) se ocupa de lo sensible; la ciencia (episteme) de lo inteligible.",
   "La Idea de Bien es la Idea suprema: como el Sol con lo visible, hace que las Ideas sean cognoscibles y les da el ser.",
   "Teoría de la reminiscencia: el alma contempló las Ideas antes de unirse al cuerpo; conocer es recordar. Los objetos sensibles solo actúan como estímulo."],
  concepts:[
   ["Idea (eidos)","Realidad inteligible, eterna e inmutable que es modelo de las cosas sensibles."],
   ["Participación (méthexis)","Relación por la que las cosas sensibles reciben su ser de las Ideas."],
   ["Doxa","Opinión: conocimiento de lo sensible. Incluye imaginación (eikasía) y creencia (pístis)."],
   ["Episteme","Ciencia: conocimiento de lo inteligible. Incluye pensamiento discursivo (diánoia) e inteligencia (nóesis)."],
   ["Dialéctica","Método supremo que asciende de Idea en Idea sin apoyarse en lo sensible hasta el Bien."],
   ["Anámnesis","Reminiscencia: recuerdo de las Ideas que el alma ya conocía."]],
  q1:"Localiza si el fragmento trata la reminiscencia (Fedón) o la jerarquía del conocimiento y el Bien (República). Formula el problema como pregunta: ¿cómo es posible conocer lo que no está en lo sensible? Identifica la tesis (p. ej., «el conocimiento de lo igual en sí es anterior a la percepción») y las ideas que la sostienen, siguiendo el orden del argumento.",
  q2:"Conecta el fragmento con la teoría de las Ideas, el dualismo ontológico y epistemológico, la reminiscencia y la Idea de Bien. Si el texto es de la línea, explica los cuatro segmentos; si es del Fedón, la inmortalidad del alma. Cierra con la proyección ética y política: el filósofo que conoce el Bien debe gobernar.",
  q3:[
   ["Racionalismo (Moderna)","Descartes: la razón con ideas innatas como fuente del conocimiento verdadero; desconfianza en los sentidos, como Platón."],
   ["Empirismo (Moderna)","Locke: no hay ideas innatas; todo conocimiento procede de la experiencia. Contraste directo con la reminiscencia."],
   ["Vitalismo (Contemporánea)","Nietzsche: el «mundo verdadero» es una fábula; invierte el platonismo y reivindica el mundo sensible."],
   ["Perspectivismo (Contemporánea)","Ortega: no hay una verdad única fuera de la vida; la realidad se da en perspectivas."]],
  tips:["No reduzcas el comentario a contar el mito de la caverna si el texto es de la línea o del Fedón.","Usa los términos griegos con su explicación, no sueltos."]},

 {id:"aristoteles",name:"Aristóteles",years:"384–322 a. C.",era:"Antigua",block:"b",
  problem:"¿En qué consiste la vida buena para el ser humano y cuál es la mejor forma de organizar la comunidad?",
  works:[
   {t:"Ética a Nicómaco I, 2, 4 y 8",d:"El bien supremo, la felicidad y su relación con la virtud y los bienes externos."},
   {t:"Política I, 1–2 y III, 7–8",d:"La polis como comunidad natural y la clasificación de las formas de gobierno."}],
  context:"Discípulo de Platón durante veinte años en la Academia, funda después el Liceo. Vive el final de la polis independiente bajo la hegemonía de Macedonia; fue maestro de Alejandro Magno. Critica la teoría de las Ideas: la esencia está en las cosas mismas. Su filosofía práctica es realista y atenta a la experiencia.",
  ideas:[
   "Ética teleológica: toda acción tiende a un fin, y el fin último que se busca por sí mismo es la felicidad (eudaimonía).",
   "La felicidad consiste en realizar la función propia del ser humano: la actividad del alma conforme a la razón y a la virtud, durante una vida entera.",
   "La virtud ética es un hábito de elegir el término medio entre dos vicios, determinado por la prudencia.",
   "La felicidad necesita también bienes externos en cierta medida: amigos, recursos, buena fortuna.",
   "El ser humano es por naturaleza un animal político, dotado de lenguaje para deliberar sobre lo justo; la polis es anterior por naturaleza al individuo.",
   "Formas rectas de gobierno (monarquía, aristocracia, politeia) buscan el bien común; las desviadas (tiranía, oligarquía, democracia) el interés de quien gobierna."],
  concepts:[
   ["Eudaimonía","Felicidad o vida plena: el bien supremo y fin último del ser humano."],
   ["Ergon","Función propia de algo; la del ser humano es la actividad racional."],
   ["Areté","Virtud o excelencia: disposición que perfecciona una función."],
   ["Término medio","Equilibrio relativo a nosotros entre el exceso y el defecto."],
   ["Phrónesis","Prudencia: virtud intelectual que delibera bien sobre lo que conviene hacer."],
   ["Zoon politikón","Animal político: el ser humano solo se realiza en la polis."]],
  q1:"Distingue si el fragmento es ético (bien supremo, felicidad, función) o político (origen de la polis, formas de gobierno). El problema puede formularse así: ¿qué es la felicidad?, ¿por qué vivimos en comunidad? o ¿qué hace justo un gobierno? Señala la tesis y cómo la argumenta (de la parte al todo, de la familia a la polis, del fin de cada acción al fin último).",
  q2:"Relaciona con la teleología de su física y metafísica (todo tiende a su fin), con la teoría de la virtud y el término medio, y con la unión entre ética y política: la política es la ciencia arquitectónica del bien humano. Puedes apoyarte en su crítica a Platón (el Bien no es una Idea separada).",
  q3:[
   ["Ética formal (Moderna)","Kant: la moralidad no depende de la felicidad sino del deber; contraste entre ética material y formal."],
   ["Contractualismo liberal (Moderna)","Locke: la sociedad política nace de un pacto y no de la naturaleza; protege derechos individuales previos."],
   ["Pensamiento político contemporáneo","Arendt: la política como espacio de libertad y pluralidad; rescata la polis pero desde la acción entre iguales."]],
  tips:["No confundas «democracia» en Aristóteles con la democracia actual: para él es el gobierno de los pobres en su propio interés.","Explica siempre por qué la felicidad no puede ser placer, riqueza u honor."]},

 {id:"descartes",name:"Descartes",years:"1596–1650",era:"Moderna",block:"a",
  problem:"¿Existe un conocimiento absolutamente cierto y cuál es su fundamento?",
  works:[
   {t:"Discurso del método, parte II",d:"El ideal de un saber construido por uno solo y las cuatro reglas del método."},
   {t:"Meditaciones metafísicas I y II",d:"La duda metódica, el genio maligno, el cogito y el ejemplo de la cera."}],
  context:"Siglo XVII: revolución científica (Galileo, Kepler), crisis de la autoridad escolástica, guerras de religión y escepticismo renacentista (Montaigne). Descartes, matemático y físico, quiere dar a la filosofía la certeza de las matemáticas. Es el iniciador del racionalismo y de la filosofía moderna.",
  ideas:[
   "La razón es una y la misma en todos; los errores vienen de no usar un buen método.",
   "Método en cuatro reglas: evidencia (aceptar solo lo claro y distinto), análisis, síntesis y enumeración o revisión.",
   "Duda metódica: dudar de todo lo que admita la menor duda (errores de los sentidos, sueño, genio maligno) para hallar una verdad indudable.",
   "Primera verdad: pienso, luego existo. Aunque dude o me engañe, para dudar tengo que pensar.",
   "Soy una cosa que piensa (res cogitans): duda, entiende, afirma, niega, quiere, imagina y siente.",
   "El ejemplo de la cera: los cuerpos no se conocen por los sentidos ni la imaginación, sino por el entendimiento."],
  concepts:[
   ["Racionalismo","Corriente que sitúa en la razón, y no en la experiencia, la fuente del conocimiento cierto."],
   ["Evidencia","Ideas claras (presentes a la mente) y distintas (separadas de las demás)."],
   ["Duda metódica","Duda universal y provisional usada como método para llegar a la certeza."],
   ["Genio maligno","Hipótesis de un ser poderoso que me engaña incluso en las matemáticas."],
   ["Cogito","«Pienso, existo»: primera verdad, modelo de toda verdad."],
   ["Res cogitans / res extensa","Sustancia pensante y sustancia extensa: el dualismo cartesiano."]],
  q1:"Identifica si el texto expone el método (Discurso II) o el proceso de la duda y el cogito (Meditaciones). Formula el problema: ¿cómo alcanzar una verdad indudable? Explica la tesis y el encadenamiento: por qué dudo, hasta dónde llega la duda y qué resiste a ella.",
  q2:"Sitúa el texto en el proyecto cartesiano de reconstruir el saber: método, duda, cogito, criterio de evidencia, demostración de Dios como garantía y existencia del mundo; y el dualismo alma-cuerpo. Explica el papel de las ideas innatas.",
  q3:[
   ["Idealismo platónico (Antigua)","Platón: la verdad está en lo inteligible y los sentidos engañan; también defiende un saber innato (reminiscencia)."],
   ["Vitalismo (Contemporánea)","Nietzsche: crítica a la razón y a la idea de un sujeto pensante como algo evidente; el «yo» es una ficción gramatical."],
   ["Raciovitalismo (Contemporánea)","Ortega: la realidad radical no es el pensamiento sino la vida; razón vital frente a razón pura."]],
  tips:["La duda cartesiana no es escéptica: es un medio, no un fin.","No digas solo «pienso, luego existo»: explica por qué es indudable."]},

 {id:"locke",name:"Locke",years:"1632–1704",era:"Moderna",block:"b",
  problem:"¿Cuál es el origen y el límite legítimo del poder político?",
  works:[
   {t:"Segundo Tratado sobre el gobierno civil",d:"Párrafos seleccionados de los capítulos 2 (estado de naturaleza), 3 (estado de guerra), 4 (esclavitud), 5 (propiedad) y 9 (fines de la sociedad política)."}],
  context:"Inglaterra del siglo XVII: guerra civil, restauración de los Estuardo y Revolución Gloriosa de 1688, que consolida la monarquía parlamentaria. Locke, médico y filósofo, es el gran teórico del liberalismo político y uno de los fundadores del empirismo. Escribe contra el absolutismo y contra la tesis del poder divino de los reyes.",
  ideas:[
   "En el estado de naturaleza los hombres son libres e iguales y se rigen por la ley natural, que es la razón: nadie debe dañar a otro en su vida, salud, libertad o posesiones.",
   "El estado de naturaleza no es un estado de guerra (frente a Hobbes); la guerra surge cuando alguien usa la fuerza sin derecho.",
   "Nadie puede someterse a la esclavitud, porque nadie tiene poder absoluto sobre su propia vida.",
   "La propiedad nace del trabajo: al mezclar mi trabajo con lo natural, lo hago mío, siempre que quede suficiente para otros y no se eche a perder.",
   "El dinero, aceptado por consentimiento, permite acumular sin que los bienes se estropeen.",
   "Los hombres pactan formar la sociedad política para preservar su propiedad (vida, libertad y bienes), porque en el estado de naturaleza faltan ley establecida, juez imparcial y poder para ejecutar las sentencias."],
  concepts:[
   ["Estado de naturaleza","Situación previa a la sociedad política, de libertad e igualdad bajo la ley natural."],
   ["Ley natural","Ley de la razón que obliga a todos a no dañar a los demás."],
   ["Propiedad","En sentido amplio: vida, libertad y bienes."],
   ["Contrato social","Acuerdo libre por el que los individuos forman la sociedad política."],
   ["Consentimiento","Base de la legitimidad del gobierno."],
   ["Liberalismo","Doctrina que limita el poder del Estado para proteger los derechos individuales."]],
  q1:"Indica el capítulo y su tema: libertad natural, estado de guerra, esclavitud, propiedad o fines del gobierno. Formula el problema: ¿por qué abandonamos el estado de naturaleza? o ¿qué justifica la propiedad? Señala la tesis y los pasos del argumento.",
  q2:"Relaciona con el conjunto de su teoría política: ley natural, derechos naturales, contrato, división de poderes (legislativo y ejecutivo), primacía del legislativo, gobierno limitado y derecho de resistencia ante el tirano. Puedes mencionar su empirismo (no hay ideas innatas) como trasfondo.",
  q3:[
   ["Naturalismo político (Antigua)","Aristóteles: el ser humano es político por naturaleza y la polis no nace de un pacto."],
   ["Ética kantiana (Moderna, otra corriente)","Solo si la pregunta lo permite; mejor elegir otra época."],
   ["Pensamiento político contemporáneo","Arendt: la política como acción y pluralidad, no como protección de la propiedad; crítica al totalitarismo."]],
  tips:["Distingue el estado de naturaleza de Locke del de Hobbes.","La «propiedad» en Locke no es solo tener cosas."]},

 {id:"kant",name:"Kant",years:"1724–1804",era:"Moderna",block:"b",
  problem:"¿Qué hace que una acción sea moralmente buena?",
  works:[
   {t:"Fundamentación de la metafísica de las costumbres, sección 1",d:"La buena voluntad, el deber, el respeto a la ley y la primera formulación del imperativo."}],
  context:"Ilustración alemana: confianza en la razón y en la autonomía humana («¡Atrévete a saber!»), época de la Revolución francesa. Kant, profesor en Königsberg, intenta superar el racionalismo y el empirismo con su filosofía crítica, que examina los límites de la razón teórica y el uso práctico de la razón.",
  ideas:[
   "Lo único bueno sin restricción es una buena voluntad; las demás cualidades pueden ser malas si la voluntad es mala.",
   "La buena voluntad no es buena por lo que consigue, sino por el querer mismo.",
   "La razón no está destinada a darnos felicidad (el instinto lo haría mejor), sino a producir una voluntad buena.",
   "Una acción tiene valor moral si se hace por deber, no solo conforme al deber o por inclinación (ejemplo del tendero honrado por interés).",
   "El valor moral está en la máxima por la que se actúa, no en el fin que se busca.",
   "El deber es la necesidad de una acción por respeto a la ley. Ley: obra de modo que puedas querer que tu máxima se convierta en ley universal."],
  concepts:[
   ["Buena voluntad","Voluntad que actúa por deber; lo único bueno en sí mismo."],
   ["Deber","Necesidad de una acción por respeto a la ley moral."],
   ["Máxima","Principio subjetivo del querer de cada uno."],
   ["Imperativo categórico","Mandato incondicionado de la razón, válido para todos."],
   ["Imperativo hipotético","Mandato condicionado a un fin: si quieres X, haz Y."],
   ["Autonomía","Capacidad de la voluntad de darse a sí misma la ley moral."]],
  q1:"Formula el problema como «¿dónde reside el valor moral de una acción?». Identifica la tesis del fragmento (buena voluntad, deber, máxima o universalización) y cómo la argumenta con ejemplos (tendero, conservar la vida, beneficencia, falsa promesa).",
  q2:"Relaciona con la ética formal frente a las éticas materiales, los imperativos categórico e hipotético y sus formulaciones (universalidad, humanidad como fin), la autonomía de la voluntad y los postulados de la razón práctica. Menciona la Ilustración como marco.",
  q3:[
   ["Eudemonismo (Antigua)","Aristóteles: ética material y teleológica; la felicidad es el fin último, la virtud se adquiere con hábito."],
   ["Vitalismo (Contemporánea)","Nietzsche: crítica a la moral del deber como moral de esclavos y negación de la vida."],
   ["Pensamiento contemporáneo","Arendt: el mal banal de quien obedece sin pensar (Eichmann decía seguir el imperativo kantiano)."]],
  tips:["«Por deber» y «conforme al deber» no son lo mismo: explícalo con el tendero.","No conviertas la ética kantiana en una ética de consecuencias."]},

 {id:"nietzsche",name:"Nietzsche",years:"1844–1900",era:"Contemporánea",block:"a",
  problem:"¿Hay una verdad y un mundo verdadero más allá de la vida y el devenir?",
  works:[
   {t:"La gaya ciencia, §§ 110, 125, 343 y 355",d:"Origen del conocimiento, el hombre loco y la muerte de Dios, sus consecuencias y el miedo a lo desconocido."},
   {t:"Crepúsculo de los ídolos, «La razón en la filosofía»",d:"Crítica a los filósofos que momifican la realidad y a la fe en la gramática."}],
  context:"Segunda mitad del siglo XIX: auge de la ciencia positiva, darwinismo, crisis de los valores tradicionales y del cristianismo. Nietzsche, filólogo clásico, influido por Schopenhauer y la tragedia griega, es junto a Marx y Freud uno de los «maestros de la sospecha». Su filosofía se considera vitalismo.",
  ideas:[
   "Los filósofos odian el devenir: momifican la realidad en conceptos (ser, sustancia, cosa) y la declaran «mundo verdadero».",
   "Los sentidos no mienten; es la razón la que falsea su testimonio introduciendo unidad, permanencia y causalidad.",
   "Error de confundir lo último con lo primero: colocar los conceptos más vacíos y generales como causa de todo.",
   "La fe en la razón se apoya en la gramática: «temo que no nos libraremos de Dios mientras creamos en la gramática».",
   "La muerte de Dios (§125): los hombres han matado a Dios; se derrumban la moral y los valores que se apoyaban en él.",
   "Consecuencias (§343): crisis, pero también un mar abierto para los espíritus libres que pueden crear nuevos valores.",
   "El conocimiento nace de errores útiles para la vida (§110) y de la necesidad de reducir lo extraño a lo familiar (§355)."],
  concepts:[
   ["Vitalismo","Filosofía que toma la vida como realidad y valor fundamental."],
   ["Muerte de Dios","Pérdida de validez del fundamento de los valores occidentales."],
   ["Nihilismo","Desvalorización de los valores supremos; puede ser pasivo o activo."],
   ["Devenir","El cambio continuo que constituye la realidad."],
   ["Mundo verdadero","Ficción metafísica inventada para despreciar el mundo real."],
   ["Superhombre","Quien crea nuevos valores fieles a la tierra tras la muerte de Dios."]],
  q1:"Identifica si el texto es de La gaya ciencia (muerte de Dios, origen del conocimiento) o de Crepúsculo (crítica a la razón y a la metafísica). Problema: ¿existe un mundo verdadero tras el aparente? o ¿qué ocurre cuando muere Dios? Señala la tesis y el tono (aforístico, irónico) sin perder el argumento.",
  q2:"Relaciona con su crítica a la metafísica (platonismo), a la moral (moral de señores y esclavos) y a la religión; con el nihilismo, la transmutación de los valores, la voluntad de poder, el eterno retorno y el superhombre. Usa el perspectivismo: no hay hechos, solo interpretaciones.",
  q3:[
   ["Idealismo platónico (Antigua)","Platón: el blanco principal de Nietzsche; dualismo de mundos y desprecio del cuerpo y los sentidos."],
   ["Racionalismo (Moderna)","Descartes: confianza en la razón y en un sujeto sustancial; desconfianza de los sentidos."],
   ["Ética formal (Moderna)","Kant: moral universal del deber frente a la creación de valores."]],
  tips:["La «muerte de Dios» no es una tesis sobre la existencia de Dios: es un acontecimiento cultural.","Evita los tópicos: superhombre no es un ser superior por raza ni fuerza."]},

 {id:"arendt",name:"Arendt",years:"1906–1975",era:"Contemporánea",block:"b",
  problem:"¿Puede la actividad de pensar evitar que hagamos el mal? ¿Qué sentido tiene la política?",
  works:[
   {t:"Responsabilidad y juicio, «El pensar y las reflexiones morales»",d:"La banalidad del mal, Sócrates como modelo y el pensar como diálogo con uno mismo."},
   {t:"Introducción a la política, «La promesa de la política»",d:"El sentido de la política es la libertad; la política nace entre los hombres."}],
  context:"Judía alemana, discípula de Heidegger y Jaspers, huye del nazismo y se exilia en Estados Unidos. Su obra está marcada por la experiencia del totalitarismo, el Holocausto y la bomba atómica. En 1961 asiste como periodista al juicio de Eichmann en Jerusalén, del que surge la expresión «banalidad del mal».",
  ideas:[
   "La banalidad del mal: Eichmann no era un monstruo, sino alguien corriente e irreflexivo; el mal extremo puede surgir de la ausencia de pensamiento.",
   "Pregunta: ¿la actividad de pensar, examinar lo que sucede sin atender a resultados, podría condicionarnos para no hacer el mal?",
   "Pensar no es conocer: el conocimiento busca la verdad; el pensar busca el sentido o significado.",
   "Sócrates como modelo: tábano, comadrona y pez torpedo. Pensar es un diálogo silencioso conmigo mismo (el dos-en-uno): prefiero sufrir una injusticia antes que cometerla, para no vivir en desacuerdo conmigo.",
   "El juicio, facultad de juzgar casos particulares, hace visible el pensar en el mundo y puede evitar catástrofes en momentos críticos.",
   "El sentido de la política es la libertad. La política nace en el espacio entre los hombres, en la pluralidad; hoy la desconfianza hacia ella procede del totalitarismo y de la amenaza nuclear."],
  concepts:[
   ["Banalidad del mal","Mal cometido por personas normales por irreflexión, no por maldad demoníaca."],
   ["Pensar","Actividad que busca sentido; diálogo interior que no produce resultados."],
   ["Juicio","Facultad de distinguir lo bueno y lo malo en lo particular."],
   ["Pluralidad","Condición de la política: los hombres, no el hombre, habitan la tierra."],
   ["Acción","Actividad política por excelencia, que se da entre iguales y libres."],
   ["Totalitarismo","Forma de dominación que destruye la pluralidad y el espacio político."]],
  q1:"Identifica si el texto trata el pensar y el mal (Responsabilidad y juicio) o el sentido de la política (Introducción a la política). Formula el problema y la tesis; señala ejemplos (Eichmann, Sócrates) y cómo apoyan el argumento.",
  q2:"Relaciona con su análisis del totalitarismo, la distinción labor-trabajo-acción (La condición humana), la pluralidad, la natalidad, la distinción pensar-conocer y la importancia del juicio. Destaca su lectura de la tradición griega.",

  </div>
